<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCSR 案例 · 商品列表</title>
    <link rel="stylesheet" href="../demo.css" />
  </head>
  <body>
    <o-app src="../app.mjs">
      <template page>
        <style>
          .head { display: flex; align-items: baseline; gap: 12px; margin: 2px 2px 16px; }
          h2 { margin: 0; font-size: 22px; letter-spacing: -0.3px; }
          .count { color: var(--muted); font-size: 13px; }
          .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
          .item {
            display: block; background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 18px; text-decoration: none; color: inherit;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
          }
          .item:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 30px -16px rgba(15, 23, 42, 0.22);
            border-color: #d9dcff;
          }
          .thumb {
            width: 52px; height: 52px; border-radius: 14px; margin-bottom: 12px;
            display: grid; place-items: center; font-size: 26px; background: var(--accent-soft);
          }
          .name { display: block; font-weight: 600; }
          .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
          .id { color: var(--muted); font-size: 12px; background: #f1f3f9; padding: 2px 9px; border-radius: 999px; }
          .go { color: var(--accent); font-size: 13px; font-weight: 600; }
          .tip { margin: 18px 2px 0; color: var(--muted); font-size: 13px; }
          .tip code { background: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
        </style>
        <div class="wrap">
          <div class="head">
            <h2>商品列表</h2>
            <span class="count">{{items.length}} 件 · o-fill 渲染</span>
          </div>
          <div class="grid">
            <o-fill :value="items" fill-key="id">
              <a class="item" olink attr:href="'./detail.html?id=' + $data.id">
                <span class="thumb">{{$data.icon}}</span>
                <span class="name">{{$data.name}}</span>
                <span class="meta">
                  <span class="id">id: {{$data.id}}</span>
                  <span class="go">查看详情 →</span>
                </span>
              </a>
            </o-fill>
          </div>
          <p class="tip">
            <!-- 卡片链接在 o-fill 内：scsr 没有 hash 改写，href 就是文档
                相对路径（按页面文件所在目录解析），query 直接挂在真实路径上 -->
            卡片是 <code>olink + attr:href</code> 拼接的真实路径
            <code>./detail.html?id=N</code>，点击进入 query 传参演示。
          </p>
        </div>
<script>
  // 声明共享布局父页：同前缀导航时布局不销毁（顶栏常驻）
  export const parent = "./layout.html";

  export default {
    data: {
      items: [
        { id: 1, name: "机械键盘", icon: "⌨️" },
        { id: 2, name: "无线鼠标", icon: "🖱️" },
        { id: 3, name: "显示器", icon: "🖥️" },
        { id: 4, name: "降噪耳机", icon: "🎧" },
      ],
    },
  };
</script>
      </template>
    </o-app>

    <script type="module">
      import "../../../../ofajs/src/main.mjs";
      import "../../../src/scsr.mjs";

      window.__app = ofa("o-app");
    </script>
  </body>
</html>
