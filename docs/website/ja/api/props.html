<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>コンテンツ、属性、スタイル — ofa.js API</title>
    <meta name="description" content="テキスト、HTML、属性、クラス、インラインスタイルの読み書き。" />
    <meta name="theme-color" content="#1a1c1e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="コンテンツ、属性、スタイル — ofa.js API" />
    <meta property="og:description" content="テキスト、HTML、属性、クラス、インラインスタイルの読み書き。" />
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="../../styles/loading.css"
      media="print"
      onload="this.media='all'"
    />
    <script>
      // 首次访问默认深色；可在顶部切换白天 / 黑夜 / 跟随系统（尊重已有偏好）
      try {
        if (!localStorage.getItem("st-theme-mode"))
          localStorage.setItem("st-theme-mode", "dark");
      } catch {}
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@main/packages/boot/st-boot.js"></script>
    <noscript><style>#site-loading { display: none; }</style></noscript>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Roboto", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #c3c7cf;
      }

      /* 首屏 critical：只保定位/尺寸/遮罩，装饰样式在 styles/loading.css */
      #site-loading {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        transition: opacity 0.22s ease;
      }

      #site-loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .site-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(260px, 70vw);
      }

      .site-loading-logo {
        display: block;
        width: auto;
        height: 30px;
      }

    </style>
  </head>
  <body>
    <div id="site-loading" role="status" aria-live="polite">
      <div class="site-loading-inner">
        <div class="site-loading-brand" aria-hidden="true">
          <img class="site-loading-logo" src="../../assets/logo.svg" width="28" height="30" alt="" />
          <span class="site-loading-wordmark">ofa<span>.js</span></span>
        </div>
        <div class="site-loading-bar" aria-hidden="true"></div>
        <div class="site-loading-label">
          <span class="site-loading-label-zh">正在加载页面…</span>
          <span class="site-loading-label-tcn">正在載入頁面…</span>
          <span class="site-loading-label-ja">ページを読み込み中…</span>
          <span class="site-loading-label-en">Loading page…</span>
        </div>
      </div>
    </div>

    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../../app.mjs">
      <template page>

  <link rel="stylesheet" href="../../styles/site.css" />
  <link rel="stylesheet" href="../../styles/docs.css" />
  <l-m src="../../components/docs-layout.html"></l-m>

  <docs-layout layout="wide" attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc doc-wide">
      <p class="doc-kicker">API · コンテンツ・属性・スタイル</p>
      <h1>コンテンツ・属性・スタイル</h1>
      <p class="doc-lead">テキスト、HTML、属性、クラス、インラインスタイルを読み書きします。</p>

<l-m src="../../components/playground.html"></l-m>
      <docs-playground example="props"></docs-playground>

      <h2>メンバー</h2>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead><tr><th>メンバー</th><th>説明</th></tr></thead>
        <tbody>
          <tr><td><code>el.text</code></td><td>textContent の読み書き（リアクティブ）</td></tr>
          <tr><td><code>el.html</code></td><td>innerHTML の読み書き（リアクティブ）</td></tr>
          <tr><td><code>el.attr(name[, value])</code></td><td>HTML 属性の読み書き。コンポーネント内の相対 href/src は自動的に PATH を基準に解決されます</td></tr>
          <tr><td><code>el.prop(name[, value])</code></td><td>データプロパティの読み書き（el[name] と同じ）。ドットパスに対応します</td></tr>
          <tr><td><code>el.class(name[, bool])</code></td><td>クラスの読み取り / 付け外し</td></tr>
          <tr><td><code>el.classList</code></td><td>ネイティブな DOMTokenList</td></tr>
          <tr><td><code>el.data</code></td><td>ネイティブな dataset（リアクティブではありません）</td></tr>
          <tr><td><code>el.style</code></td><td>ネイティブなインラインスタイルオブジェクト（リアクティブではありません）</td></tr>
          <tr><td><code>el.css</code></td><td>スタイルプロキシ。インライン値がない場合は計算済みスタイルにフォールバックし、--変数にも対応します</td></tr>
          <tr><td><code>el.refresh()</code></td><td>更新イベントを手動で 1 回発行します</td></tr>
        </tbody>
      </table>
        </div>
      <div class="doc-note">
        <strong>ヒント：</strong>el.css はプロパティ単位（el.css.color）での書き込み、オブジェクトとしての一括置換、文字列としての一括置換のいずれも可能です。
      </div>


      <p class="doc-end">
        <a olink href="./index.html">← API 総覧に戻る</a>
      </p>
    </article>
  </docs-layout>

  <script>
    import { createDocsPage } from "../../content/page-runtime.mjs";

    export const parent = "../layout.html";

    export default (args) =>
      createDocsPage({ ...args, sitePath: "../site.json" });
  </script>

      </template>
    </o-app>

    <noscript>このページで ofa.js を実行するには JavaScript が必要です。</noscript>

    <script type="module" src="../../boot.js"></script>
  </body>
</html>
