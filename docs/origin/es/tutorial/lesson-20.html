<h2>Qué usa esta lección</h2>
<ul>
  <li><code>sync:value</code> / <code>sync:checked</code>: edición de formularios y de elementos de la lista;</li>
  <li><code>o-fill</code> + <code>fill-key</code>: renderizado y reutilización de la lista;</li>
  <li><code>get visibleItems()</code> / <code>get remaining()</code>: filtrado y recuentos;</li>
  <li><code>watch.items</code>: escribe en localStorage cuando los datos cambian.</li>
</ul>
<p>
  Prueba a refrescar la vista previa de la derecha: las tareas se restauran, porque <code>watch</code>
  las escribió en el almacenamiento del navegador cuando los datos cambiaron.
</p>
