<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ofa.js Docs</title>
    <meta name="description" content="ofa.js v5 documentation overview: installation, components, pages, routing, state, and API reference." />
    <meta name="theme-color" content="#1a1c1e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ofa.js Docs" />
    <meta property="og:description" content="ofa.js v5 documentation overview: installation, components, pages, routing, state, and API reference." />
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="../../styles/loading.css"
      media="print"
      onload="this.media='all'"
    />
    <script>
      // 首次访问默认深色；可在顶部切换白天 / 黑夜 / 跟随系统（尊重已有偏好）
      try {
        if (!localStorage.getItem("st-theme-mode"))
          localStorage.setItem("st-theme-mode", "dark");
      } catch {}
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@main/packages/boot/st-boot.js"></script>
    <noscript><style>#site-loading { display: none; }</style></noscript>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Roboto", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #c3c7cf;
      }

      /* 首屏 critical：只保定位/尺寸/遮罩，装饰样式在 styles/loading.css */
      #site-loading {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        transition: opacity 0.22s ease;
      }

      #site-loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .site-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(260px, 70vw);
      }

      .site-loading-logo {
        display: block;
        width: auto;
        height: 30px;
      }

    </style>
  </head>
  <body>
    <div id="site-loading" role="status" aria-live="polite">
      <div class="site-loading-inner">
        <div class="site-loading-brand" aria-hidden="true">
          <img class="site-loading-logo" src="../../assets/logo.svg" width="28" height="30" alt="" />
          <span class="site-loading-wordmark">ofa<span>.js</span></span>
        </div>
        <div class="site-loading-bar" aria-hidden="true"></div>
        <div class="site-loading-label">
          <span class="site-loading-label-zh">正在加载页面…</span>
          <span class="site-loading-label-tcn">正在載入頁面…</span>
          <span class="site-loading-label-en">Loading page…</span>
        </div>
      </div>
    </div>

    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../../app.mjs">
      <template page>

  <link rel="stylesheet" href="../../styles/site.css" />
  <link rel="stylesheet" href="../../styles/docs.css" />
  <l-m src="../../components/docs-layout.html"></l-m>

    <docs-layout attr:label-on-this-page="site.docs.onThisPage">
      <article class="doc docs-intro">
        <p class="doc-kicker">Documentation</p>
        <h1>ofa.js Docs</h1>
        <p class="doc-lead">
          From a single script tag to components, pages, templates, state, routing, and deployment.
          The docs are organized in the order you'll use them, or jump straight to the chapter you need from the table of contents on the left.
        </p>

        <div class="docs-list">
          <a class="docs-row" olink href="./getting-started.html">
            <span class="num">01</span>
            <h2>Installation</h2>
            <p>Load ofa.js from a CDN or a local dist build and run your first page.</p>
            <span class="more">Start reading →</span>
          </a>

          <a class="docs-row" olink href="./first-component.html">
            <span class="num">02</span>
            <h2>Your First Component</h2>
            <p>Create a custom Web Component and understand tag, attrs, data, and slots.</p>
            <span class="more">Start reading →</span>
          </a>

          <a class="docs-row" olink href="./template.html">
            <span class="num">03</span>
            <h2>Template Directives Overview</h2>
            <p>Learn interpolation, attributes, events, two-way binding, conditionals, and lists in one go.</p>
            <span class="more">Start reading →</span>
          </a>

          <a class="docs-row" olink href="./routing.html">
            <span class="num">04</span>
            <h2>Routing and Navigation</h2>
            <p>The o-app page stack, goto/replace/back, o-router, and nested layouts.</p>
            <span class="more">Start reading →</span>
          </a>

          <a class="docs-row" olink href="./api.html">
            <span class="num">05</span>
            <h2>$.fn and Wrapped Objects</h2>
            <p>Selection, tree navigation, DOM manipulation, events, stanz, and instance extensions.</p>
            <span class="more">Start reading →</span>
          </a>

          <a class="docs-row" olink href="../api/">
            <span class="num">06</span>
            <h2>API Reference</h2>
            <p>Instance members, global static members, and runnable VSCode examples.</p>
            <span class="more">Go to API →</span>
          </a>

          <a class="docs-row" olink href="./examples.html">
            <span class="num">07</span>
            <h2>Complete Examples</h2>
            <p>A minimal page, custom components, a todo list, and a routing app.</p>
            <span class="more">Start reading →</span>
          </a>

          <a class="docs-row" olink href="./playground.html">
            <span class="num">08</span>
            <h2>Playground</h2>
            <p>Edit and run ofa.js page modules inside the NoneOS virtual container.</p>
            <span class="more">Open playground →</span>
          </a>
        </div>

        <h2>What the Docs Cover</h2>
        <div class="doc-table-wrap">
<table class="doc-table">
          <thead>
            <tr><th>Chapter</th><th>Contents</th></tr>
          </thead>
          <tbody>
            <tr><td>Getting Started</td><td>Installation, your first component, your first page</td></tr>
            <tr><td>Components and Pages</td><td>Component contract, page modules, lifecycle</td></tr>
            <tr><td>Template Syntax</td><td>Directive overview, bindings and styles, events and forms, conditionals and lists</td></tr>
            <tr><td>Data and State</td><td>data, computed properties, watch, $.stanz, provider/consumer</td></tr>
            <tr><td>Apps and Routing</td><td>o-app, o-router, nested routing, scsr real paths</td></tr>
            <tr><td>Reference</td><td>$.fn and wrapped objects, instance API, plugins, common pitfalls, complete examples, playground, deployment</td></tr>
          </tbody>
        </table>
        </div>

        <div class="doc-note">
          <strong>Where should I start?</strong>
          If this is your first time, begin with Installation; if you already have a page running,
          go straight to Template Directives Overview or pick a chapter from the table of contents on the left.
        </div>
      </article>
    </docs-layout>

  <script>
    import { createDocsPage } from "../../content/page-runtime.mjs";

    export const parent = "../layout.html";

    export default (args) =>
      createDocsPage({ ...args, sitePath: "../site.json" });
  </script>

      </template>
    </o-app>

    <noscript>This page requires JavaScript to run ofa.js.</noscript>

    <script type="module" src="../../boot.js"></script>
  </body>
</html>
