        if (!localStorage.getItem("st-theme-mode"))
          localStorage.setItem("st-theme-mode", "dark");
      } catch {}

      <h1>本地持久化</h1>
      <p class="doc-lead">刷新页面后数据通常会丢失。把内容写入 localStorage，就能在下次打开时恢复。</p>

      <h2>试一试</h2>
      <p>修改右侧代码后点「运行代码」，观察结果如何变化。</p>

      <l-m src="../../components/playground.html"></l-m>
      <docs-playground lesson="lesson-12"></docs-playground>

      <h2>关键点</h2>
      <ul>
        <li><code>ready()</code> 里读取 localStorage 初始化数据。</li>
        <li><code>watch.note</code> 在内容变化时写回 localStorage。</li>
        <li>写入和读取都要包在 try/catch 里，处理隐私模式等异常。</li>
      </ul>

      <div class="doc-note">
        <strong>挑战：</strong>把待办列表存进 localStorage，刷新预览后仍能看到之前的待办。
      </div>
