      <p class="doc-kicker">Tutorial · 02</p>
      <h1>数据与事件</h1>
      <p class="doc-lead">
        ofa.js 不需要手动操作 DOM。改 data，页面自动更新；
        用户操作通过 <code>on:</code> 和 <code>sync:</code> 回到 data。
      </p>

      <h2>计数器</h2>
      <p>
        试着多点几次 <code>+1</code>，然后在输入框里写点东西。
        观察 <code>{{count}}</code> 和 <code>{{note}}</code> 如何同步变化。
      </p>

      <l-m src="../../components/playground.html"></l-m>
      <docs-playground lesson="lesson-2"></docs-playground>

      <h2>三个关键点</h2>
      <ul>
        <li>
          <code>on:click="count++"</code>：事件绑定的值是一个 JS 表达式；
        </li>
        <li>
          <code>sync:value="note"</code>：输入框和数据双向绑定；
        </li>
        <li>
          <code>proto</code>：放方法。模板里的方法名会自动绑定
          <code>this</code>，所以 <code>reset()</code> 能直接改 data。
        </li>
      </ul>

      <div class="doc-note">
        <strong>常见坑：</strong>
        模板里用到的每个字段都要在 <code>data</code> 里先声明。
        少写一个 <code>note: ""</code>，整页会抛
        <code>ReferenceError</code>，而不是显示空白。
      </div>

      <h2>挑战</h2>
      <p>
        加一个 <code>-1</code> 按钮；再给计数器加一个「双倍」显示，
        用 <code>proto</code> 里的 getter 计算。
      </p>

      </p>
