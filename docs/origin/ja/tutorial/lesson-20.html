      <h1>まとめ：Todo リスト</h1>
      <p class="doc-lead">リスト、フォーム、条件分岐、算出プロパティ、監視、localStorage を1つの完全なアプリに組み合わせます。</p>

      <p>

</p>

<h2>このレッスンで使うもの</h2>
<ul>
  <li><code>sync:value</code> / <code>sync:checked</code>: フォームとリスト項目の編集。</li>
  <li><code>o-fill</code> + <code>fill-key</code>: リストの描画と再利用。</li>
  <li><code>get visibleItems()</code> / <code>get remaining()</code>: フィルタリングと件数。</li>
  <li><code>watch.items</code>: データが変わったときに localStorage へ書き込みます。</li>
</ul>
<p>
  右側のプレビューを更新してみてください。データが変わったときに <code>watch</code> が
  ブラウザストレージへ書き込んでいるので、Todo は復元されます。
</p>
<div class="doc-note">
  <strong>次のステップ:</strong> Todo をコンポーネントに分割し（レッスン12〜14）、
  <code>$.stanz</code> でページ間で共有し（レッスン16）、レイアウトで全体を包みましょう（レッスン18）。
  それで完全なアプリになります。
</div>

</p>
