<template component>
  <style>
    :host {
      display: block;
      --counter-accent: #7c5cff;
      --counter-cyan: #22d3ee;
    }

    * {
      box-sizing: border-box;
    }

    .counter {
      position: relative;
      overflow: hidden;
      padding: 18px 18px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      background:
        radial-gradient(120% 100% at 100% 0%, rgba(34, 211, 238, 0.13), transparent 55%),
        radial-gradient(100% 90% at 0% 0%, rgba(124, 92, 255, 0.16), transparent 60%),
        rgba(9, 12, 21, 0.78);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.06),
        0 18px 40px rgba(2, 4, 10, 0.45);
    }

    .counter::after {
      content: "";
      position: absolute;
      inset: -40% -20% auto auto;
      width: 160px;
      height: 160px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(124, 92, 255, 0.28), transparent 65%);
      filter: blur(6px);
      pointer-events: none;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8c99b4;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #5eead4;
      letter-spacing: 0.1em;
    }

    .live i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #2dd4bf;
      box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.12);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.8);
      }
    }

    .value {
      position: relative;
      z-index: 1;
      font-size: 54px;
      font-weight: 750;
      line-height: 1;
      letter-spacing: -0.055em;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(120deg, #ffffff 10%, #c4b5fd 55%, #67e8f9 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .value small {
      margin-left: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #7c8aa5;
      -webkit-text-fill-color: #7c8aa5;
    }

    .actions {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: #dfe6f5;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.24);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0) scale(0.97);
    }

    button:focus-visible {
      outline: 2px solid #22d3ee;
      outline-offset: 2px;
    }

    button.primary {
      border-color: transparent;
      background: linear-gradient(120deg, #7c5cff, #4f46e5);
      color: #fff;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.35);
    }

    button.primary:hover {
      background: linear-gradient(120deg, #8b6dff, #5b52ff);
    }

    .hint {
      position: relative;
      z-index: 1;
      margin: 12px 0 0;
      font-size: 11.5px;
      color: #75819a;
    }

    .hint b {
      color: #a5b4cf;
      font-weight: 600;
    }
  </style>

  <div class="counter">
    <div class="meta">
      <span>Reactive Counter</span>
      <span class="live"><i></i>Live</span>
    </div>

    <div class="value">{{currentValue}}<small>次</small></div>

    <div class="actions">
      <button type="button" on:click="decrement" aria-label="减一">−1</button>
      <button type="button" class="primary" on:click="increment" aria-label="加一">+1</button>
      <button type="button" on:click="resetCount">重置</button>
    </div>

    <p class="hint">改数据 → 界面自动更新，<b>没有一行手动 DOM</b></p>
  </div>

  <script>
    export default {
      tag: "demo-counter",
      attrs: { start: 0 },
      data: { currentValue: 0 },
      watch: {
        start(val) {
          this.currentValue = Number(val) || 0;
        },
      },
      proto: {
        increment() {
          this.currentValue += 1;
        },
        decrement() {
          this.currentValue -= 1;
        },
        resetCount() {
          this.currentValue = Number(this.start) || 0;
        },
      },
      ready() {
        this.currentValue = Number(this.start) || 0;
      },
    };
  </script>
</template>
