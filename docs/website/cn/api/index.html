      <h2>先试一个：用全局 $ 操作 body 元素</h2>
      <p>
        这个示例不是 page 模块：<code>body</code> 里直接写
        <code>&lt;div id="target"&gt;</code>，下面的 <code>&lt;script type="module"&gt;</code>
        用全局 <code>$("#target")</code> 取到元素并绑定点击事件，像 jQuery 一样直接操作 DOM。
        改代码后按 <kbd>Ctrl</kbd>+<kbd>S</kbd> 或「运行代码」看效果。
      </p>

      <l-m src="../../components/playground.html"></l-m>

      <div class="doc-note">
        <strong>API 适合非模板方式的语法：</strong>
        这里的实例方法与全局 <code>$</code> 用于在 JS 里动态查找/创建节点、读写数据、
        绑定事件、控制页面栈等。模板里能用 <code>on:</code>、<code>o-if</code>、
        <code>o-fill</code>、<code>attr:</code> 表达的逻辑，优先留在模板里。
      </div>
