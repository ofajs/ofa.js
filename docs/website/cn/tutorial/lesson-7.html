      <p class="doc-lead">表单提交前先检查数据。错误提示、按钮禁用和成功消息都可以由计算属性驱动。</p>

      <h2>关键点</h2>
      <ul>
        <li><code>nameError</code> / <code>emailError</code> 是 getter，返回空字符串表示通过。</li>
        <li><code>attr:disabled="!valid"</code> 用 attribute 绑定控制按钮是否可点。</li>
        <li><code>on:submit</code> 里先 <code>preventDefault()</code>，再处理提交。</li>
      </ul>
