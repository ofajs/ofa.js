<!doctype html>
<html lang="zh-CN" class="st-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>扩展实例 — ofa.js API</title>
    <meta name="description" content="在单个实例或全部实例上增加方法、getter 和新指令。" />
    <meta name="theme-color" content="#1a1c1e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="扩展实例 — ofa.js API" />
    <meta property="og:description" content="在单个实例或全部实例上增加方法、getter 和新指令。" />
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script>
      // 官网为纯深色设计：首次访问锁定 senti-ui 深色主题（尊重用户已有偏好）
      try {
        if (!localStorage.getItem("st-theme-mode"))
          localStorage.setItem("st-theme-mode", "dark");
      } catch {}
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@main/packages/boot/st-boot.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Roboto", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #c3c7cf;
      }
    </style>
  </head>
  <body>
    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../../app.mjs">
      <template page>

  <link rel="stylesheet" href="../../styles/site.css" />
  <link rel="stylesheet" href="../../styles/docs.css" />
  <l-m src="../../components/docs-layout.html"></l-m>

  <docs-layout layout="wide" attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc doc-wide">
      <p class="doc-kicker">API · 扩展实例</p>
      <h1>扩展实例</h1>
      <p class="doc-lead">在单个实例或全部实例上增加方法、getter 和新指令。</p>

<l-m src="../../components/playground.html"></l-m>
      <docs-playground example="extend"></docs-playground>

      <h2>成员</h2>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead><tr><th>成员</th><th>说明</th></tr></thead>
        <tbody>
          <tr><td><code>el.extend(obj, options)</code></td><td>只扩展当前实例；默认不可枚举</td></tr>
          <tr><td><code>$.fn.extend(obj)</code></td><td>扩展到所有实例；可定义 getter / setter 作为新指令</td></tr>
          <tr><td><code>enumerable: true</code></td><td>显式让扩展可枚举（会影响 Object.keys / toJSON）</td></tr>
        </tbody>
      </table>
        </div>
      <div class="doc-note">
        <strong>提示：</strong>扩展名不要与内置成员（attr、class、text、html、watch 等）冲突。
      </div>


      <p class="doc-end">
        <a olink href="./index.html">← 返回 API 总览</a>
      </p>
    </article>
  </docs-layout>

  <script>
    import { createDocsPage } from "../../content/page-runtime.mjs";

    export const parent = "../layout.html";

    export default (args) =>
      createDocsPage({ ...args, sitePath: "../site.json" });
  </script>

      </template>
    </o-app>

    <noscript>此页面需要启用 JavaScript 才能运行 ofa.js。</noscript>

    <script type="module" src="../../boot.js"></script>
  </body>
</html>
