      <h1>Conditional rendering</h1>
      <p class="doc-lead">o-if / o-else-if / o-else control whether content is present.</p>

      <p>
  To show different content based on state, use <code>&lt;o-if :value="condition"&gt;</code>.
  When the condition is false the content is removed; when it is true the content is
  created again.
</p>
<l-m src="{{SITE}}/components/playground.html"></l-m>
      <docs-playground lesson="lesson-7" fold-styles="true"></docs-playground>
<h2>The three tags must be consecutive</h2>
<ul>
  <li><code>o-if</code> must have a <code>:value</code>;</li>
  <li><code>o-else-if</code> tests the next condition;</li>
  <li><code>o-else</code> takes no <code>:value</code> and acts as the final fallback.</li>
</ul>
<div class="doc-note">
  <strong>Use class for frequent toggling:</strong> if you are only switching a color
  or showing/hiding something, prefer <code>class:</code> so the DOM is kept;
  <code>o-if</code> destroys and recreates content, so it suits conditions that
  rarely change or cases where resources really need to be released.
</div>
