      <p class="doc-kicker">Tutorial · 15</p>
      <h1>Cross-Level Context</h1>
      <p class="doc-lead">Once the component hierarchy gets deep, passing attrs down level by level is tedious; use o-provider and o-consumer to put data into a subtree so descendants can consume it by name from the nearest ancestor.</p>

      <p>
        So far, data has been passed from parent to child components with <code>attrs</code>.
        If one piece of data has to cross many component layers, forwarding it level by level
        becomes exhausting. <code>o-provider</code> attaches data to an ancestor, and an
        <code>o-consumer</code> at any depth below can read it directly.
      </p>

      <l-m src="{{SITE}}/components/playground.html"></l-m>
      <docs-playground lesson="lesson-15" fold-styles="true"></docs-playground>

      <h2>Three cards</h2>
      <ul>
        <li>The first two cards are inside the <code>o-provider</code> and read the provider's Yao / maintainer;</li>
        <li>The third card is outside the provider, so it falls back to the default user of <code>o-root-provider</code>;</li>
        <li>The component's <code>o-consumer</code> uses <code>watch:user-name="name"</code> to sync the context property into its own data.</li>
      </ul>

      <div class="doc-note">
        <strong>Three easy pitfalls:</strong>
        <ul>
          <li>A provider's HTML attribute is read only once at initialization; to update at runtime, change its data property directly (<code>provider.userName = ...</code> in the example) — <code>setAttribute</code> does not broadcast.</li>
          <li>The provider must be an ancestor of the consumer; neither siblings nor outer levels can find it.</li>
          <li>Declare default values in <code>data</code> for any fields the consumer syncs, otherwise initialization throws a <code>ReferenceError</code>.</li>
        </ul>
      </div>

      <h2>How to choose vs. global state</h2>
      <p>
        Use provider / consumer for data shared by only one component subtree;
        use <code>$.stanz</code> from the next lesson for state shared across pages
        and the whole app. For style context such as theme colors and sizes,
        prefer CSS variables or <code>match-var</code>.
      </p>

      <h2>Try it yourself</h2>
      <p>
        Add a <code>user-department</code> field to the provider and show the department in the cards;
        then add a button to the provider that switches the user for the whole subtree.
      </p>
