<html lang="zh-CN" class="st-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01 · 第一个页面 — ofa.js 教程</title>
    <meta name="description" content="从零写一个 ofa.js 页面，修改文本并实时预览。" />
    <meta name="theme-color" content="#1a1c1e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="01 · 第一个页面 — ofa.js 教程" />
    <meta property="og:description" content="从零写一个 ofa.js 页面，修改文本并实时预览。" />
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script>
      // 官网为纯深色设计：首次访问锁定 senti-ui 深色主题（尊重用户已有偏好）
      try {
        if (!localStorage.getItem("st-theme-mode"))
          localStorage.setItem("st-theme-mode", "dark");
      } catch {}
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui/packages/boot/st-boot.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Roboto", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #c3c7cf;
      }
    </style>
  </head>
  <body>
    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../../app.mjs">
      <template page>

  <link rel="stylesheet" href="../../styles/site.css" />
  <link rel="stylesheet" href="../../styles/docs.css" />
  <l-m src="../../components/docs-layout.html"></l-m>

  <docs-layout attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc">
      <p class="doc-kicker">Tutorial · 01</p>
      <h1>第一个页面</h1>
      <p class="doc-lead">
        一个 ofa.js 页面就是一个 HTML 文件。把页面结构写进
        <code>&lt;template page&gt;</code>，把数据写进 <code>data</code>，
        用 <code>{{ }}</code> 显示出来。
      </p>

      <h2>先运行一次</h2>
      <p>
        下面的代码已经在虚拟容器里运行了。找到
        <code>name: "世界"</code>，改成你的名字，再点「运行代码」。
      </p>

      <l-m src="../../components/playground.html"></l-m>
      <docs-playground lesson="lesson-1"></docs-playground>

      <h2>你刚刚用到了什么</h2>
      <ul>
        <li><code>&lt;template page&gt;</code>：声明这是一个页面模块；</li>
        <li><code>data</code>：页面的响应式数据；</li>
        <li><code>{{name}}</code>：把数据插入到文本里；</li>
        <li><code>&lt;style&gt;</code>：只作用于这个页面的样式。</li>
      </ul>

      <div class="doc-note">
        <strong>小挑战：</strong>
        再加一个 <code>&lt;p&gt;</code>，显示一句自我介绍；
        在 data 里新增一个字段，用 <code>{{ }}</code> 渲染它。
      </div>

      <p class="doc-end">
        下一篇：<a olink href="./lesson-2.html">02 · 数据与事件 →</a>
      </p>
    </article>
  </docs-layout>

  <script>
    import { createTutorialPage } from "../../content/page-runtime.mjs";

    export const parent = "../layout.html";

    export default (args) =>
      createTutorialPage({ ...args, sitePath: "../site.json" });
  </script>

      </template>
    </o-app>

    <noscript>此页面需要启用 JavaScript 才能运行 ofa.js。</noscript>

    <script type="module" src="../../boot.js"></script>
  </body>
</html>
