<l-m src="../../components/playground.html"></l-m>

      <div class="doc-table-wrap">
<table class="doc-table">
        <thead><tr><th>成员</th><th>说明</th></tr></thead>
        <tbody>
          <tr><td><code>el.getProvider(name)</code></td><td>沿 shadow 边界向上查找同名 o-provider，找不到时回落到 o-root-provider，都没有返回 null</td></tr>
          <tr><td><code>provider.dispatch(name, { data })</code></td><td>向该 provider 的 consumer 派发自定义事件</td></tr>
          <tr><td><code>$.getRootProvider(name)</code></td><td>取应用级 root provider 实例</td></tr>
        </tbody>
      </table>
