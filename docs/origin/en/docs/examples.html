      <h1>Complete Examples</h1>
      <p class="doc-lead">
        Four complete examples, from the smallest page to a routed app. Save them as
        files and serve them from a static server to run them.
      </p>

      <h2>Example 1: Minimal page</h2>
      <p><strong>index.html</strong></p>
      <pre><code>&lt;!doctype html&gt;
&lt;html lang="en"&gt;
  &lt;head&gt;
    &lt;meta charset="UTF-8" /&gt;
    &lt;title&gt;ofa.js minimal app&lt;/title&gt;
    &lt;script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/dist/ofa.min.mjs"
    &gt;&lt;/script&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;o-page src="./page.html"&gt;&lt;/o-page&gt;
  &lt;/body&gt;
&lt;/html&gt;</code></pre>

      <p><strong>page.html</strong></p>
      <pre><code>&lt;template page&gt;
  &lt;style&gt;
    :host { display: block; padding: 20px; font-family: sans-serif; }
    button { padding: 6px 16px; cursor: pointer; }
  &lt;/style&gt;

  &lt;h1&gt;{{title}}&lt;/h1&gt;
  &lt;p&gt;Count: {{count}}, double: {{doubleCount}}&lt;/p&gt;
  &lt;button on:click="count++"&gt;+1&lt;/button&gt;
  &lt;button on:click="reset"&gt;Reset&lt;/button&gt;

  &lt;script&gt;
    export default async () =&gt; ({
      data: { title: "Hello ofa.js", count: 0 },
      proto: {
        get doubleCount() {
          return this.count * 2;
        },
        reset() {
          this.count = 0;
        },
      },
    });
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <h2>Example 2: Custom component</h2>
      <p><strong>my-counter.html</strong></p>
      <pre><code>&lt;template component&gt;
  &lt;style&gt;
    :host {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid #4caf50;
      border-radius: 8px;
    }
  &lt;/style&gt;

  &lt;span&gt;&lt;slot&gt;&lt;/slot&gt;&lt;/span&gt;
  &lt;strong&gt;{{currentValue}}&lt;/strong&gt;
  &lt;button on:click="increment"&gt;+&lt;/button&gt;
  &lt;button on:click="decrement"&gt;-&lt;/button&gt;

  &lt;script&gt;
    export default {
      tag: "my-counter",
      attrs: { initialValue: 0 },
      data: { currentValue: 0 },
      watch: {
        initialValue(value) {
          this.currentValue = value;
        },
      },
      ready() {
        this.currentValue = this.initialValue;
      },
      proto: {
        increment() {
          this.currentValue += 1;
          this.emit("change", { data: { value: this.currentValue } });
        },
        decrement() {
          this.currentValue -= 1;
          this.emit("change", { data: { value: this.currentValue } });
        },
      },
    };
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <p><strong>Using the component</strong></p>
      <pre><code>&lt;template page&gt;
  &lt;l-m src="./my-counter.html"&gt;&lt;/l-m&gt;

  &lt;my-counter :initial-value="5" on:change="onChange"&gt;
    Current count
  &lt;/my-counter&gt;
  &lt;p&gt;{{log}}&lt;/p&gt;

  &lt;script&gt;
    export default async () =&gt; ({
      data: { log: "" },
      proto: {
        onChange(event) {
          this.log = "change -> " + event.data.value;
        },
      },
    });
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <h2>Example 3: Todo list</h2>
      <pre><code>&lt;template page&gt;
  &lt;style&gt;
    :host { display: block; padding: 20px; }
    .done { text-decoration: line-through; opacity: 0.6; }
    li { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
  &lt;/style&gt;

  &lt;h2&gt;Todos ({{todos.length}})&lt;/h2&gt;

  &lt;input
    sync:value="draft"
    on:keydown="addOnEnter($event)"
    placeholder="Enter a todo, then press Enter"
  /&gt;

  &lt;ul&gt;
    &lt;o-fill :value="todos" fill-key="id"&gt;
      &lt;li class:done="$data.done"&gt;
        &lt;input type="checkbox" sync:checked="$data.done" /&gt;
        &lt;span&gt;{{$data.text}}&lt;/span&gt;
        &lt;button on:click="$host.remove($data.id)"&gt;×&lt;/button&gt;
      &lt;/li&gt;
    &lt;/o-fill&gt;
  &lt;/ul&gt;

  &lt;script&gt;
    let uid = 1;

    export default async () =&gt; ({
      data: {
        draft: "",
        todos: [{ id: 1, text: "Learn ofa.js", done: false }],
      },
      proto: {
        addOnEnter(event) {
          if (event.key !== "Enter") return;
          const text = this.draft.trim();
          if (!text) return;
          this.todos.push({ id: ++uid, text, done: false });
          this.draft = "";
        },
        remove(id) {
          const index = this.todos.findIndex((item) =&gt; item.id === id);
          if (index &gt; -1) this.todos.splice(index, 1);
        },
      },
    });
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <h2>Example 4: Routed app</h2>
      <p><strong>index.html</strong></p>
      <pre><code>&lt;!doctype html&gt;
&lt;html lang="en"&gt;
  &lt;head&gt;
    &lt;meta charset="UTF-8" /&gt;
    &lt;title&gt;ofa.js routed app&lt;/title&gt;
    &lt;script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/dist/ofa.min.mjs"
    &gt;&lt;/script&gt;
    &lt;script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/packages/router/dist/router.min.mjs"
    &gt;&lt;/script&gt;
    &lt;style&gt;
      html, body { margin: 0; padding: 0; height: 100%; }
      o-app { display: block; height: 100%; }
    &lt;/style&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;o-router fix-body&gt;
      &lt;o-app src="./app-config.js"&gt;&lt;/o-app&gt;
    &lt;/o-router&gt;
  &lt;/body&gt;
&lt;/html&gt;</code></pre>
