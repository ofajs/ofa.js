      <h1>计算属性与侦听</h1>
      <p class="doc-lead">proto 的 getter 做同步计算，watch 观察变化并处理副作用。</p>

      <p>
  依赖现有 data 算出来的值，用 <code>proto</code> 里的 getter；
  需要在数据变化后做额外操作（记日志、写入外部存储），用 <code>watch</code>。
</p>
<l-m src="../../components/playground.html"></l-m>
      <docs-playground lesson="lesson-10" fold-styles="true"></docs-playground>
<h2>getter 与 watch 的分工</h2>
<ul>
  <li><code>get total()</code>：模板里像普通字段一样用，自动随依赖更新；</li>
  <li><code>watch.qty(value, { watchers })</code>：数据变化后执行；</li>
  <li>watch 在初始化时会先调用一次，此时 <code>watchers</code> 不存在，
    可以用 <code>if (!watchers) return</code> 跳过首次调用。</li>
</ul>
<div class="doc-note">
  <strong>getter 的边界：</strong>getter 在模板初始化时就会求值，
  只能依赖已经存在的同步数据；如果依赖接口返回的异步数据，先用 data 字段
  存结果，再在异步回调里赋值。
</div>
<h2>动手改</h2>
<p>
  增加一个「折扣」输入（0–1），让总价按折扣计算；再用 watch 记录折扣变化。
</p>
