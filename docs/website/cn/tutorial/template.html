        <h1>使用模板渲染</h1>
        <p class="doc-lead">
          ofa.js 的模板语法直接写在 HTML 里。数据变化时，页面自动更新，
          不需要手动操作 DOM，也没有额外的编译步骤。
        </p>

        <h2>1. data 与文本插值</h2>
        <p>
          页面模块和组件模块都可以返回一个 <code>data</code> 对象。模板中用
          <code>{{ }}</code> 读取数据：
        </p>
        <pre><code>&lt;h2&gt;你好，{{name}}&lt;/h2&gt;
&lt;p&gt;计数：{{count}}&lt;/p&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { name: "ofa.js", count: 0 },
  });
&lt;/script&gt;</code></pre>
        <p>
          <code>{{ }}</code> 只用于元素的文本内容，不能写在属性值里。
          属性值请使用下一节的指令。
        </p>

        <h2>2. 事件与双向绑定</h2>
        <p>
          事件用 <code>on:</code>，双向绑定用 <code>sync:</code>：
        </p>
        <pre><code>&lt;button on:click="count++"&gt;+1&lt;/button&gt;
&lt;input sync:value="name" /&gt;
&lt;input type="checkbox" sync:checked="done" /&gt;</code></pre>
        <p>
          普通属性用 <code>attr:</code>，条件类名用 <code>class:</code>，
          内联样式用 <code>:style.*</code>：
        </p>
        <pre><code>&lt;button attr:disabled="loading"&gt;提交&lt;/button&gt;
&lt;li class:done="item.done"&gt;...&lt;/li&gt;
&lt;a attr:href="url"&gt;链接&lt;/a&gt;
&lt;p :style.color="active ? '#5eead4' : '#9aa6bd'"&gt;...&lt;/p&gt;</code></pre>
        <p>
          布尔属性（<code>disabled</code>、<code>checked</code>、
          <code>hidden</code> 等）一定要用 <code>attr:</code>；
          用 <code>:prop</code> 会把 <code>false</code> 渲染成字符串属性。
        </p>

        <h2>3. 条件渲染</h2>
        <p>
          <code>o-if</code> 系列按条件保留或移除内容，三个标签必须连续书写：
        </p>
        <pre><code>&lt;o-if :value="count &gt; 10"&gt;
  &lt;p&gt;大于 10&lt;/p&gt;
&lt;/o-if&gt;
&lt;o-else-if :value="count &gt; 5"&gt;
  &lt;p&gt;大于 5&lt;/p&gt;
&lt;/o-else-if&gt;
&lt;o-else&gt;
  &lt;p&gt;小于等于 5&lt;/p&gt;
&lt;/o-else&gt;</code></pre>
        <p>
          频繁切换显隐的 UI 用 <code>class:</code> 更轻量；
          条件确实会销毁/重建内容时再用 <code>o-if</code>。
        </p>

        <h2>4. 列表渲染</h2>
        <p>
          列表用 <code>o-fill</code>。列表项内有唯一字段时始终写上
          <code>fill-key</code>，增删和排序才能正确复用节点：
        </p>
        <pre><code>&lt;ul&gt;
  &lt;o-fill :value="todos" fill-key="id"&gt;
    &lt;li class:done="$data.done"&gt;
      &lt;span&gt;{{$data.text}}&lt;/span&gt;
      &lt;button on:click="$host.removeTodo($data.id)"&gt;×&lt;/button&gt;
    &lt;/li&gt;
  &lt;/o-fill&gt;
&lt;/ul&gt;</code></pre>
        <p>
          <code>o-fill</code> 内部只能用 <code>$data</code>、
          <code>$index</code>、<code>$host</code>、<code>$parent</code>、
          <code>$ele</code> 这些作用域变量，不能直接写 <code>item.text</code>。
          数组的 <code>push</code> / <code>splice</code> 会自动更新视图。
        </p>

        <h2>5. 完整示例：待办清单</h2>
        <p>把上面的语法组合起来，就是一份可以直接运行的待办页面：</p>
        <pre><code>&lt;template page&gt;
  &lt;h2&gt;待办（{{todos.length}}）&lt;/h2&gt;

  &lt;input
    sync:value="draft"
    on:keydown="addOnEnter($event)"
    placeholder="输入待办，回车添加"
  /&gt;

  &lt;ul&gt;
    &lt;o-fill :value="todos" fill-key="id"&gt;
      &lt;li class:done="$data.done"&gt;
        &lt;input type="checkbox" sync:checked="$data.done" /&gt;
        &lt;span&gt;{{$data.text}}&lt;/span&gt;
        &lt;button on:click="$host.removeTodo($data.id)"&gt;×&lt;/button&gt;
      &lt;/li&gt;
    &lt;/o-fill&gt;
  &lt;/ul&gt;

  &lt;script&gt;
    let uid = 1;

    export default async () =&gt; ({
      data: {
        draft: "",
        todos: [{ id: 1, text: "学习 ofa.js", done: false }],
      },
      proto: {
        addOnEnter(event) {
          if (event.key !== "Enter") return;
          const text = this.draft.trim();
          if (!text) return;
          this.todos.push({ id: ++uid, text, done: false });
          this.draft = "";
        },
        removeTodo(id) {
          const index = this.todos.findIndex((item) =&gt; item.id === id);
          if (index &gt; -1) this.todos.splice(index, 1);
        },
      },
    });
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

        <h2>小结</h2>
        <p>
          <code>{{ }}</code> 管文本，<code>on:</code> 管事件，
          <code>sync:</code> 管双向绑定，<code>class:</code> /
          <code>attr:</code> 管属性，<code>o-if</code> 管条件，
          <code>o-fill</code> 管列表。掌握这六件事，就能写出大部分界面。
        </p>

        </p>
