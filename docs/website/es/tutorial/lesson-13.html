      <h1>Parámetros de componente</h1>
      <p class="doc-lead">Los datos externos llegan al componente a través de attrs; el componente guarda su propio estado en data.</p>

      <p>
  Los atributos que un componente recibe del exterior se declaran en <code>attrs</code> con valores predeterminados;
  el estado que cambia dentro del componente vive en <code>data</code>. Los nombres de ambos no deben coincidir.
</p>
<l-m src="../../components/playground.html"></l-m>
      <docs-playground lesson="lesson-13" fold-styles="true"></docs-playground>
<h2>attrs frente a data</h2>
<ul>
  <li><code>attrs</code>: valores escalares que se pasan desde fuera (nombre, rol, nivel inicial);
    se reflejan en los atributos HTML;</li>
  <li><code>data</code>: el estado reactivo propio del componente; el código externo no lo modifica directamente;</li>
  <li>en el ejemplo, <code>startLevel</code> es una cadena y el componente la convierte en un número con
    <code>Number()</code>.</li>
</ul>
<div class="doc-note">
  <strong>No modifiques attrs directamente:</strong> un componente hijo trata <code>attrs</code> como una entrada de solo lectura.
  Si necesitas un estado derivado, cópialo en <code>data</code>. Así se mantiene clara la fuente de los datos y
  se evita que el padre y el hijo se sobrescriban mutuamente.
</div>
<h2>Pruébalo tú mismo</h2>
<p>
  Añade un campo de datos <code>level</code> y una entrada a la página, luego pásalo al segundo componente
  de forma dinámica con <code>attr:start-level="level"</code>.
</p>
