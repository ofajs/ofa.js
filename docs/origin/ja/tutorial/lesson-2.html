      <p class="doc-lead">data には文字列、数値、真偽値、オブジェクト、配列を保持でき、{{ }} では簡単な式も評価できます。</p>

  <code>data</code> はただのオブジェクトですが、ofa.js がそれをリアクティブなデータに変えます。
  テンプレート内の <code>{{ }}</code> はフィールドを読むだけでなく、式の評価や
  ネストしたプロパティへのアクセスもできます。

<h2>ルール</h2>
<ul>

  <li><code>{{user.age + 1}}</code>：{{ }} の中身は JavaScript の式です。</li>
  <li><code>:html="note"</code>：文字列を HTML として描画します。信頼できるコンテンツにのみ使ってください。</li>
</ul>
<div class="doc-note">

  <code>&lt;a href="{{url}}"&gt;</code> と書いても効果はありません。
