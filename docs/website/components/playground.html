  <div class="workbench">
    <div class="titlebar">
      <span class="traffic" aria-hidden="true"><i></i><i></i><i></i></span>

      class="body"
      class:resizing="resizing"

        <code-editor
          attr:value="code"
          attr:fold="foldStyles === 'true' || foldStyles === true ? 'style' : ''"
          on:change="onCodeChange"
          on:cursor="onCursor"
          on:run="run"
        ></code-editor>
      </section>

        class="splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整编辑器和预览宽度"
        on:pointerdown="startResize"
      ></div>

      <span>HTML</span>

  <script>
    import {
      SPACE,
      STORAGE_KEY,
      DEFAULT_CODE,
      getLesson,
      buildIndex,
    } from "../content/playground-runtime.mjs";
    import { API_EXAMPLES } from "../content/api-examples.mjs";

    export default {
      tag: "docs-playground",
      attrs: {
        lesson: "",
        example: "",
        foldStyles: false,
      },
      data: {
        code: DEFAULT_CODE,
        files: {},
        fileNames: [],
        activeFile: "page.html",
        entry: "page",
        defaultFiles: {},
        frameSrc: "",
        status: "正在启动虚拟容器…",
        coreReady: false,
        busy: false,
        dirty: false,
        cursorLine: 1,
        cursorColumn: 1,
        editorWidth: 50,
        resizing: false,
      },

      detached() {
        if (this._stopResize) this._stopResize();
      },

      attached() {
        const example = this.example && API_EXAMPLES[this.example];

        this._storageKey = example
          ? `${STORAGE_KEY}:api:${this.example}`
          : this.lesson
            ? `${STORAGE_KEY}:${this.lesson}`
            : STORAGE_KEY;

        const lesson = example
          ? { entry: example.entry || "page", files: example.files }
          : getLesson(this.lesson);
        this.entry = lesson.entry;
        this.defaultFiles = { ...lesson.files };

        let files = lesson.files;

        try {
          const saved = localStorage.getItem(this._storageKey);
          if (saved) files = this.parseFiles(saved);
        } catch {}

        this.loadFiles(files);
        this.initContainer();
      },

      proto: {
        parseFiles(saved) {
          try {
            const data = JSON.parse(saved);
            if (data && typeof data === "object" && !Array.isArray(data)) {
              const files = {};
              for (const [name, content] of Object.entries(data)) {
                if (typeof content === "string") files[name] = content;
              }
              if (Object.keys(files).length) return files;
            }
          } catch {}

          // 兼容旧版本：localStorage 里存的是 page.html 的源码字符串
          return { "page.html": saved };
        },

        loadFiles(files, activeName) {
          this.files = { ...files };
          this.fileNames = Object.keys(this.files);
          this.activeFile = this.fileNames.includes(activeName)
            ? activeName
            : this.fileNames[0] || "page.html";
          this.code = this.files[this.activeFile] || "";
          this.dirty = false;
        },

        saveFiles() {
          if (!this._storageKey) return;
          try {
            localStorage.setItem(this._storageKey, JSON.stringify(this.files));
          } catch {}
        },

        switchFile(name) {
          if (name === this.activeFile || !(name in this.files)) return;
          this.files[this.activeFile] = this.code;
          this.activeFile = name;
          this.code = this.files[name];
          this.dirty = false;
        },

        fileType(name) {
          return name.endsWith(".mjs") || name.endsWith(".js") ? "JS" : "HTML";
        },

        resetLesson() {
          try {
            localStorage.removeItem(this._storageKey);
          } catch {}
          this.loadFiles(this.defaultFiles, this.activeFile);
          this.status = "已恢复本课示例代码，按 Ctrl/⌘+S 运行";
        },

        async initContainer() {
          if (this.coreReady || this._initializing) return;
          this._initializing = true;

          try {
            if (!("serviceWorker" in navigator)) {
              throw new Error("当前浏览器不支持 Service Worker");
            }

            await navigator.serviceWorker.register("/sw.js");
            await navigator.serviceWorker.ready;

            const root = await navigator.storage.getDirectory();
            this._space = await root.getDirectoryHandle(SPACE, {
              create: true,
            });

            this.coreReady = true;
            this.status = "虚拟容器已就绪";
            await new Promise((resolve) => {
              requestAnimationFrame(() => requestAnimationFrame(resolve));
            });
            await this.run();
          } catch (error) {
            console.error("[docs-playground] init failed", error);
            this.status = "虚拟容器初始化失败：" + error.message;
          } finally {
            this._initializing = false;
          }
        },

        async writeFile(path, content) {
          const parts = path.split("/");
          const fileName = parts.pop();
          let dir = this._space;

          for (const part of parts) {
            dir = await dir.getDirectoryHandle(part, { create: true });
          }

          const file = await dir.getFileHandle(fileName, { create: true });
          const writable = await file.createWritable();
          await writable.write(content);
          await writable.close();
        },

        async run() {
          if (!this.coreReady || this.busy) return;

          this.busy = true;
          this.status = "正在写入虚拟文件…";

          try {
            const version = Date.now();
            for (const [name, content] of Object.entries(this.files)) {
              await this.writeFile(name, content);
            }

            // entry="raw" 直接使用示例自带的 index.html（普通 body + script），
            // 不生成页面模块入口，方便演示 jQuery 式的全局 $ 操作。
            if (this.entry !== "raw") {
              await this.writeFile("index.html", buildIndex(version, this.entry));
            }
            this.frameSrc = `/$${SPACE}/index.html?v=${version}`;
            this.status = "已运行，可继续编辑后按 Ctrl/⌘+S 重新运行";
            this.dirty = false;
          } catch (error) {
            console.error("[docs-playground] run failed", error);
            this.status = "运行失败：" + error.message;
          } finally {
            this.busy = false;
          }
        },

        startResize(event) {
          if (event.button !== undefined && event.button !== 0) return;
          event.preventDefault();

          const body = this.shadow.$(".body").ele;
          this.resizing = true;
          const onMove = (moveEvent) => {
            const rect = body.getBoundingClientRect();
            const percent = ((moveEvent.clientX - rect.left) / rect.width) * 100;
            this.editorWidth = Math.min(78, Math.max(25, percent));
          };
          const onUp = () => {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            this._stopResize = null;
            this.resizing = false;
            document.body.style.cursor = "";
          };

          this._stopResize = onUp;
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp, { once: true });
          document.body.style.cursor = "col-resize";
        },

        openPreview() {
          if (!this.frameSrc) return;
          window.open(this.frameSrc, "_blank", "noopener");
        },

        onCodeChange(event) {
          const value = event.data.value;
          this.code = value;
          this.files[this.activeFile] = value;
          this.saveFiles();
          this.dirty = true;
        },

        onCursor(event) {
          this.cursorLine = event.data.line;
          this.cursorColumn = event.data.column;
        },
      },
    };
  </script>
