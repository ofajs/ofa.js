      <h2>まずは試す：グローバル $ で body 要素を操作する</h2>
      <p>
        このサンプルはページモジュールではありません。<code>body</code> には素の
        <code>&lt;div id="target"&gt;</code> があり、下の <code>&lt;script type="module"&gt;</code>
        がグローバルな <code>$("#target")</code> でその要素を取得してクリックイベントをバインドし、
        jQuery のように DOM を直接操作します。コードを編集したら
        <kbd>Ctrl</kbd>+<kbd>S</kbd> を押すか「コードを実行」をクリックすると、結果を確認できます。
      </p>

      <l-m src="../../components/playground.html"></l-m>
      <docs-playground example="globalBody"></docs-playground>

      <div class="doc-note">
        <strong>API はテンプレート構文以外のためのものです：</strong>
        ここで扱うインスタンスメソッドとグローバル <code>$</code> は、JavaScript から
        ノードを動的に検索・生成し、データを読み書きし、イベントをバインドし、
        ページスタックを制御するためのものです。<code>on:</code>、<code>o-if</code>、
        <code>o-fill</code>、<code>attr:</code> でテンプレートに書けるロジックは、
        テンプレート側に残すのが適切です。
      </div>

      <p>
        API は用途ごとに分類され、各メンバーにはシグネチャと説明を記載しています。
        ページ上部のエディターでコードを変更すると、右側のプレビューで結果を確認できます。
      </p>
