      <p class="doc-kicker">Tutorial · 16</p>
      <h1>全局状态</h1>
      <p class="doc-lead">多个组件共享同一份状态时，用 $.stanz 建一个模块级 store，并在 attached/detached 挂载、清理。</p>

      <p>
  组件自己的 <code>data</code> 只属于自己。多个组件要读写同一份数据时，
  用 <code>$.stanz()</code> 创建一个响应式 store，放在独立模块里共享。
</p>
<l-m src="{{SITE}}/components/playground.html"></l-m>
      <docs-playground lesson="lesson-16" fold-styles="true"></docs-playground>
<h2>三个文件</h2>
<ul>
  <li><code>store.mjs</code>：只导出 <code>$.stanz({ count: 0 })</code>；</li>
  <li><code>counter-panel.html</code>：两个组件实例都引用同一个 store；</li>
  <li><code>page.html</code>：放两个面板和加减按钮。</li>
</ul>
<p>
  组件在 <code>attached</code> 里订阅 store、在 <code>detached</code> 里取消订阅。
  这样面板被移除后不会继续持有旧引用。
</p>
<div class="doc-note">
  <strong>约定：</strong>模块级 store 不要直接写进组件的 <code>data</code>；
  在 attached 阶段挂载、detached 阶段清理，才能避免内存泄漏和重复订阅。
</div>
<div class="doc-note">
  <strong>怎么选：</strong>如果数据只属于某棵组件子树，而不是整个应用，
  用上一课的 <code>o-provider</code> / <code>o-consumer</code> 更合适；
  见 <a olink href="./lesson-15.html">跨层上下文</a>。
</div>
<h2>动手改</h2>
<p>
  在 store 里增加 <code>step</code>，让页面上的「+1」按钮每次加
  <code>store.step</code>；再加一个按钮把 step 改成 5。
</p>
