<!doctype html>
<html lang="mul">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ofa.js — Languages</title>
    <meta
      name="description"
      content="Choose a language for the ofa.js website."
    />
    <meta name="theme-color" content="#06070d" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <style>
      :root {
        --bg: #06070d;
        --text: #eef2fb;
        --muted: #9aa6bd;
        --line: rgba(255, 255, 255, 0.09);
        --line-2: rgba(255, 255, 255, 0.17);
        --violet: #7c5cff;
        --cyan: #22d3ee;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
        overflow-x: clip;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 32px 20px;
        font-family:
          "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .glow {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .glow::before,
      .glow::after {
        content: "";
        position: absolute;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        filter: blur(110px);
      }

      .glow::before {
        top: -260px;
        left: -160px;
        background: #4f46e5;
        opacity: 0.3;
      }

      .glow::after {
        right: -220px;
        bottom: -260px;
        background: #0891b2;
        opacity: 0.2;
      }

      .grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 72px 72px;
        -webkit-mask-image: radial-gradient(
          ellipse 80% 70% at 50% 0%,
          #000 10%,
          transparent 75%
        );
        mask-image: radial-gradient(
          ellipse 80% 70% at 50% 0%,
          #000 10%,
          transparent 75%
        );
        pointer-events: none;
      }

      main {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 720px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 48px;
      }

      .brand svg {
        width: 36px;
        height: 36px;
        display: block;
      }

      .wordmark {
        font-size: 21px;
        font-weight: 720;
        letter-spacing: -0.03em;
      }

      .wordmark span {
        color: #8b97b0;
        font-weight: 500;
      }

      .kicker {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 16px;
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #8b97b0;
      }

      .kicker::before {
        content: "";
        width: 18px;
        height: 1px;
        background: linear-gradient(90deg, var(--violet), var(--cyan));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(36px, 7vw, 60px);
        font-weight: 780;
        line-height: 1.08;
        letter-spacing: -0.045em;
      }

      h1 em {
        display: block;
        margin-top: 8px;
        font-style: normal;
        font-size: 0.46em;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--muted);
      }

      .langs {
        display: grid;
        gap: 12px;
        margin-top: 40px;
      }

      .lang-card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px 22px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.04),
          rgba(255, 255, 255, 0.012)
        );
        transition:
          border-color 0.22s ease,
          background 0.22s ease,
          transform 0.22s ease;
      }

      .lang-card:hover {
        border-color: rgba(124, 92, 255, 0.5);
        background: rgba(255, 255, 255, 0.055);
        transform: translateY(-2px);
      }

      .lang-card:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }

      .lang-mark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        flex: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        background: linear-gradient(
          145deg,
          rgba(124, 92, 255, 0.24),
          rgba(34, 211, 238, 0.08)
        );
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        color: #c4b5fd;
        text-transform: uppercase;
      }

      .lang-main {
        min-width: 0;
      }

      .lang-native {
        display: block;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .lang-title {
        display: block;
        margin-top: 3px;
        overflow: hidden;
        font-size: 11.5px;
        color: #6f7c95;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .lang-arrow {
        margin-left: auto;
        color: #4d5970;
        font-size: 17px;
        transition: transform 0.22s ease, color 0.22s ease;
      }

      .lang-card:hover .lang-arrow {
        transform: translateX(3px);
        color: var(--cyan);
      }

      .foot {
        margin-top: 40px;
        font-size: 11px;
        color: #5f6b83;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <div class="grid" aria-hidden="true"></div>

    <main>
      <span class="brand">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="brand-grad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#a78bfa"></stop>
              <stop offset="0.55" stop-color="#7c5cff"></stop>
              <stop offset="1" stop-color="#22d3ee"></stop>
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="16" fill="none" stroke="url(#brand-grad)" stroke-width="7"></circle>
          <circle cx="47" cy="17" r="5" fill="#22d3ee"></circle>
        </svg>
        <span class="wordmark">ofa<span>.js</span></span>
      </span>

      <p class="kicker">Languages</p>
      <h1>
        选择语言
        <em>Choose your language</em>
      </h1>

      <div class="langs">{{LANG_CARDS}}</div>

      <p class="foot">© 2018–2026 ofa.js · MIT License</p>
    </main>
  </body>
</html>
