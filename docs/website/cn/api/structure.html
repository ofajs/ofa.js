        place-items: center;

      #site-loading.is-hidden {

        pointer-events: none;
      }

      .site-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(260px, 70vw);
      }

      .site-loading-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--md-sys-color-on-surface, #e2e2e9);
        line-height: 1;
      }

      .site-loading-logo {
        display: block;
        width: auto;
        height: 30px;
        flex: none;
      }

      .site-loading-wordmark {
        color: var(--md-sys-color-on-surface, #f3f5fa);
        font-family:
          "Space Grotesk", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .site-loading-wordmark span {
        color: var(--md-sys-color-on-surface-variant, #8f9bb3);
        font-weight: 450;
      }

      .site-loading-bar {
        width: 100%;
        height: 4px;
        border-radius: 99px;
        background: linear-gradient(
          90deg,
          var(--md-sys-color-surface-container-high, #252d3d) 0%,
          var(--md-sys-color-surface-container-high, #252d3d) 34%,
          var(--md-sys-color-primary, #7c9cff) 50%,
          color-mix(in srgb, var(--md-sys-color-primary) 45%, white) 56%,
          var(--md-sys-color-surface-container-high, #252d3d) 72%,
          var(--md-sys-color-surface-container-high, #252d3d) 100%
        );
        background-size: 220% 100%;
        box-shadow: 0 0 14px color-mix(in srgb, var(--md-sys-color-primary) 25%, transparent);
        animation: site-loading-bar 1.1s linear infinite;
      }

      .site-loading-label {
        color: var(--md-sys-color-on-surface-variant, #8f9bb3);
        font-family:
          "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 12.5px;
        font-weight: 400;
        letter-spacing: 0.03em;
      }

      @keyframes site-loading-bar {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -100% 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .site-loading-bar {
          animation-duration: 2s;
        }
      }

      <p class="doc-kicker">API · 结构操作</p>
      <h1>结构操作</h1>
      <p class="doc-lead">子元素按数组语义操作；可变方法会真实搬动 DOM 并触发更新。</p>

<l-m src="../../components/playground.html"></l-m>
      <docs-playground example="structure"></docs-playground>

      <h2>成员</h2>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead><tr><th>成员</th><th>说明</th></tr></thead>
        <tbody>
          <tr><td><code>push(...items)</code></td><td>末尾追加子元素，返回新的子元素数量</td></tr>
          <tr><td><code>unshift(...items)</code></td><td>开头插入子元素，返回新的子元素数量</td></tr>
          <tr><td><code>pop() / shift()</code></td><td>移除末尾 / 开头子元素并返回它的实例</td></tr>
          <tr><td><code>splice(start, count, ...items)</code></td><td>删除并插入，返回被移除的实例数组</td></tr>
          <tr><td><code>reverse() / sort(fn)</code></td><td>就地反转 / 排序子元素</td></tr>
          <tr><td><code>map / filter / slice / forEach</code></td><td>非可变数组方法：先物化为实例数组再执行</td></tr>
          <tr><td><code>el.before(content) / el.after(content)</code></td><td>在自身前 / 后插入内容</td></tr>
          <tr><td><code>el.remove()</code></td><td>从父级移除自身（走 splice，事件语义完整）</td></tr>
          <tr><td><code>el.wrap(content)</code></td><td>用 content 包裹自身；无父级时报错</td></tr>
          <tr><td><code>el.unwrap()</code></td><td>拆掉自身这层包装；兄弟节点多于一个时报错</td></tr>
          <tr><td><code>el.clone(bool = true)</code></td><td>克隆元素，默认连同子元素</td></tr>
        </tbody>
      </table>
        </div>
      <div class="doc-note">
        <strong>提示：</strong>直接操作子元素不会同步修改 data 里的数组；模板列表请用 o-fill。
      </div>
