<template page>
  <link rel="stylesheet" href="{{SITE}}/styles/site.css" />
  <link rel="stylesheet" href="{{SITE}}/styles/docs.css" />
  <l-m src="{{SITE}}/components/docs-layout.html"></l-m>

  <docs-layout layout="wide" attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc doc-wide">
      <p class="doc-kicker">Reference</p>
      <h1>案例預覽</h1>
      <p class="doc-lead">
        這裡用 NoneOS Core 在瀏覽器裡掛載一個虛擬文件系統。
        左側編輯 ofa.js 頁面模塊，右側在虛擬容器中運行，不需要後端。
      </p>

      <l-m src="{{SITE}}/components/playground.html"></l-m>
      <docs-playground></docs-playground>

      <h2>它是怎麼運行的</h2>
      <ol>
        <li>首次打開時註冊 NoneOS Core 的 <code>sw.js</code>；</li>
        <li>頁面直接打開瀏覽器 OPFS，Service Worker 把
          <code>/$ofa-docs-playground/...</code> 映射到虛擬文件系統；</li>
        <li>編輯器把頁面模塊寫入虛擬文件 <code>page.html</code>，並生成一個
          固定的 <code>index.html</code> 入口；</li>
        <li>右側 iframe 直接訪問虛擬容器裡的
          <code>/$ofa-docs-playground/index.html</code>，由 ofa.js 渲染頁面。</li>
      </ol>

      <div class="doc-note">
        <strong>部署要求：</strong>
        Service Worker 註冊在站點根路徑 <code>/sw.js</code>，因此該功能要求
        docs 部署在域名根路徑（或本地用
        <code>npm run server:website</code> 以 <code>docs/website</code>
        為根目錄預覽）。放在子目錄下時 Service Worker 無法接管
        <code>/$</code> 路徑。
      </div>

      <h2>可以改什麼</h2>
      <ul>
        <li>修改模板、樣式、<code>data</code> 和 <code>proto</code> 方法，點「運行代碼」立即生效；</li>
        <li>用 <code>&lt;l-m&gt;</code> 引用 CDN 上的其他 ofa.js 組件；</li>
        <li>代碼會保存在瀏覽器 <code>localStorage</code>，刷新後仍保留；</li>
        <li>清空編輯器後重新寫入頁面模塊，即可從空白開始實驗。</li>
      </ul>

      <p class="doc-end">
        上一篇：<a olink href="./examples.html">完整示例 →</a>
        　·　下一篇：<a olink href="./deployment.html">部署 →</a>
      </p>
    </article>
  </docs-layout>

  <script>
    import { createDocsPage } from "{{SITE}}/content/page-runtime.mjs";

    export const parent = "{{LOCALE}}/layout.html";

    export default (args) =>
      createDocsPage({ ...args, sitePath: "{{LOCALE}}/site.json" });
  </script>
</template>
