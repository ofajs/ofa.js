<!doctype html>
<html lang="zh-CN" class="st-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ofa.js 教程</title>
    <meta name="description" content="面向新人的 ofa.js 交互式教程：每一课都能直接改代码看效果。" />
    <meta name="theme-color" content="#1a1c1e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ofa.js 教程" />
    <meta property="og:description" content="面向新人的 ofa.js 交互式教程：每一课都能直接改代码看效果。" />
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script>
      // 官网为纯深色设计：首次访问锁定 senti-ui 深色主题（尊重用户已有偏好）
      try {
        if (!localStorage.getItem("st-theme-mode"))
          localStorage.setItem("st-theme-mode", "dark");
      } catch {}
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui/packages/boot/st-boot.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Roboto", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #c3c7cf;
      }
    </style>
  </head>
  <body>
    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../../app.mjs">
      <template page>

  <link rel="stylesheet" href="../../styles/site.css" />
  <link rel="stylesheet" href="../../styles/docs.css" />
  <l-m src="../../components/docs-layout.html"></l-m>

  <docs-layout attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc docs-intro">
      <p class="doc-kicker">Tutorial</p>
      <h1>从零开始用 ofa.js</h1>
      <p class="doc-lead">
        五节短课，每节都能直接改代码、点运行、看效果。
        不需要安装 Node.js，也不需要构建工具。
      </p>

      <div class="docs-list">
        <a class="docs-row" olink href="./lesson-1.html">
          <span class="num">01</span>
          <h2>第一个页面</h2>
          <p>认识页面模块、data 和 {{ }}，改一行文字并立即看到结果。</p>
          <span class="more">开始学习 →</span>
        </a>

        <a class="docs-row" olink href="./lesson-2.html">
          <span class="num">02</span>
          <h2>数据与事件</h2>
          <p>用 on: 点击按钮、用 sync: 绑定输入框，做一个计数器。</p>
          <span class="more">开始学习 →</span>
        </a>

        <a class="docs-row" olink href="./lesson-3.html">
          <span class="num">03</span>
          <h2>条件与列表</h2>
          <p>用 o-if 显示空状态，用 o-fill 渲染可增删的列表。</p>
          <span class="more">开始学习 →</span>
        </a>

        <a class="docs-row" olink href="./lesson-4.html">
          <span class="num">04</span>
          <h2>表单与待办</h2>
          <p>把输入、复选框、列表和计算属性组合成待办应用。</p>
          <span class="more">开始学习 →</span>
        </a>

        <a class="docs-row" olink href="./lesson-5.html">
          <span class="num">05</span>
          <h2>样式与挑战</h2>
          <p>用 class:、:style 和 getter 做出有状态的个人卡片。</p>
          <span class="more">开始挑战 →</span>
        </a>
      </div>

      <div class="doc-note">
        <strong>怎么学？</strong>
        先读一小段说明，然后直接改右侧代码。改坏了也没关系，
        刷新页面或清空浏览器存储就能回到默认代码。
      </div>
    </article>
  </docs-layout>

  <script>
    import { createTutorialPage } from "../../content/page-runtime.mjs";

    export const parent = "../layout.html";

    export default (args) =>
      createTutorialPage({ ...args, sitePath: "../site.json" });
  </script>

      </template>
    </o-app>

    <noscript>此页面需要启用 JavaScript 才能运行 ofa.js。</noscript>

    <script type="module" src="../../boot.js"></script>
  </body>
</html>
