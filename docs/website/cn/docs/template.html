      <p class="doc-kicker">Template</p>
      <h1>模板指令总览</h1>
      <p class="doc-lead">
        ofa.js 的模板语法直接写在 HTML 上：用指令绑定数据、事件和渲染逻辑，
        没有 JSX，也没有需要编译的模板文件。
      </p>

      <h2>指令总表</h2>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead>
          <tr><th>语法</th><th>用途</th><th>示例</th></tr>
        </thead>
        <tbody>
          <tr><td><code>{{expr}}</code></td><td>文本插值，仅限元素文本内容</td><td><code>&lt;span&gt;{{message}}&lt;/span&gt;</code></td></tr>
          <tr><td><code>:html</code></td><td>渲染 HTML 内容</td><td><code>&lt;div :html="html"&gt;</code></td></tr>
          <tr><td><code>:prop</code></td><td>单向属性绑定</td><td><code>&lt;input :value="name"&gt;</code></td></tr>
          <tr><td><code>sync:prop</code></td><td>双向属性绑定</td><td><code>&lt;input sync:value="name"&gt;</code></td></tr>
          <tr><td><code>attr:name</code></td><td>HTML attribute 绑定</td><td><code>&lt;a attr:href="url"&gt;</code></td></tr>
          <tr><td><code>class:name</code></td><td>条件类名</td><td><code>&lt;li class:done="done"&gt;</code></td></tr>
          <tr><td><code>:style.prop</code></td><td>内联样式绑定</td><td><code>&lt;p :style.color="color"&gt;</code></td></tr>
          <tr><td><code>on:event</code></td><td>事件绑定</td><td><code>&lt;button on:click="save"&gt;</code></td></tr>
          <tr><td><code>one:event</code></td><td>只触发一次的事件</td><td><code>&lt;img one:load="init"&gt;</code></td></tr>
          <tr><td><code>$event</code></td><td>事件对象</td><td><code>on:input="update($event)"</code></td></tr>
        </tbody>
      </table>
        </div>

      <h2>文本插值</h2>
      <pre><code>&lt;p&gt;你好，{{name}}&lt;/p&gt;
&lt;p&gt;计数：{{count}}，双倍：{{doubleCount}}&lt;/p&gt;</code></pre>
      <p>
        <code>{{ }}</code> 只在元素文本内容中生效。属性值、事件参数和样式值
        一律使用指令表达式。需要渲染 HTML 时使用 <code>:html</code>，
        并确保内容可信。
      </p>

      <h2>属性与双向绑定</h2>
      <pre><code>&lt;input :value="inputValue" /&gt;
&lt;input sync:value="inputValue" /&gt;
&lt;a attr:href="url" attr:title="tip"&gt;链接&lt;/a&gt;
&lt;!-- 布尔属性一律用 attr: --&gt;
&lt;button attr:disabled="loading"&gt;提交&lt;/button&gt;</code></pre>
      <p>
        <code>:</code> 是单向绑定，<code>sync:</code> 是双向绑定。
        <code>attr:</code> 对 <code>true</code> 设置空属性、对
        <code>false</code> 移除属性，因此布尔属性必须用它。
      </p>

      <h2>类名与样式</h2>
      <pre><code>&lt;li class:active="isActive" class:done="item.done"&gt;&lt;/li&gt;
&lt;p :style.color="active ? '#5eead4' : '#9aa6bd'"&gt;&lt;/p&gt;
&lt;p :style.fontSize="'16px'"&gt;&lt;/p&gt;</code></pre>
      <p>
        <code>class:</code> 根据布尔表达式加/减类名；
        <code>:style.prop</code> 使用驼峰属性名。详细规则见
        <a olink href="./binding.html">绑定与样式</a>。
      </p>

      <h2>事件</h2>
      <pre><code>&lt;button on:click="count++"&gt;+1&lt;/button&gt;
&lt;button on:click="save"&gt;保存&lt;/button&gt;
&lt;input on:input="update($event)" /&gt;
&lt;my-counter on:change="onChange"&gt;&lt;/my-counter&gt;</code></pre>
      <p>
        纯方法名会自动绑定 <code>this</code>，也可以直接写表达式。
        自定义事件的数据通过 <code>event.data</code> 读取。详见
        <a olink href="./events.html">事件与表单</a>。
      </p>

      <h2>条件与列表</h2>
      <pre><code>&lt;o-if :value="count &gt; 10"&gt;
  &lt;p&gt;大于 10&lt;/p&gt;
&lt;/o-if&gt;
&lt;o-else-if :value="count &gt; 5"&gt;
  &lt;p&gt;大于 5&lt;/p&gt;
&lt;/o-else-if&gt;
&lt;o-else&gt;
  &lt;p&gt;小于等于 5&lt;/p&gt;
&lt;/o-else&gt;

&lt;ul&gt;
  &lt;o-fill :value="todos" fill-key="id"&gt;
    &lt;li class:done="$data.done"&gt;
      {{$data.text}}
      &lt;button on:click="$host.remove($data.id)"&gt;×&lt;/button&gt;
    &lt;/li&gt;
  &lt;/o-fill&gt;
&lt;/ul&gt;</code></pre>
      <p>
        条件标签必须连续书写；<code>o-fill</code> 内只能使用
        <code>$data</code>、<code>$index</code>、<code>$host</code>、
        <code>$parent</code>、<code>$ele</code>。详见
        <a olink href="./render.html">条件与列表</a>。
      </p>

      <h2>数据来源</h2>
      <p>
        模板中的每个变量都必须先在 <code>data</code> 或 <code>attrs</code>
        中声明。未声明不是 <code>undefined</code>，而是直接抛
        <code>ReferenceError</code> 并中断整页渲染。
      </p>
      <pre><code>export default async () =&gt; ({
  data: {
    name: "ofa.js",
    count: 0,
    inputValue: "",
    loading: false,
    todos: [],
  },
  proto: {
    get doubleCount() {
      return this.count * 2;
    },
    async save() {
      this.loading = true;
      await submit();
      this.loading = false;
    },
  },
});</code></pre>
