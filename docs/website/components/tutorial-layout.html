<template component>
  <style>
    :host {
      display: block;
    }

    * {
      box-sizing: border-box;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .docs {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 220px;
      align-items: start;
      gap: 48px;
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px;
    }

    .side {
      position: sticky;
      top: 96px;
      min-width: 0;
    }

    .side-list {
      font-size: 13.5px;
    }

    .side-list st-list-item {
      color: var(--md-sys-color-on-surface-variant);
      font-size: 13.5px;
    }

    .side-list .side-label {
      display: block;
      line-height: 1.45;
    }

    .side-list st-list-item[collapsible] .side-label {
      color: var(--md-sys-color-on-surface);
      font-weight: 500;
    }

    .side-list st-list-item.active {
      color: var(--md-sys-color-primary);
    }

    .side-list st-list-item.active .side-label {
      color: var(--md-sys-color-primary);
      font-weight: 500;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
    }

    .side-list st-list-item:focus-visible {
      outline: 2px solid var(--md-sys-color-primary);
      outline-offset: -2px;
    }

    .doc-slot {
      min-width: 0;
      padding: 0 0 80px;
    }

    .toc {
      position: sticky;
      top: 96px;
      min-width: 0;
    }

    .toc[hidden] {
      display: none;
    }

    .toc-kicker {
      margin: 0 0 10px;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .toc-nav {
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--md-sys-color-outline-variant);
    }

    .toc-link {
      display: block;
      margin-left: -1px;
      padding: 4px 0 4px 12px;
      border-left: 2px solid transparent;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 13px;
      line-height: 1.5;
      transition:
        color var(--md-sys-motion-duration-short, 150ms) var(--md-sys-motion-easing-standard, cubic-bezier(0.2, 0, 0, 1)),
        border-color var(--md-sys-motion-duration-short, 150ms) var(--md-sys-motion-easing-standard, cubic-bezier(0.2, 0, 0, 1));
    }

    .toc-link:hover {
      color: var(--md-sys-color-on-surface);
    }

    .toc-link.active {
      color: var(--md-sys-color-primary);
      border-left-color: var(--md-sys-color-primary);
    }

    .toc-link:focus-visible {
      outline: 2px solid var(--md-sys-color-primary);
      outline-offset: 2px;
    }

    @media (max-width: 1180px) {
      .docs {
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 40px;
      }

      .toc {
        display: none;
      }
    }

    @media (max-width: 900px) {
      .docs {
        display: block;
        padding: 24px 20px 0;
      }

      .side {
        display: none;
      }

      .doc-slot {
        padding-bottom: 64px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .toc-link {
        transition-duration: 0.001ms;
      }
    }
  </style>

  <div class="docs">
    <aside class="side" attr:aria-label="labelTutorial">
      <st-list class="side-list">
        <st-list-item
          button
          class:active="current === 'index'"
          on:click="navigate('overview')"
        >
          <span class="side-label">{{labelOverview}}</span>
        </st-list-item>

        <st-list-item collapsible expanded>
          <span class="side-label">{{labelGroupStart}}</span>
          <st-list slot="sublist">
            <st-list-item
              button
              class:active="current === 'usage'"
              on:click="navigate('usage')"
            >
              <span class="side-label">{{titleUsageShort}}</span>
            </st-list-item>
          </st-list>
        </st-list-item>

        <st-list-item collapsible expanded>
          <span class="side-label">{{labelGroupTemplate}}</span>
          <st-list slot="sublist">
            <st-list-item
              button
              class:active="current === 'template'"
              on:click="navigate('template')"
            >
              <span class="side-label">{{titleTemplateShort}}</span>
            </st-list-item>
          </st-list>
        </st-list-item>
      </st-list>
    </aside>

    <div class="doc-slot"><slot></slot></div>

    <aside class="toc" hidden>
      <p class="toc-kicker">{{labelOnThisPage}}</p>
      <nav class="toc-nav" attr:aria-label="labelOnThisPage"></nav>
    </aside>
  </div>

  <script>
    export default {
      tag: "tutorial-layout",
      attrs: {
        current: "index",
        labelTutorial: "Tutorial",
        labelOverview: "Tutorial overview",
        labelGroupStart: "Getting started",
        labelGroupTemplate: "Template syntax",
        titleUsageShort: "Script include",
        titleTemplateShort: "Template rendering",
        labelOnThisPage: "On this page",
        overviewUrl: "./",
        usageUrl: "./usage.html",
        templateUrl: "./template.html",
      },
      proto: {
        navigate(key) {
          const url = this[`${key}Url`];
          if (!url) return;

          const app = this.ele.app;
          if (app?.goto) {
            app.goto(url);
          } else {
            location.href = url;
          }
        },
      },
      ready() {
        const root = this.ele.shadowRoot;
        const toc = root?.querySelector(".toc");
        const nav = root?.querySelector(".toc-nav");
        if (!toc || !nav) return;

        const headings = [...this.ele.querySelectorAll("article.doc > h2")];
        if (!headings.length) {
          toc.hidden = true;
          return;
        }

        const links = headings.map((heading, index) => {
          const id = heading.id || `doc-section-${index + 1}`;
          heading.id = id;

          const link = document.createElement("a");
          link.className = "toc-link";
          link.href = `#${id}`;
          link.textContent = heading.textContent.trim();
          link.addEventListener("click", (event) => {
            event.preventDefault();
            heading.scrollIntoView({ behavior: "smooth", block: "start" });
          });
          nav.appendChild(link);
          return link;
        });

        toc.hidden = false;

        if ("IntersectionObserver" in window) {
          const observer = new IntersectionObserver(
            (entries) => {
              for (const entry of entries) {
                if (!entry.isIntersecting) continue;
                const index = headings.indexOf(entry.target);
                links.forEach((link, i) => {
                  link.classList.toggle("active", i === index);
                });
              }
            },
            { rootMargin: "-96px 0px -65% 0px", threshold: 0 },
          );

          headings.forEach((heading) => observer.observe(heading));
          this._observer = observer;
        }
      },
      detached() {
        if (this._observer) this._observer.disconnect();
      },
    };
  </script>
</template>
