  <div class="workbench">
    <div class="titlebar">

    <div class="body">
      <section class="editor" aria-label="ofa.js 代码编辑器">

        <div class="code-pane">

            autocomplete="off"

            wrap="off"
            sync:value="code"
            on:scroll="syncScroll($event)"
            on:keydown="onEditorKeydown($event)"
            on:keyup="updateCursor($event)"
            on:click="updateCursor($event)"
            aria-label="ofa.js 页面代码"
          ></textarea>
        </div>

      <span>Spaces: 2</span>

      <span>HTML</span>
    </div>
  </div>

  <script>
    import { highlightCode } from "../content/highlight.mjs";
    import {
      SPACE,
      STORAGE_KEY,
      DEFAULT_CODE,
      LESSONS,
      buildIndex,
    } from "../content/playground-runtime.mjs";

    export default {
      tag: "docs-playground",
      attrs: {
        lesson: "",
      },
      data: {
        code: DEFAULT_CODE,
        codeHtml: "",
        lineNumbers: "1",
        frameSrc: "",
        status: "正在启动虚拟容器…",
        coreReady: false,
        busy: false,
        dirty: false,
        cursorLine: 1,
        cursorColumn: 1,
      },

      watch: {
        code(value) {
          if (!this._storageKey) return;
          try {
            localStorage.setItem(this._storageKey, value);
          } catch {}
          this.refreshEditor(value);
          this.dirty = true;
        },
      },

      attached() {
        this._storageKey = this.lesson
          ? `${STORAGE_KEY}:${this.lesson}`
          : STORAGE_KEY;

        try {
          const saved = localStorage.getItem(this._storageKey);
          this.code = saved || LESSONS[this.lesson] || DEFAULT_CODE;
        } catch {
          this.code = LESSONS[this.lesson] || DEFAULT_CODE;
        }

        this.refreshEditor(this.code);
        this.dirty = false;
        this.initContainer();
      },

      proto: {
        refreshEditor(value) {
          this.codeHtml = highlightCode(value);
          const count = value.split("\n").length;
          this.lineNumbers = Array.from({ length: count }, (_, i) => i + 1).join(
            "\n",
          );
        },

        async initContainer() {
          if (this.coreReady || this._initializing) return;
          this._initializing = true;

          try {
            if (!("serviceWorker" in navigator)) {
              throw new Error("当前浏览器不支持 Service Worker");
            }

            await navigator.serviceWorker.register("/sw.js");
            await navigator.serviceWorker.ready;

            const root = await navigator.storage.getDirectory();
            this._space = await root.getDirectoryHandle(SPACE, {
              create: true,
            });

            this.coreReady = true;
            this.status = "虚拟容器已就绪";
            await new Promise((resolve) => {
              requestAnimationFrame(() => requestAnimationFrame(resolve));
            });
            await this.run();
          } catch (error) {
            console.error("[docs-playground] init failed", error);
            this.status = "虚拟容器初始化失败：" + error.message;
          } finally {
            this._initializing = false;
          }
        },

        async writeFile(path, content) {
          const parts = path.split("/");
          const fileName = parts.pop();
          let dir = this._space;

          for (const part of parts) {
            dir = await dir.getDirectoryHandle(part, { create: true });
          }

          const file = await dir.getFileHandle(fileName, { create: true });
          const writable = await file.createWritable();
          await writable.write(content);
          await writable.close();
        },

        async run() {
          if (!this.coreReady || this.busy) return;

          this.busy = true;
          this.status = "正在写入虚拟文件…";

          try {
            const version = Date.now();
            await this.writeFile("page.html", this.code);
            await this.writeFile("index.html", buildIndex(version));
            this.frameSrc = `/$${SPACE}/index.html?v=${version}`;
            this.status = "已运行，可继续编辑后重新运行";
            this.dirty = false;
          } catch (error) {
            console.error("[docs-playground] run failed", error);
            this.status = "运行失败：" + error.message;
          } finally {
            this.busy = false;
          }
        },

        syncScroll(event) {
          const area = event.target;
          const pre = this.shadow.$(".highlight").ele;
          const gutter = this.shadow.$(".gutter").ele;

          pre.scrollTop = area.scrollTop;
          pre.scrollLeft = area.scrollLeft;
          gutter.scrollTop = area.scrollTop;
        },

        updateCursor(event) {
          const area = event.target;
          const before = area.value.slice(0, area.selectionStart);
          const lines = before.split("\n");
          this.cursorLine = lines.length;
          this.cursorColumn = lines[lines.length - 1].length + 1;
        },

        onEditorKeydown(event) {
          const area = event.target;

          if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
            event.preventDefault();
            this.run();
            return;
          }

          if (event.key === "Tab") {
            event.preventDefault();
            const start = area.selectionStart;
            const end = area.selectionEnd;
            const next = `${area.value.slice(0, start)}  ${area.value.slice(end)}`;
            this.code = next;
            requestAnimationFrame(() => {
              area.selectionStart = area.selectionEnd = start + 2;
            });
            return;
          }

          if (event.key === "Enter") {
            const start = area.selectionStart;
            const before = area.value.slice(0, start);
            const line = before.slice(before.lastIndexOf("\n") + 1);
            const indent = line.match(/^[ \t]*/)?.[0] || "";
            if (!indent) return;

            event.preventDefault();
            const next = `${before}\n${indent}${area.value.slice(area.selectionEnd)}`;
            this.code = next;
            requestAnimationFrame(() => {
              area.selectionStart = area.selectionEnd = start + 1 + indent.length;
            });
          }
        },
      },
    };
  </script>
