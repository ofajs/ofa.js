      <h1>Asincronía y estados de carga</h1>
      <p class="doc-lead">Controla la interfaz con los tres estados asíncronos: loading / error / success; no pongas resultados asíncronos en un getter.</p>

      <p>
  La inicialización de una página a menudo tiene que esperar a una API. No envuelvas la lógica asíncrona en un getter; usa
  campos de estado explícitos: <code>loading</code>, <code>error</code> y <code>user</code>, y deja que ellos controlen la interfaz.
</p>
<l-m src="../../components/playground.html"></l-m>
      <docs-playground lesson="lesson-19" fold-styles="true"></docs-playground>
<h2>Flujo recomendado</h2>
<ol>
  <li>Inicia la petición: <code>status = "loading"</code> y borra el error anterior;</li>
  <li>Si tiene éxito: escribe el resultado en los datos y pon <code>status = "done"</code>;</li>
  <li>Si falla: escribe el mensaje de error en <code>error</code> y pon <code>status = "error"</code>.</li>
</ol>
<p>
  La interfaz usa <code>o-if</code> / <code>o-else-if</code> / <code>o-else</code>
  para mostrar, respectivamente, la carga, el error y el contenido.
</p>
<div class="doc-note">
  <strong>Por qué importa un estado explícito:</strong> un único <code>user</code> no permite distinguir
  "aún no iniciado", "cargando" y "no se pudo cargar". Los campos de estado dan a cada caso una interfaz definida,
  y facilitan añadir interacciones como deshabilitar botones o reintentar.
</div>
<h2>Pruébalo tú mismo</h2>
<p>
  Dale a la petición un retardo de 600 ms (el ejemplo ya lo tiene) y deshabilita el botón "Recargar" mientras carga;
  después prueba a hacer clicable el mensaje de fallo para reintentar.
</p>
