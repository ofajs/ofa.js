      <h1>Condicionales y listas</h1>
      <p class="doc-lead">
        <code>o-if</code> controla si el contenido existe, mientras que <code>o-fill</code> renderiza una lista a partir de un arreglo.
        Ambas son implementaciones que residen en el elemento, así que comprender el ámbito y la estructura del DOM es importante.
      </p>

      <h2>Renderizado condicional</h2>
      <pre><code>&lt;o-if :value="count &gt; 10"&gt;
  &lt;p&gt;Mayor que 10&lt;/p&gt;
&lt;/o-if&gt;
&lt;o-else-if :value="count &gt; 5"&gt;
  &lt;p&gt;Mayor que 5&lt;/p&gt;
&lt;/o-else-if&gt;
&lt;o-else&gt;
  &lt;p&gt;5 o menos&lt;/p&gt;
&lt;/o-else&gt;</code></pre>
      <ul>
        <li>Las tres etiquetas deben escribirse <strong>de forma consecutiva</strong>, sin otros elementos entre ellas;</li>
        <li><code>o-else</code> no recibe <code>value</code>;</li>
        <li>Cuando la condición es falsa, el contenido se elimina; cuando es verdadera, el contenido se vuelve a crear;</li>
        <li>Si alternas la visibilidad con frecuencia y necesitas conservar el estado del DOM, cambiar con <code>class:</code> es una mejor opción.</li>
      </ul>

      <h2>Fundamentos de o-fill</h2>
      <pre><code>&lt;ul&gt;
  &lt;o-fill :value="todos" fill-key="id"&gt;
    &lt;li class:done="$data.done"&gt;
      &lt;input type="checkbox" sync:checked="$data.done" /&gt;
      &lt;span&gt;{{$data.text}}&lt;/span&gt;
      &lt;button on:click="$host.remove($data.id)"&gt;×&lt;/button&gt;
    &lt;/li&gt;
  &lt;/o-fill&gt;
&lt;/ul&gt;</code></pre>
      <p>
        <code>fill-key</code> apunta al campo único de un elemento de la lista. Con él,
        los nodos se reutilizan por clave cuando se agregan, eliminan o reordenan elementos,
        de modo que el estado de los campos de entrada dentro de un elemento no se pierde; omítelo solo cuando no haya un campo único.
      </p>

      <h2>Ámbito del elemento de lista</h2>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead>
          <tr><th>Variable</th><th>Significado</th></tr>
        </thead>
        <tbody>
          <tr><td><code>$data</code></td><td>Datos del elemento actual</td></tr>
          <tr><td><code>$index</code></td><td>Índice del elemento actual, comenzando en 0</td></tr>
          <tr><td><code>$host</code></td><td>Instancia de la página o componente anfitrión, usada para llamar a métodos del proto</td></tr>
          <tr><td><code>$parent</code></td><td>Datos del elemento externo en un o-fill anidado</td></tr>
          <tr><td><code>$ele</code></td><td>Nodo del elemento actual</td></tr>
        </tbody>
      </table>
        </div>
      <div class="doc-note">
        <strong>No puedes usar nombres de elemento personalizados dentro de o-fill.</strong>
        Dentro de un elemento de la lista solo puedes usar <code>$data.text</code>; no puedes escribir <code>item.text</code>
        ni <code>row.text</code>. En el nivel raíz (fuera de o-fill) estas variables no existen;
        usa directamente los campos de datos y los nombres de métodos del proto.
      </div>

      <h2>Listas anidadas</h2>
      <pre><code>&lt;o-fill :value="groups" fill-key="id"&gt;
  &lt;section&gt;
    &lt;h3&gt;{{$data.name}}&lt;/h3&gt;
    &lt;o-fill :value="$data.items" fill-key="id"&gt;
      &lt;p&gt;{{$parent.name}} / {{$data.name}}&lt;/p&gt;
    &lt;/o-fill&gt;
  &lt;/section&gt;
&lt;/o-fill&gt;</code></pre>
      <p>
        El <code>$data</code> interno es el elemento hijo, y <code>$parent</code> es el grupo externo.
      </p>

      <h2>Plantillas con nombre</h2>
      <p>
        Cuando la estructura es compleja o necesita reutilizarse, coloca el elemento de la lista en un
        <code>&lt;template name&gt;</code> de nivel superior y referéncialo con <code>o-fill name</code>:
      </p>
      <pre><code>&lt;o-fill :value="products" name="product-card" fill-key="id"&gt;&lt;/o-fill&gt;

&lt;template name="product-card"&gt;
  &lt;article class="card"&gt;
    &lt;h3&gt;{{$data.name}}&lt;/h3&gt;
    &lt;p&gt;¥{{$data.price}}&lt;/p&gt;
    &lt;button on:click="$host.addToCart($data.id)"&gt;Agregar al carrito&lt;/button&gt;
  &lt;/article&gt;
&lt;/template&gt;</code></pre>
      <p>Las plantillas con nombre deben colocarse fuera de <code>o-fill</code>, normalmente en el nivel superior de la plantilla de la página.</p>
      <p>
        Una plantilla con nombre también puede referenciarse a sí misma, lo que resulta útil para renderizar estructuras de árbol:
      </p>
      <pre><code>&lt;ul&gt;
  &lt;o-fill :value="tree" name="tree-node" fill-key="id"&gt;&lt;/o-fill&gt;
&lt;/ul&gt;

&lt;template name="tree-node"&gt;
  &lt;li&gt;
    {{$data.name}}
    &lt;ul&gt;
      &lt;o-fill :value="$data.children" name="tree-node" fill-key="id"&gt;&lt;/o-fill&gt;
    &lt;/ul&gt;
  &lt;/li&gt;
&lt;/template&gt;</code></pre>

      <h2>replace-temp para select y table</h2>
      <p>
        El analizador del navegador corrige los elementos dentro de <code>&lt;select&gt;</code> y <code>&lt;table&gt;</code>
        que no están en su lista blanca. Escribir <code>o-fill</code> directamente dentro de ellos
        hace que no se renderice; necesitas <code>&lt;template is="replace-temp"&gt;</code>:
      </p>
      <pre><code>&lt;select&gt;
  &lt;template is="replace-temp"&gt;
    &lt;o-fill :value="cities"&gt;
      &lt;option&gt;{{$data}}&lt;/option&gt;
    &lt;/o-fill&gt;
  &lt;/template&gt;
&lt;/select&gt;</code></pre>
      <p>Las filas de tabla deben combinarse con una plantilla con nombre:</p>
      <pre><code>&lt;tbody&gt;
  &lt;template is="replace-temp"&gt;
    &lt;o-fill :value="rows" name="table-row"&gt;&lt;/o-fill&gt;
  &lt;/template&gt;
&lt;/tbody&gt;

&lt;template name="table-row"&gt;
  &lt;tr&gt;
    &lt;td&gt;{{$data.name}}&lt;/td&gt;
    &lt;td&gt;{{$data.desc}}&lt;/td&gt;
  &lt;/tr&gt;
&lt;/template&gt;</code></pre>

      <h2>Advertencia sobre la estructura del DOM</h2>
      <p>
        <code>o-if</code> y <code>o-fill</code> usan
        <code>display: contents</code>, por lo que los elementos en sí permanecen en el DOM.
        Como resultado, los selectores de hijos CSS los atraviesan: <code>.container &gt; .item</code>
        no coincidirá con un elemento dentro de <code>o-if</code>, y <code>table.rows</code>
        no contará las filas producidas por <code>o-fill</code>. Cuando un selector deje de funcionar,
        cambia a un selector descendiente o ajusta la estructura.
      </p>
