<template page>
  <link rel="stylesheet" href="{{SITE}}/styles/site.css" />
  <link rel="stylesheet" href="{{SITE}}/styles/docs.css" />
  <l-m src="{{SITE}}/components/docs-layout.html"></l-m>

  <docs-layout attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc">
      <p class="doc-kicker">Getting started</p>
      <h1>第一个页面</h1>
      <p class="doc-lead">
        页面模块负责一个路由位置的内容。它可以直接被 <code>o-page</code>
        加载，也可以交给 <code>o-app</code> 管理页面栈。
      </p>

      <h2>1. 页面模块</h2>
      <p>
        新建 <code>page.html</code>。页面使用
        <code>&lt;template page&gt;</code>，不需要 <code>tag</code>：
      </p>
      <pre><code>&lt;template page&gt;
  &lt;style&gt;
    :host {
      display: block;
      padding: 24px;
    }
  &lt;/style&gt;

  &lt;h1&gt;你好，{{name}}&lt;/h1&gt;
  &lt;p&gt;当前计数：{{count}}&lt;/p&gt;
  &lt;button on:click="count++"&gt;点我 +1&lt;/button&gt;

  &lt;script&gt;
    export default async ({ query }) =&gt; ({
      data: {
        name: query.name || "ofa.js",
        count: 0,
      },
    });
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <h2>2. 用 o-page 直接加载</h2>
      <p>
        最简单的方式是在入口 HTML 里放一个 <code>o-page</code>，
        通过 <code>src</code> 指向页面模块：
      </p>
      <pre><code>&lt;!doctype html&gt;
&lt;html lang="zh-CN"&gt;
  &lt;head&gt;
    &lt;meta charset="UTF-8" /&gt;
    &lt;title&gt;第一个页面&lt;/title&gt;
    &lt;script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@5/dist/ofa.min.mjs"
    &gt;&lt;/script&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;o-page src="./page.html?name=Yao"&gt;&lt;/o-page&gt;
  &lt;/body&gt;
&lt;/html&gt;</code></pre>
      <p>
        <code>?name=Yao</code> 会进入页面模块函数的 <code>query</code> 参数。
        页面里的 <code>this.goto()</code>、<code>this.back()</code> 等方法
        在 <code>o-app</code> 内才具备完整路由语义。
      </p>

      <h2>3. 用 o-app 管理页面</h2>
      <p>
        需要多页跳转、页面栈和切换动画时，用 <code>o-app</code> 加载应用配置：
      </p>
      <pre><code>&lt;script
  type="module"
  src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@5/dist/ofa.min.mjs"
&gt;&lt;/script&gt;

&lt;o-app src="./app-config.js"&gt;&lt;/o-app&gt;</code></pre>

      <pre><code>// app-config.js
export const home = "./page.html";

export const pageAnime = {
  current: { opacity: 1, transform: "translate(0, 0)" },
  next: { opacity: 0, transform: "translate(30px, 0)" },
  previous: { opacity: 0, transform: "translate(-30px, 0)" },
};</code></pre>

      <p>
        <code>home</code> 是应用启动后加载的第一个页面。页面内使用
        <code>this.goto("./detail.html")</code> 或
        <code>&lt;a olink href="./detail.html"&gt;</code> 跳转。
        详细配置见 <a olink href="./app.html">o-app 应用</a>。
      </p>

      <div class="doc-note">
        <strong>页面必须通过 HTTP 访问。</strong>
        直接双击 HTML 文件时，<code>file://</code> 会拦截模块脚本和页面 fetch。
        在目录里运行 <code>npx serve .</code> 或 <code>python3 -m http.server</code>
        即可。
      </div>

      <p class="doc-end">
        上一篇：<a olink href="./first-component.html">第一个组件 →</a>
        　·　下一篇：<a olink href="./component.html">组件 →</a>
      </p>
    </article>
  </docs-layout>
