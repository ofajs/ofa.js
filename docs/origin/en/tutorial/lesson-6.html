      <h1>Two-way binding</h1>
      <p class="doc-lead">sync: keeps a form field and data in sync in both directions. Best for scalar values.</p>

      <p>
  <code>sync:</code> does two things at once: it updates the form when data changes,
  and writes user input back into data. It works well for scalar values such as
  strings, numbers, and booleans.
</p>
<l-m src="{{SITE}}/components/playground.html"></l-m>
      <docs-playground lesson="lesson-6" fold-styles="true"></docs-playground>
<h2>Common form fields</h2>
<ul>
  <li><code>sync:value="name"</code>: text inputs, textarea, select;</li>
  <li><code>sync:checked="subscribe"</code>: the checked state of a checkbox;</li>
  <li>The preview below updates as you type, which shows the value has been written
    back to <code>data</code>.</li>
</ul>
<div class="doc-note">
  <strong>Don't sync objects:</strong> two-way binding an object leads to confusing
  references. To edit an object or array, bind to a specific field with
  <code>sync:value="$data.field"</code>, or handle the input in an
  <code>on:input</code> method.
</div>
<h2>Try it</h2>
<p>
  Add an "Age" number input (<code>type="number"</code>), bind it with
  <code>sync:value</code>, and show next year's age in the preview.
</p>
