      <h1>组件参数</h1>
      <p class="doc-lead">外部数据通过 attrs 传给组件；组件内部用 data 保存自己的状态。</p>

      <p>
  组件从外部接收的属性写在 <code>attrs</code> 里，并给默认值；组件内部
  会变化的状态放在 <code>data</code> 里。两者不能重名。
</p>
<l-m src="../../components/playground.html"></l-m>
      <docs-playground lesson="lesson-13"></docs-playground>
<h2>attrs vs data</h2>
<ul>
  <li><code>attrs</code>：外部传入的标量（名字、角色、初始等级），
    会反映到 HTML attribute；</li>
  <li><code>data</code>：组件自己的响应式状态，外部不直接改；</li>
  <li>示例里的 <code>startLevel</code> 是字符串，组件内用
    <code>Number()</code> 转成数字。</li>
</ul>
<div class="doc-note">
  <strong>不要直接改 attrs：</strong>子组件把 <code>attrs</code> 当只读输入，
  需要派生状态就复制到 <code>data</code>。这样数据来源清晰，也避免父子互相覆盖。
</div>
<h2>动手改</h2>
<p>
  在页面里加一个 <code>level</code> 数据字段和一个输入框，用
  <code>attr:start-level="level"</code> 动态传给第二个组件。
</p>
