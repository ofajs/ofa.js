<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ofa router · 迷你应用案例</title>
    <style>
      /* 设计令牌：CSS 变量可穿透 shadow DOM，被各页面模板直接引用 */
      :root {
        --bg: #f4f5fb;
        --card: #ffffff;
        --text: #1e293b;
        --muted: #64748b;
        --border: #e7e9f2;
        --accent: #4f46e5;
        --accent-2: #7c3aed;
        --accent-soft: #eef2ff;
      }
      * { box-sizing: border-box; }
      body {
        font: 15px/1.65 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(1100px 480px at 85% -10%, #e4e8ff 0%, transparent 60%),
          radial-gradient(900px 420px at -10% 0%, #f2e8ff 0%, transparent 55%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }
      o-app { display: block; min-height: 100vh; }
      /* 解开 o-router :host 的 height:100%，长内容走文档自然滚动；
         overflow:hidden 仍保留在 o-router 上，用于裁掉过渡期 30px 位移 */
      o-router { height: auto; }
      /* 顶层页面（布局页 / 根级 fail 页）：放开 o-app ::slotted 的
         height:100%，改为最小满屏、随内容撑高，导航栏才能 sticky */
      o-app > o-page { display: block; height: auto; min-height: 100vh; }
    </style>
  </head>
  <body>
    <!--
      o-router：o-app 的 hash 路由桥（packages/router）。
      - 页面地址同步到 location.hash（#/pages/xxx.html?query），刷新、
        直达、分享链接都不需要服务器重写；
      - 接管浏览器前进/后退；
      - fix-body：重置 html/body 尺寸，让 o-app 撑满视口。
      不需要 hash 地址时，去掉 o-router 直接用 o-app 即可。
    -->
    <o-router fix-body>
      <o-app src="./app-config.mjs"></o-app>
    </o-router>

    <script type="module">
      // ofa.js 主体（o-app/o-page/olink）在 packages/ofajs，
      // o-router 在本包 packages/router
      import "../../../ofajs/src/main.mjs";
      import "../../src/router.mjs";

      // 暴露应用实例，便于控制台调试
      window.__app = ofa("o-app");
    </script>
  </body>
</html>
