      <h1>插件与扩展</h1>
      <p class="doc-lead">
        插件是「引用才生效」的可选能力，不属于 ofa.js 默认构建。
        它们挂接页面已加载的全局 <code>$</code>，不会引入第二份框架实例。
      </p>

      <h2>现有插件</h2>
      <div class="doc-table-wrap">
        <table class="doc-table">
          <thead>
            <tr><th>插件</th><th>能力</th><th>使用方式</th></tr>
          </thead>
          <tbody>
            <tr>
              <td><code>formdata</code></td>
              <td>容器表单值 ↔ stanz 对象双向绑定</td>
              <td><code>$("#form").formData()</code></td>
            </tr>
            <tr>
              <td><code>inject-host</code></td>
              <td>把 shadow 内的 style/link 提升到宿主，穿透 slot 深层</td>
              <td><code>&lt;inject-host&gt;</code></td>
            </tr>
            <tr>
              <td><code>body-ghost</code></td>
              <td>把模板内容传送到 body 末尾渲染（弹窗 / 浮层）</td>
              <td><code>&lt;body-ghost&gt;</code></td>
            </tr>
            <tr>
              <td><code>global-link</code></td>
              <td>向其后挂载的组件注入全局样式表</td>
              <td><code>&lt;o-global-link href&gt;</code></td>
            </tr>
          </tbody>
        </table>
      </div>

      <h2>引入方式</h2>
      <p>源码形态直接 import，dist 形态用经典脚本或 ESM：</p>
      <pre><code>// monorepo / npm 源码
import "ofa.js/packages/plugins/formdata/formdata.mjs";

// dist 经典脚本（配合 dist ofa.js）
&lt;script src=".../packages/plugins/formdata/dist/formdata.min.js"&gt;&lt;/script&gt;

// dist ESM
import ".../packages/plugins/formdata/dist/formdata.min.mjs";</code></pre>
      <p>
        插件必须在 ofa.js 之后加载，因为它要挂接全局 <code>$</code>；
        缺失时会直接抛错。
      </p>

      <h2>formData</h2>
      <pre><code>&lt;form id="profile"&gt;
  &lt;input name="username" /&gt;
  &lt;input name="email" type="email" /&gt;
  &lt;input name="tags" type="checkbox" value="admin" /&gt;
&lt;/form&gt;</code></pre>
      <pre><code>const data = $("#profile").formData();

data.username;          // 读取
data.username = "Yao";  // 写回表单
data.revoke();          // 释放绑定</code></pre>
      <p>
        复选框会聚合成数组，select 多选、radio、file 都有对应处理。
        自定义表单组件只要暴露 <code>value</code> 属性并设置
        <code>name</code> 即可接入。
      </p>

      <h2>inject-host</h2>
      <p>
        <code>::slotted()</code> 只能命中插槽内容的第一层。需要给 slot
        深处的元素写样式时，用 <code>&lt;inject-host&gt;</code> 把样式提升到宿主：
      </p>
      <pre><code>&lt;template component&gt;
  &lt;inject-host&gt;
    &lt;style&gt;
      user-list user-list-item .item-name { color: red; }
    &lt;/style&gt;
  &lt;/inject-host&gt;
  &lt;slot&gt;&lt;/slot&gt;
&lt;/template&gt;</code></pre>
      <p>
        选择器要写完整组件路径，避免污染其他组件；频繁更新样式的场景慎用。
      </p>

      <h2>body-ghost</h2>
      <p>
        弹窗、toast、浮层需要跳出父级 <code>overflow</code> 或
        <code>transform</code> 限制时，把内容传送到 body：
      </p>
      <pre><code>&lt;body-ghost&gt;
  &lt;div class="dialog"&gt;
    &lt;slot&gt;&lt;/slot&gt;
  &lt;/div&gt;
&lt;/body-ghost&gt;</code></pre>
      <p>
        框架绑定会跟随元素移动，原生事件在真实 DOM 位置冒泡。
      </p>

      <h2>global-link</h2>
      <pre><code>&lt;o-global-link href="./theme.css"&gt;&lt;/o-global-link&gt;</code></pre>
      <p>
        样式表只会注入到它<strong>之后挂载</strong>的组件 shadow；
        移除 <code>o-global-link</code> 后，新组件不再获得样式。
        它会污染全局作用域，谨慎使用。
      </p>

      <h2>match-var（核心样式查询）</h2>
      <p>
        需要按 CSS 变量切换组件内部样式时，可以用核心的
        <code>&lt;match-var&gt;</code>，它不需要额外插件：
      </p>
      <pre><code>&lt;match-var theme="dark"&gt;
  &lt;style&gt;.content { background: #333; color: white; }&lt;/style&gt;
&lt;/match-var&gt;

&lt;!-- 多个条件同时匹配 --&gt;
&lt;match-var theme="dark" size="large"&gt;
  &lt;style&gt;:host { padding: 20px; }&lt;/style&gt;
&lt;/match-var&gt;</code></pre>
      <p>
        条件来自 CSS 变量的值。外层用 <code>data()</code> 把数据写进变量：
      </p>
      <pre><code>&lt;style&gt;
  .container { --theme: data(currentTheme); --size: data(currentSize); }
&lt;/style&gt;</code></pre>
      <div class="doc-note">
        <strong>Firefox：</strong>改变变量后若样式没有立即切换，
        手动调用 <code>$.checkMatch()</code> 触发一次重新检测。
      </div>

      </p>
