      <h1>Events &amp; Forms</h1>
      <p class="doc-lead">
        Bind events with <code>on:</code> and one-time events with <code>one:</code>.
        Form control values stay in two-way sync with data through <code>sync:</code>.
      </p>

      <h2>Binding methods</h2>
      <pre><code>&lt;button on:click="save"&gt;Save&lt;/button&gt;
&lt;button on:click="count++"&gt;+1&lt;/button&gt;
&lt;button on:click="add(5)"&gt;Add 5&lt;/button&gt;
&lt;input on:input="update($event)" /&gt;</code></pre>
      <p>
        A bare identifier (<code>save</code>) is resolved as a <code>proto</code> method and
        automatically bound to <code>this</code>. Complex expressions run directly. String
        literals inside expressions must be quoted, otherwise they are treated as variable names.
      </p>

      <h2>Event object</h2>
      <pre><code>&lt;input on:keydown="onKeydown($event)" /&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { draft: "" },
    proto: {
      onKeydown(event) {
        if (event.key !== "Enter") return;
        this.submit();
      },
      submit() {
        console.log(this.draft);
      },
    },
  });
&lt;/script&gt;</code></pre>
      <p>
        <code>$event</code> is the native event object. Data from custom events lives in
        <code>event.data</code>, while the original DOM event fields remain available.
      </p>

      <h2>One-time events</h2>
      <pre><code>&lt;img one:load="onImageReady" src="./cover.jpg" /&gt;
&lt;div one:click="dismiss"&gt;Click to unbind&lt;/div&gt;</code></pre>
      <p>
        <code>one:</code> unbinds automatically after the first trigger, which suits
        initialization, dismissing notices, and similar cases.
      </p>

      <h2>Two-way form binding</h2>
      <pre><code>&lt;input type="text" sync:value="form.name" placeholder="Name" /&gt;
&lt;input type="checkbox" sync:checked="form.agree" /&gt;
&lt;select sync:value="form.city"&gt;
  &lt;option value="shanghai"&gt;Shanghai&lt;/option&gt;
  &lt;option value="beijing"&gt;Beijing&lt;/option&gt;
&lt;/select&gt;</code></pre>
      <p>
        <code>sync:</code> is only for scalars. A form object can live in <code>data</code>
        as a whole, but each field binding must still target a specific scalar.
      </p>

      <h2>Submitting a form</h2>
      <pre><code>&lt;form on:submit="onSubmit($event)"&gt;
  &lt;input sync:value="form.name" required /&gt;
  &lt;button type="submit"&gt;Save&lt;/button&gt;
&lt;/form&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { form: { name: "" } },
    proto: {
      onSubmit(event) {
        event.preventDefault();
        if (!this.form.name.trim()) return;
        console.log("submit", this.form.name);
      },
    },
  });
&lt;/script&gt;</code></pre>

      <h2>Custom events</h2>
      <p>A component or page emits an event on its own:</p>
      <pre><code>this.emit("save", {
  data: { id: 1, name: "John Doe" },
  bubbles: true,   // true by default
  composed: true,  // set when the event must cross the Shadow DOM boundary
});</code></pre>
      <p>Consumers listen for it and read <code>event.data</code>:</p>
      <pre><code>&lt;user-form on:save="onSaved"&gt;&lt;/user-form&gt;

&lt;script&gt;
  export default async () =&gt; ({
    data: { savedName: "" },
    proto: {
      onSaved(event) {
        this.savedName = event.data.name;
      },
    },
  });
&lt;/script&gt;</code></pre>
      <p>
        When an <code>o-page</code> embedded in the host's Shadow DOM emits an event
        upward, <code>bubbles: true</code> and <code>composed: true</code> must both be
        present, otherwise the host never receives it.
      </p>

      <h2>Naming suggestions</h2>
      <ul>
        <li>Use lowercase kebab-case for event names: <code>data-changed</code>, <code>form-save</code>;</li>
        <li>Reuse native event names such as <code>click</code>, <code>input</code>, and <code>submit</code>;</li>
        <li>Don't prefix event names with <code>on</code>; the template's <code>on:</code> already expresses that.</li>
      </ul>
