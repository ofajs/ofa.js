      <h1>嵌套佈局</h1>
      <p class="doc-lead">子頁聲明 parent，父頁用 slot 承接；切子頁時父頁不銷燬。</p>

      <p>
  導航欄、側邊欄這類公共結構放在父頁裡，子頁只寫內容，通過
  <code>parent</code> 掛到父頁的 <code>&lt;slot&gt;</code> 下。
</p>
<l-m src="{{SITE}}/components/playground.html"></l-m>
      <docs-playground lesson="lesson-18" fold-styles="true"></docs-playground>
<h2>佈局如何工作</h2>
<ul>
  <li><code>layout.html</code>：導航 + <code>&lt;main&gt;&lt;slot&gt;&lt;/slot&gt;&lt;/main&gt;</code>；</li>
  <li><code>home.html</code> / <code>settings.html</code>：
    <code>export const parent = "./layout.html"</code>；</li>
  <li>父頁的 <code>routerChange</code> 在子頁切換時觸發，用來更新導航高亮。</li>
</ul>
<p>
  兩個子頁互相切換時，父頁實例不會重建，導航狀態和佈局都保留。
</p>
<div class="doc-note">
  <strong>別在子頁裡重複佈局：</strong>導航和頁腳只寫一次，放在父頁；
  子頁只關心自己的內容。需要多級嵌套時，父頁也可以再聲明 parent。
</div>
<h2>動手改</h2>
<p>
  再加一個 <code>profile.html</code> 子頁和對應導航項，確認切換時佈局不會閃動。
</p>
