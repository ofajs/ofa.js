    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Roboto", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #c3c7cf;
      }

      /* 首屏 critical：只保定位/尺寸/遮罩，装饰样式在 styles/loading.css */
      #site-loading {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        transition: opacity 0.22s ease;
      }

      #site-loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .site-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(260px, 70vw);
      }

      .site-loading-logo {
        display: block;
        width: auto;
        height: 30px;
      }

    </style>

  <body>
    <div id="site-loading" role="status" aria-live="polite">
      <div class="site-loading-inner">
        <div class="site-loading-brand" aria-hidden="true">
          <img class="site-loading-logo" src="../assets/logo.svg" width="28" height="30" alt="" />
          <span class="site-loading-wordmark">ofa<span>.js</span></span>
        </div>
        <div class="site-loading-bar" aria-hidden="true"></div>
        <div class="site-loading-label">
          <span class="site-loading-label-zh">正在加载页面…</span>
          <span class="site-loading-label-tcn">正在載入頁面…</span>
          <span class="site-loading-label-ja">ページを読み込み中…</span>
          <span class="site-loading-label-es">Cargando página…</span>
          <span class="site-loading-label-en">Loading page…</span>
        </div>
      </div>
    </div>

    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../app.mjs">
      <template page>

  <link rel="stylesheet" href="../styles/site.css" />
  <l-m src="../components/demo-counter.html"></l-m>
  <l-m src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@main/packages/button/button.html"></l-m>

  <main class="main">
      <!-- ============ PORTADA ============ -->
      <section class="hero" id="top">
        <div class="hero-inner">
          <div class="hero-copy">
            <div class="hero-badges">
              <span class="eyebrow">
                <i class="pulse"></i>
                v5 · Framework de Web Components sin compilación
              </span>
              <a
                class="legacy-docs"
                href="https://v4.ofajs.com"
                target="_blank"
                rel="noreferrer"
                aria-label="Abrir la documentación heredada de v4 (nueva pestaña)"
              >
                Documentación heredada de v4
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </div>
  
            <h1>Escribe componentes<br /><span class="grad">como HTML puro.</span></h1>
  
            <p class="lead">
              ofa.js es un framework de frontend <b>sin compilación y sin dependencias</b>. <b>Un archivo .html es un componente</b>,
              y el navegador lo ejecuta directamente: sin andamiaje, sin la caja negra de un empaquetador, solo el HTML, CSS y JavaScript que ya conoces.
            </p>
  
            <div class="actions">
              <st-button class="btn btn-primary" on:click="jump('start')">
                Empieza en 5 minutos
                <svg class="icon" slot="suffix" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14M13 6l6 6-6 6"></path>
                </svg>
              </st-button>
              <st-button
                class="btn btn-ghost"
                variant="outlined"
                on:click="openExternal(githubUrl)"
              >
                Ver en GitHub
              </st-button>
            </div>
  
            <div class="cdn-box">
              <div class="cdn-top">
                <span class="cdn-tag">CDN · v5</span>
                <span class="cdn-label">ESM</span>
                <st-icon-button
                  class="copy-btn"
                  on:click="copySnippet(cdnUrl)"
                  aria-label="Copiar la URL del ESM de v5"
                  title="Copiar la URL del ESM de v5"
                >
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                    <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
                  </svg>
                </st-icon-button>
              </div>
              <span class="cdn-url" attr:title="cdnUrl">{{cdnUrl}}</span>
              <p class="cdn-hint">Copia la URL y pégala en una etiqueta &lt;script type="module"&gt; o en un import.</p>
            </div>
  
            <div class="cdn-box skill-box">
              <div class="cdn-top">
                <span class="cdn-tag">AI · SKILL</span>
                <span class="cdn-label">{{site.skill.label}}</span>
                <st-icon-button
                  class="copy-btn"
                  on:click="copySkill"
                  attr:aria-label="site.skill.copyAria"
                  attr:title="site.skill.copyAria"
                >
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                    <path d="M5 15V5a2 2 0 0 1 2-2h10"></path>
                  </svg>
                </st-icon-button>
              </div>
              <span class="cdn-url" attr:title="skillUrl">{{skillUrl}}</span>
              <p class="cdn-hint">{{site.skill.hint}}</p>
            </div>

            <div class="stats">
              <div class="stat">
                <b>0</b>
                <span>Dependencias en tiempo de ejecución</span>
              </div>
              <div class="stat">
                <b>24 KB</b>
                <span>Tamaño con gzip</span>
              </div>
              <div class="stat">
                <b>100%</b>
                <span>Estándares nativos</span>
              </div>
              <div class="stat">
                <b>2018</b>
                <span>Código abierto desde</span>
              </div>
            </div>
          </div>
  
          <div class="hero-visual" data-reveal style="--d: 120ms">
            <st-code
              frame
              lang="html"
              title="components/hello-ofa.html"
              style="--st-code-radius: var(--md-sys-shape-corner-xl);"
              :code="codeHero"
            ></st-code>
  
            <div class="window-status">
              <span class="ok"><i></i>Sin paso de compilación</span>
              <span>HTML → Navegador</span>
            </div>
  
            <div class="hero-float">
              <span class="float-label"><i></i>Un componente real · en vivo ahora mismo</span>
              <demo-counter start="12" attr:reset-label="site.demo.reset"></demo-counter>
            </div>
          </div>
        </div>
      </section>
  
      <!-- ============ CINTA ============ -->
      <div class="ticker" aria-hidden="true">
        <div class="ticker-track">
          <span>Custom Elements</span><i></i>
          <span>Shadow DOM</span><i></i>
          <span>ES Modules</span><i></i>
          <span>Reactividad por Proxy</span><i></i>
          <span>Sin compilación</span><i></i>
          <span>Sin dependencias</span><i></i>
          <span>Enrutador hash</span><i></i>
          <span>Compatible con SEO</span><i></i>
          <span>Micro frontend</span><i></i>
          <span>Compatible con IA</span><i></i>

          <span>Shadow DOM</span><i></i>
          <span>ES Modules</span><i></i>
          <span>Reactividad por Proxy</span><i></i>
          <span>Sin compilación</span><i></i>
          <span>Sin dependencias</span><i></i>
          <span>Enrutador hash</span><i></i>

          <span>Compatible con IA</span><i></i>
        </div>
      </div>
  
      <!-- ============ CARACTERÍSTICAS ============ -->
      <section class="section" id="features">
        <div class="section-head" data-reveal>
          <span class="kicker">Por qué ofa.js</span>
          <h2>Creado para la próxima web,<br />sin todo lo que sobra.</h2>
          <p>
            Sin npm, Node.js ni webpack, y sin un nuevo conjunto de reglas de compilación que aprender.
            El navegador ya admite componentes; ofa.js solo hace que sea lo bastante sencillo como para usarlo.
          </p>
        </div>
  
        <div class="bento">
          <article class="card card-split span-4" data-reveal>
            <div class="card-copy">
              <span class="icon-chip">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
                  <path d="M14 2v6h6"></path>
                </svg>
              </span>
              <h3>Un archivo HTML, un componente</h3>
              <p>
                Plantilla, estilos y lógica viven en el mismo archivo. El nombre de la etiqueta es el nombre del componente,
                y el navegador lo carga directamente: sin resultados de compilación, sin magia oculta.
              </p>
              <div class="file-flow">
                <span class="file-pill">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
                    <path d="M14 2v6h6"></path>
                  </svg>
                  hello-ofa.html
                </span>
                <span class="flow-arrow">→</span>
                <span class="tag-pill">&lt;hello-ofa&gt;</span>
              </div>
            </div>
  
            <st-code
              aria-hidden="true"
              frame
              lang="html"
              title="hello-ofa.html"
              style="--st-code-radius: var(--md-sys-shape-corner-lg);"
              :code="codeMini"
            ></st-code>
          </article>
  
          <article class="card span-2 card-counter" data-reveal style="--d: 80ms">
            <span class="icon-chip cyan">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M13 2 3 14h8l-1 8 10-12h-8l1-8Z"></path>
              </svg>
            </span>
            <h3>Reactividad de grano fino</h3>
            <p>Seguimiento de datos impulsado por Proxy: cambia los datos y la interfaz te sigue. Haz clic para probarlo.</p>
            <demo-counter start="7" attr:reset-label="site.demo.reset"></demo-counter>
          </article>
  
          <article class="card span-2" data-reveal>
            <span class="icon-chip amber">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m21 8-9-5-9 5v8l9 5 9-5Z"></path>
                <path d="m3 8 9 5 9-5"></path>
                <path d="M12 13v8"></path>
              </svg>
            </span>
            <h3>Sin compilación, sin cajas negras</h3>
            <p>Nada que instalar, configurar ni poner en cola para compilar. Escribe, guarda y actualiza: incluso el código generado por IA puede verificarse tal cual.</p>
            <div class="zero-pills">
              <span>npm</span>
              <span>webpack</span>
              <span>vite</span>
              <span>babel</span>
            </div>
          </article>
  
          <article class="card span-2" data-reveal style="--d: 60ms">
            <span class="icon-chip">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="6" cy="19" r="2.5"></circle>
                <circle cx="18" cy="5" r="2.5"></circle>
                <path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"></path>
              </svg>
            </span>
            <h3>Un enrutador pensado para páginas</h3>
            <p>o-app gestiona la aplicación, o-router se ocupa de la barra de direcciones y scsr genera rutas reales. Atrás, adelante y actualizar te llevan exactamente donde deben.</p>
            <div class="routes" aria-hidden="true">
              <span class="route active"><i class="dot"></i>#/pages/home.html</span>
              <span class="route"><i class="dot"></i>#/pages/detail.html?id=42</span>
              <span class="route"><i class="dot"></i>/posts/hello-world</span>
            </div>
          </article>
  
          <article class="card span-2" data-reveal style="--d: 120ms">
            <span class="icon-chip cyan">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"></path>
              </svg>
            </span>
            <h3>Una sola petición, todo incluido</h3>
            <p>Unos 24 KB con gzip y sin dependencias en tiempo de ejecución. Lo bastante pequeño para añadirlo a cualquier página.</p>
            <div class="bundle">
              <div class="bundle-num">24<small>KB · gzip</small></div>
              <div class="bar"><i></i></div>
              <div class="bar-label"><span>ofa.min.mjs</span><span>≈ 70 KB min</span></div>
            </div>
          </article>
  
          <article class="card card-wide span-6" data-reveal>
            <div>
              <span class="icon-chip">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m12 3 9 5-9 5-9-5 9-5Z"></path>
                  <path d="m3 13 9 5 9-5"></path>
                </svg>
              </span>
              <h3>Estándares nativos, no una isla</h3>
              <p>
                Los componentes son Custom Elements, los estilos están aislados dentro de Shadow DOM y los módulos usan ES Modules.
                Un componente escrito con ofa.js puede incrustarse en cualquier página y convivir con React o Vue: no es otro entorno de ejecución, solo una capa fina sobre las capacidades nativas.
              </p>
            </div>
            <div class="standard-grid">
              <div class="standard">
                <b><i></i>Custom Elements</b>
                <span>Los componentes son solo etiquetas, registradas de forma nativa por el navegador</span>
              </div>
              <div class="standard">
                <b><i></i>Shadow DOM</b>
                <span>Los estilos están acotados de forma predeterminada</span>
              </div>
              <div class="standard">
                <b><i></i>ES Modules</b>
                <span>Carga de módulos sin empaquetador</span>
              </div>
              <div class="standard">
                <b><i></i>Proxy</b>
                <span>Los cambios en los datos se rastrean automáticamente</span>
              </div>
            </div>
          </article>
        </div>
      </section>
  
      <!-- ============ DEMO EN VIVO ============ -->
      <section class="section" id="demo">
        <div class="demo-grid">
          <div class="demo-copy" data-reveal>
            <span class="kicker">Zona de pruebas en vivo</span>
            <h2>No te quedes mirando capturas.<br />Haz clic ahora mismo.</h2>
            <p>
              La aplicación de tareas de la derecha es un archivo HTML normal: la lista, el enlace bidireccional
              y las estadísticas calculadas los gestiona ofa.js en el navegador.
            </p>
  
            <ul class="check-list">
              <li>
                <span class="tick">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 6 9 17l-5-5"></path>
                  </svg>
                </span>
                <span>Añade, marca y elimina: todo se actualiza al instante</span>
              </li>
              <li>
                <span class="tick">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 6 9 17l-5-5"></path>
                  </svg>
                </span>
                <span>La lista usa <b>o-fill</b> + <b>fill-key</b> para reconciliar automáticamente las altas y las bajas</span>
              </li>
              <li>
                <span class="tick">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 6 9 17l-5-5"></path>
                  </svg>
                </span>
                <span>Los estilos están aislados dentro de Shadow DOM y nunca se filtran a la página</span>
              </li>
              <li>
                <span class="tick">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 6 9 17l-5-5"></path>
                  </svg>
                </span>
                <span>Ni una sola operación manual sobre el DOM en toda la demo</span>
              </li>
            </ul>
  
            <span class="demo-meta"><i></i>Ejecutándose en vivo · no es una grabación</span>
          </div>
  
          <div class="app-window" data-reveal style="--d: 100ms">
            <div class="app-bar">
              <span class="dots"><i></i><i></i><i></i></span>
              <span class="app-url">demo / todo.html</span>
              <span class="live-pill"><i></i>En vivo</span>
            </div>
  
            <div class="todo">
              <div class="todo-head">
                <div>
                  <span class="todo-kicker">{{site.demo.kicker}}</span>
                  <h3>{{site.demo.heading}}</h3>
                </div>
                <span class="todo-count">{{remaining}} {{site.demo.remainingSuffix}}</span>
              </div>
  
              <div class="todo-input">
                <input
                  sync:value="draft"
                  on:keydown="addOnEnter($event)"
                  attr:placeholder="site.demo.placeholder"
                  attr:aria-label="site.demo.inputAria"
                />
                <st-button
                  class="todo-add"
                  on:click="addTodo"
                  attr:disabled="!draft.trim()"
                >{{site.demo.add}}</st-button>
              </div>
  
              <ul class="todo-list">
                <o-fill :value="todos" fill-key="id">
                  <li class:done="$data.done">
                    <input
                      class="todo-check"
                      type="checkbox"
                      sync:checked="$data.done"
                      on:change="$host.refreshStats()"
                      attr:aria-label="$host.site.demo.checkAria"
                    />
                    <span class="todo-text">{{$data.text}}</span>
                    <st-icon-button
                      class="todo-del"
                      on:click="$host.removeTodo($data.id)"
                      attr:aria-label="$host.site.demo.deleteAria"
                    >×</st-icon-button>
                  </li>
                </o-fill>
              </ul>
  
              <div class="todo-foot">
                <st-button
                  class="todo-clear"
                  variant="text"
                  on:click="clearDone"
                  attr:disabled="doneCount === 0"
                >{{site.demo.clear}}</st-button>
                <span>{{doneCount}} / {{todos.length}} {{site.demo.doneSuffix}}</span>
              </div>
            </div>
          </div>
        </div>

      <!-- ============ INICIO RÁPIDO ============ -->
      <section class="section" id="start">
        <div class="section-head center" data-reveal>
          <span class="kicker">Inicio rápido</span>
          <h2>Tres pasos desde cero hasta tu primera página.</h2>
          <p>Sin instalaciones ni archivos de configuración. Abre tu editor y escribe un solo archivo HTML: eso es todo.</p>
        </div>
  
        <div class="steps">
          <article class="step" data-reveal>
            <span class="step-no">PASO 01</span>
