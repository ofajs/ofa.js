<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>body-ghost 插件自检</title>
  </head>
  <body>
    <!-- body-ghost 插件自检（纯页面，spec 驱动）：
        内容传送至 body 末尾、原作用域交互与 body 冒泡、移除清理。
        演示组件按 ofa.js 正统方式：HTML 文件 + l-m 引用 -->
    <ghost-wrap id="wrap-a"></ghost-wrap>
    <l-m src="./ghost-wrap.html"></l-m>

    <script type="module">
      import "../../../../ofajs/src/main.mjs";
      import "../../../body-ghost/body-ghost.mjs";

      window.__wrap = ofa("ghost-wrap");
    </script>
  </body>
</html>
