<template page>
  <link rel="stylesheet" href="{{SITE}}/styles/site.css" />

  <docs-layout attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc">
      <p class="doc-kicker">Primeros pasos</p>
      <h1>Tu primera página</h1>
      <p class="doc-lead">
        Un módulo de página posee el contenido de una ubicación de enrutamiento. Puede cargarse directamente
        con <code>o-page</code> o gestionarse en la pila de páginas con <code>o-app</code>.
      </p>

      <h2>1. El módulo de página</h2>
      <p>
        Crea <code>page.html</code>. Las páginas usan
        <code>&lt;template page&gt;</code> y no necesitan un <code>tag</code>:
      </p>
      <pre><code>&lt;template page&gt;
  &lt;style&gt;
    :host {
      display: block;
      padding: 24px;
    }
  &lt;/style&gt;

  &lt;h1&gt;Hola, {{name}}&lt;/h1&gt;
  &lt;p&gt;Recuento actual: {{count}}&lt;/p&gt;
  &lt;button on:click="count++"&gt;Haz clic +1&lt;/button&gt;

  &lt;script&gt;
    export default async ({ query }) =&gt; ({
      data: {
        name: query.name || "ofa.js",
        count: 0,
      },
    });
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <h2>2. Cargarla directamente con o-page</h2>
      <p>
        La forma más sencilla es poner un <code>o-page</code> en el HTML de entrada y
        apuntar <code>src</code> al módulo de página:
      </p>
      <pre><code>&lt;!doctype html&gt;
&lt;html lang="en"&gt;
  &lt;head&gt;
    &lt;meta charset="UTF-8" /&gt;
    &lt;title&gt;Primera página&lt;/title&gt;
    &lt;script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@5/dist/ofa.min.mjs"
    &gt;&lt;/script&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;o-page src="./page.html?name=Yao"&gt;&lt;/o-page&gt;
  &lt;/body&gt;
&lt;/html&gt;</code></pre>
      <p>
        <code>?name=Yao</code> se pasa a la función del módulo de página como el argumento
        <code>query</code>. Métodos como <code>this.goto()</code> y <code>this.back()</code> solo tienen
        la semántica completa de enrutamiento dentro de un <code>o-app</code>.
      </p>

      <h2>3. Gestionar páginas con o-app</h2>
      <p>
        Cuando necesites navegación entre varias páginas, una pila de páginas y animaciones de transición,
        carga una configuración de aplicación con <code>o-app</code>:
      </p>
      <pre><code>&lt;script
  type="module"
  src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@5/dist/ofa.min.mjs"
&gt;&lt;/script&gt;

&lt;o-app src="./app-config.js"&gt;&lt;/o-app&gt;</code></pre>

      <pre><code>// app-config.js
export const home = "./page.html";

export const pageAnime = {
  current: { opacity: 1, transform: "translate(0, 0)" },
  next: { opacity: 0, transform: "translate(30px, 0)" },
  previous: { opacity: 0, transform: "translate(-30px, 0)" },
};</code></pre>

      <p>
        <code>home</code> es la primera página que se carga cuando arranca la aplicación. Navega dentro de una página
        con <code>this.goto("./detail.html")</code> o
        <code>&lt;a olink href="./detail.html"&gt;</code>.
        Consulta <a olink href="./app.html">la página de la aplicación o-app</a> para ver la configuración completa.
      </p>

      <div class="doc-note">
        <strong>Las páginas deben servirse por HTTP.</strong>
        Si abres el archivo HTML directamente, <code>file://</code> bloquea los scripts de módulo y las peticiones de página.
        Ejecuta <code>npx serve .</code> o <code>python3 -m http.server</code> en el directorio.
      </div>

      </p>
