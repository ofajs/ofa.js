<!doctype html>
<html lang="zh-CN" class="st-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ofa.js — 把组件，写成 HTML</title>
    <meta name="description" content="ofa.js 是一个零构建、零依赖的 Web Components 前端框架。一个 HTML 文件就是一个组件，浏览器直接运行，无需 npm、Node.js 或打包器。" />
    <meta name="theme-color" content="#1a1c1e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ofa.js — 把组件，写成 HTML" />
    <meta property="og:description" content="ofa.js 是一个零构建、零依赖的 Web Components 前端框架。一个 HTML 文件就是一个组件，浏览器直接运行，无需 npm、Node.js 或打包器。" />
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script>
      // 官网为纯深色设计：首次访问锁定 senti-ui 深色主题（尊重用户已有偏好）
      try {
        if (!localStorage.getItem("st-theme-mode"))
          localStorage.setItem("st-theme-mode", "dark");
      } catch {}
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui/packages/boot/st-boot.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Roboto", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #c3c7cf;
      }
    </style>
  </head>
  <body>
    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../app.mjs">
      <template page>
<!--
  所有内容页的嵌套路由父页（layout）。
  子页通过 `export const parent = "…/layout.html"` 挂到这里，
  在 slot 中切换；header/footer 与文档左侧目录只创建一次。
-->
<link rel="stylesheet" href="../styles/site.css" />
<link rel="stylesheet" href="../styles/docs.css" />
<l-m src="../components/site-shell.html"></l-m>
<l-m src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui/packages/list/list.html"></l-m>

<style>
  :host {
    display: block;
    min-height: 100vh;
    background: var(--md-sys-color-surface, #111318);
    color-scheme: dark;
  }

  site-shell {
    display: block;
  }

  /* 子页面由 layout 的 slot 承接，避免每个 child 再撑出一个 100vh */
  ::slotted(o-page) {
    display: block !important;
    min-height: 0 !important;
    background: transparent !important;
  }
</style>

<site-shell
  attr:label-nav="site.shell.actions.nav"
  attr:label-docs="site.shell.nav.docs"
  attr:label-home="site.shell.actions.home"
  attr:label-github="site.shell.actions.github"
  attr:label-github-repo="site.shell.actions.githubRepo"
  attr:label-cta="site.shell.actions.cta"
  attr:label-menu="site.shell.actions.menu"
  attr:label-languages="site.shell.actions.languages"
  attr:variant="docsMode ? 'docs' : 'site'"
  attr:home-url="navUrls.home"
  attr:docs-url="navUrls.docs"
  attr:languages-url="navUrls.languages"
  attr:footer-tagline="site.shell.footer.tagline"
  attr:footer-resources="site.shell.footer.resources"
  attr:footer-ecosystem="site.shell.footer.ecosystem"
  attr:footer-community="site.shell.footer.community"
  attr:footer-docs="site.shell.footer.docs"
  attr:footer-plugins="site.shell.footer.plugins"
  attr:footer-note="site.shell.footer.note"
>
  <div class="docs-shell" class:no-nav="!docsMode">
    <aside class="docs-nav" attr:aria-label="site.docs.label">
      <st-list class="side-list">
        <st-list-item
          button
          class:active="current === 'index'"
          on:click="navigateDocs('index')"
        >
          <span class="side-label">{{site.docs.overview}}</span>
        </st-list-item>

        <st-list-item collapsible expanded>
          <span class="side-label">{{site.docs.nav.start.label}}</span>
          <st-list slot="sublist">
            <st-list-item
              button
              class:active="current === 'getting-started'"
              on:click="navigateDocs('getting-started')"
            >
              <span class="side-label">{{site.docs.nav.start.items.gettingStarted}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'first-component'"
              on:click="navigateDocs('first-component')"
            >
              <span class="side-label">{{site.docs.nav.start.items.firstComponent}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'first-page'"
              on:click="navigateDocs('first-page')"
            >
              <span class="side-label">{{site.docs.nav.start.items.firstPage}}</span>
            </st-list-item>
          </st-list>
        </st-list-item>

        <st-list-item collapsible expanded>
          <span class="side-label">{{site.docs.nav.basics.label}}</span>
          <st-list slot="sublist">
            <st-list-item
              button
              class:active="current === 'component'"
              on:click="navigateDocs('component')"
            >
              <span class="side-label">{{site.docs.nav.basics.items.component}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'page'"
              on:click="navigateDocs('page')"
            >
              <span class="side-label">{{site.docs.nav.basics.items.page}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'lifecycle'"
              on:click="navigateDocs('lifecycle')"
            >
              <span class="side-label">{{site.docs.nav.basics.items.lifecycle}}</span>
            </st-list-item>
          </st-list>
        </st-list-item>

        <st-list-item collapsible expanded>
          <span class="side-label">{{site.docs.nav.template.label}}</span>
          <st-list slot="sublist">
            <st-list-item
              button
              class:active="current === 'template'"
              on:click="navigateDocs('template')"
            >
              <span class="side-label">{{site.docs.nav.template.items.template}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'binding'"
              on:click="navigateDocs('binding')"
            >
              <span class="side-label">{{site.docs.nav.template.items.binding}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'events'"
              on:click="navigateDocs('events')"
            >
              <span class="side-label">{{site.docs.nav.template.items.events}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'render'"
              on:click="navigateDocs('render')"
            >
              <span class="side-label">{{site.docs.nav.template.items.render}}</span>
            </st-list-item>
          </st-list>
        </st-list-item>

        <st-list-item collapsible expanded>
          <span class="side-label">{{site.docs.nav.data.label}}</span>
          <st-list slot="sublist">
            <st-list-item
              button
              class:active="current === 'data'"
              on:click="navigateDocs('data')"
            >
              <span class="side-label">{{site.docs.nav.data.items.data}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'state'"
              on:click="navigateDocs('state')"
            >
              <span class="side-label">{{site.docs.nav.data.items.state}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'context'"
              on:click="navigateDocs('context')"
            >
              <span class="side-label">{{site.docs.nav.data.items.context}}</span>
            </st-list-item>
          </st-list>
        </st-list-item>

        <st-list-item collapsible expanded>
          <span class="side-label">{{site.docs.nav.app.label}}</span>
          <st-list slot="sublist">
            <st-list-item
              button
              class:active="current === 'app'"
              on:click="navigateDocs('app')"
            >
              <span class="side-label">{{site.docs.nav.app.items.app}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'routing'"
              on:click="navigateDocs('routing')"
            >
              <span class="side-label">{{site.docs.nav.app.items.routing}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'nested-routing'"
              on:click="navigateDocs('nested-routing')"
            >
              <span class="side-label">{{site.docs.nav.app.items.nestedRouting}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'scsr'"
              on:click="navigateDocs('scsr')"
            >
              <span class="side-label">{{site.docs.nav.app.items.scsr}}</span>
            </st-list-item>
          </st-list>
        </st-list-item>

        <st-list-item collapsible expanded>
          <span class="side-label">{{site.docs.nav.reference.label}}</span>
          <st-list slot="sublist">
            <st-list-item
              button
              class:active="current === 'api'"
              on:click="navigateDocs('api')"
            >
              <span class="side-label">{{site.docs.nav.reference.items.api}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'plugins'"
              on:click="navigateDocs('plugins')"
            >
              <span class="side-label">{{site.docs.nav.reference.items.plugins}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'pitfalls'"
              on:click="navigateDocs('pitfalls')"
            >
              <span class="side-label">{{site.docs.nav.reference.items.pitfalls}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'examples'"
              on:click="navigateDocs('examples')"
            >
              <span class="side-label">{{site.docs.nav.reference.items.examples}}</span>
            </st-list-item>
            <st-list-item
              button
              class:active="current === 'deployment'"
              on:click="navigateDocs('deployment')"
            >
              <span class="side-label">{{site.docs.nav.reference.items.deployment}}</span>
            </st-list-item>
          </st-list>
        </st-list-item>
      </st-list>
    </aside>

    <div class="docs-content">
      <slot></slot>
    </div>
  </div>
</site-shell>

<script>
  import { createLayoutPage } from "../content/page-runtime.mjs";

  export default (args) =>
    createLayoutPage({ ...args, sitePath: "./site.json" });
</script>

      </template>
    </o-app>

    <noscript>此页面需要启用 JavaScript 才能运行 ofa.js。</noscript>

    <script type="module" src="../boot.js"></script>
  </body>
</html>
