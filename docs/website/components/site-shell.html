  <div class="nav-wrap">

      <div class="nav-links" class:open="menuOpen">

          {{labelTutorial}}
        </a>
        <a class="nav-link" data-nav="docs" olink attr:href="docsUrl" on:click="closeMenu">

      </div>

      <div class="nav-actions">
        <a
          class="icon-link"
          href="https://github.com/ofajs/ofa.js"
          target="_blank"
          rel="noreferrer"
          attr:aria-label="labelGithubRepo"
        >
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14 0 1.55-.01 2.79-.01 3.17 0 .3.21.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"></path>

          <span>{{labelGithub}}</span>
        </a>
        <button
          class="nav-burger"
          class:open="menuOpen"
          type="button"
          on:click="toggleMenu"
          attr:aria-expanded="menuOpen"
          attr:aria-label="labelMenu"
        >
          <span></span>
          <span></span>

      </div>
    </nav>
  </div>

  <div class="shell-content"><slot></slot></div>

  <footer>
    <div class="footer-inner">
      <div class="f-brand">
        <span class="brand">
          <img class="brand-logo" src="../assets/logo.svg" alt="" aria-hidden="true" />
          <span class="wordmark">ofa<span>.js</span></span>
        </span>
        <p>{{footerTagline}}</p>
      </div>

      <div class="f-col">
        <h4>{{footerResources}}</h4>
        <a attr:href="docsUrl">{{footerDocs}}</a>
        <a href="https://github.com/ofajs/ofa.js" target="_blank" rel="noreferrer">GitHub</a>
        <a href="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/dist/ofa.min.mjs" target="_blank" rel="noreferrer">CDN</a>
      </div>

        <span aria-hidden="true">◎</span>{{labelLanguages}}
      </a>
      <span class="made"><i></i>{{footerNote}}</span>
    </div>
  </footer>

  <script>
    export default {
      tag: "site-shell",
      attrs: {
        labelNav: "Main navigation",
        labelHome: "Home",
        labelTutorial: "Tutorial",
        labelDocs: "Docs",
        labelGithub: "GitHub",
        labelGithubRepo: "GitHub repository",
        labelMenu: "Toggle menu",
        labelLanguages: "Languages",
        variant: "site",
        homeUrl: "./",
        tutorialUrl: "./tutorial/",
        languagesUrl: "../",
        docsUrl: "./docs/",
        footerTagline:
          "Zero-build, zero-dependency Web Components framework. Write components as HTML and give development back to the browser.",
        footerResources: "Resources",
        footerEcosystem: "Ecosystem",
        footerCommunity: "Community",
        footerDocs: "Documentation",
        footerPlugins: "Plugins",
        footerNote: "This page is built with ofa.js itself.",
      },
      data: {
        menuOpen: false,
      },
      proto: {
        toggleMenu() {
          this.menuOpen = !this.menuOpen;
        },
        closeMenu() {
          this.menuOpen = false;
        },
        syncActive() {
          const tutorialLink = this.ele.shadowRoot?.querySelector(
            '[data-nav="tutorial"]',
          );
          tutorialLink?.classList.toggle(
            "active",
            /\/tutorial(?:\/|$)/.test(location.pathname),
          );

          const docsLink = this.ele.shadowRoot?.querySelector(
            '[data-nav="docs"]',
          );
          docsLink?.classList.toggle(
            "active",
            /\/docs(?:\/|$)/.test(location.pathname),
          );
        },
      },
      attached() {
        const root = this.ele.shadowRoot;
        this._navWrap = root && root.querySelector(".nav-wrap");
        this._app = (window.$ ? window.$(this.ele) : this.ele).app;
        this._onRoute = () => {
          this.syncActive();
          this.closeMenu();
        };
        this._app?.on?.("router-change", this._onRoute);
        this.syncActive();
        this._onScroll = () => {
          this._navWrap?.classList.toggle("scrolled", window.scrollY > 8);
        };
        window.addEventListener("scroll", this._onScroll, { passive: true });
        this._onScroll();
      },
      detached() {
        this._app?.off?.("router-change", this._onRoute);
        window.removeEventListener("scroll", this._onScroll);
      },
    };
  </script>
</template>
