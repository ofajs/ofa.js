<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>o-app 与 o-page — ofa.js API</title>
    <meta name="description" content="应用容器负责页面栈和导航；页面实例负责自己的一屏内容。" />
    <meta name="theme-color" content="#1a1c1e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="o-app 与 o-page — ofa.js API" />
    <meta property="og:description" content="应用容器负责页面栈和导航；页面实例负责自己的一屏内容。" />
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <script>
      // 首次访问默认深色；可在顶部切换白天 / 黑夜 / 跟随系统（尊重已有偏好）
      try {
        if (!localStorage.getItem("st-theme-mode"))
          localStorage.setItem("st-theme-mode", "dark");
      } catch {}
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@main/packages/boot/st-boot.js"></script>
    <noscript><style>#site-loading { display: none; }</style></noscript>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Roboto", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #c3c7cf;
      }

      /* 首屏加载遮罩：网络较慢时先显示，应用就绪后由 boot.js 淡出移除 */
      #site-loading {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: var(--md-sys-color-surface, #111318);
        background-image: radial-gradient(
          circle at 50% 42%,
          color-mix(in srgb, var(--md-sys-color-primary) 10%, transparent),
          transparent 55%
        );
        color: var(--md-sys-color-on-surface, #e2e2e9);
        transition: opacity 0.22s ease;
      }

      #site-loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .site-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(260px, 70vw);
      }

      .site-loading-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--md-sys-color-on-surface, #e2e2e9);
        line-height: 1;
      }

      .site-loading-logo {
        display: block;
        width: auto;
        height: 30px;
        flex: none;
      }

      .site-loading-wordmark {
        color: var(--md-sys-color-on-surface, #f3f5fa);
        font-family:
          "Space Grotesk", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .site-loading-wordmark span {
        color: var(--md-sys-color-on-surface-variant, #8f9bb3);
        font-weight: 450;
      }

      .site-loading-bar {
        width: 100%;
        height: 4px;
        border-radius: 99px;
        background: linear-gradient(
          90deg,
          var(--md-sys-color-surface-container-high, #252d3d) 0%,
          var(--md-sys-color-surface-container-high, #252d3d) 34%,
          var(--md-sys-color-primary, #7c9cff) 50%,
          color-mix(in srgb, var(--md-sys-color-primary) 45%, white) 56%,
          var(--md-sys-color-surface-container-high, #252d3d) 72%,
          var(--md-sys-color-surface-container-high, #252d3d) 100%
        );
        background-size: 220% 100%;
        box-shadow: 0 0 14px color-mix(in srgb, var(--md-sys-color-primary) 25%, transparent);
        animation: site-loading-bar 1.1s linear infinite;
      }

      .site-loading-label {
        color: var(--md-sys-color-on-surface-variant, #8f9bb3);
        font-family:
          "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        font-size: 12.5px;
        font-weight: 400;
        letter-spacing: 0.03em;
      }

      @keyframes site-loading-bar {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -100% 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .site-loading-bar {
          animation-duration: 2s;
        }
      }
    </style>
  </head>
  <body>
    <div id="site-loading" role="status" aria-live="polite">
      <div class="site-loading-inner">
        <div class="site-loading-brand" aria-hidden="true">
          <img class="site-loading-logo" src="../../assets/logo.svg" width="28" height="30" alt="" />
          <span class="site-loading-wordmark">ofa<span>.js</span></span>
        </div>
        <div class="site-loading-bar" aria-hidden="true"></div>
        <div class="site-loading-label">正在加载页面…</div>
      </div>
    </div>

    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../../app.mjs">
      <template page>

  <link rel="stylesheet" href="../../styles/site.css" />
  <link rel="stylesheet" href="../../styles/docs.css" />
  <l-m src="../../components/docs-layout.html"></l-m>

  <docs-layout layout="wide" attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc doc-wide">
      <p class="doc-kicker">API · o-app 与 o-page</p>
      <h1>o-app 与 o-page</h1>
      <p class="doc-lead">应用容器负责页面栈和导航；页面实例负责自己的一屏内容。</p>

<l-m src="../../components/playground.html"></l-m>
      <docs-playground example="app"></docs-playground>

      <h2>o-app 实例</h2>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead><tr><th>成员</th><th>说明</th></tr></thead>
        <tbody>
          <tr><td><code>app.src</code></td><td>应用配置模块地址</td></tr>
          <tr><td><code>app.current</code></td><td>当前页面实例（只读）</td></tr>
          <tr><td><code>app.routers</code></td><td>历史路由数组，可读也可写</td></tr>
          <tr><td><code>app.goto(src)</code></td><td>跳转并入栈</td></tr>
          <tr><td><code>app.replace(src)</code></td><td>替换当前页，不入栈</td></tr>
          <tr><td><code>app.back(delta = 1)</code></td><td>后退</td></tr>
          <tr><td><code>app.forward(delta = 1)</code></td><td>前进（需配置 allowForward）</td></tr>
          <tr><td><code>app.appIsReady</code></td><td>首个页面渲染完成（只读）</td></tr>
          <tr><td><code>app._module</code></td><td>应用配置：home、loading、fail、access、allowForward、pageAnime</td></tr>
        </tbody>
      </table>
        </div>
      <h2>o-page 实例</h2>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead><tr><th>成员</th><th>说明</th></tr></thead>
        <tbody>
          <tr><td><code>page.src</code></td><td>页面模块地址，初始化后不可修改</td></tr>
          <tr><td><code>page.pageIsReady</code></td><td>页面渲染完成标志（只读）</td></tr>
          <tr><td><code>page.goto(src) / page.replace(src)</code></td><td>相对当前页面解析地址后跳转</td></tr>
          <tr><td><code>page.back()</code></td><td>后退</td></tr>
          <tr><td><code>page.pageAnime</code></td><td>本页动画配置，读写均可</td></tr>
          <tr><td><code>page._rendered</code></td><td>页面渲染完成的 Promise</td></tr>
        </tbody>
      </table>
        </div>

      <p class="doc-end">
        <a olink href="./index.html">← 返回 API 总览</a>
      </p>
    </article>
  </docs-layout>

  <script>
    import { createDocsPage } from "../../content/page-runtime.mjs";

    export const parent = "../layout.html";

    export default (args) =>
      createDocsPage({ ...args, sitePath: "../site.json" });
  </script>

      </template>
    </o-app>

    <noscript>此页面需要启用 JavaScript 才能运行 ofa.js。</noscript>

    <script type="module" src="../../boot.js"></script>
  </body>
</html>
