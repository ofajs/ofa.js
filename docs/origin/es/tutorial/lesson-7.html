      <h1>Renderizado condicional</h1>
      <p class="doc-lead">o-if / o-else-if / o-else controlan si el contenido está presente.</p>

      <p>
  Para mostrar contenido distinto según el estado, usa <code>&lt;o-if :value="condition"&gt;</code>.
  Cuando la condición es falsa el contenido se elimina; cuando es verdadera el contenido se
  vuelve a crear.
</p>
<l-m src="{{SITE}}/components/playground.html"></l-m>
      <docs-playground lesson="lesson-7" fold-styles="true"></docs-playground>
<h2>Las tres etiquetas deben ser consecutivas</h2>
<ul>
  <li><code>o-if</code> debe llevar un <code>:value</code>;</li>
  <li><code>o-else-if</code> evalúa la siguiente condición;</li>
  <li><code>o-else</code> no lleva <code>:value</code> y actúa como último recurso.</li>
</ul>
<div class="doc-note">
  <strong>Usa class para alternar con frecuencia:</strong> si solo estás cambiando un color
  o mostrando/ocultando algo, prefiere <code>class:</code> para conservar el DOM;
  <code>o-if</code> destruye y vuelve a crear el contenido, así que encaja en condiciones que
  rara vez cambian o en casos en los que de verdad hay que liberar recursos.
</div>
