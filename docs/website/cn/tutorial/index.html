<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ofa.js 教程</title>
    <meta name="description" content="从引用 script 开始，学习 ofa.js 的组件、页面与模板渲染。" />
    <meta name="theme-color" content="#06070d" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ofa.js 教程" />
    <meta property="og:description" content="从引用 script 开始，学习 ofa.js 的组件、页面与模板渲染。" />
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #06070d;
        color: #eef2fb;
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #9aa6bd;
      }
    </style>
  </head>
  <body>
    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../../app.mjs">
      <template page>

  <link rel="stylesheet" href="../../styles/site.css" />
  <link rel="stylesheet" href="../../styles/tutorial.css" />
  <l-m src="../../components/site-shell.html"></l-m>
  <l-m src="../../components/tutorial-layout.html"></l-m>

  <site-shell
    attr:label-nav="site.shell.actions.nav"
    attr:label-tutorial="site.shell.nav.tutorial"
    attr:label-docs="site.shell.nav.docs"
    attr:label-home="site.shell.actions.home"
    attr:label-github="site.shell.actions.github"
    attr:label-github-repo="site.shell.actions.githubRepo"
    attr:label-cta="site.shell.actions.cta"
    attr:label-menu="site.shell.actions.menu"
    attr:label-languages="site.shell.actions.languages"
    attr:home-url="navUrls.home"
    attr:tutorial-url="navUrls.tutorial"
    attr:languages-url="navUrls.languages"
    attr:docs-url="site.urls.docs"
    attr:footer-tagline="site.shell.footer.tagline"
    attr:footer-resources="site.shell.footer.resources"
    attr:footer-ecosystem="site.shell.footer.ecosystem"
    attr:footer-community="site.shell.footer.community"
    attr:footer-docs="site.shell.footer.docs"
    attr:footer-plugins="site.shell.footer.plugins"
    attr:footer-note="site.shell.footer.note"
  >
    <tutorial-layout
      current="index"
      attr:label-tutorial="site.tutorial.label"
      attr:label-back-home="site.tutorial.backHome"
      attr:title-usage="site.tutorial.articles.usage"
      attr:title-template="site.tutorial.articles.template"
      attr:home-url="navUrls.home"
      attr:usage-url="navUrls.usage"
      attr:template-url="navUrls.template"
    >
      <article class="doc tutorial-intro">
        <p class="doc-kicker">Tutorial</p>
        <h1>ofa.js 教程</h1>
        <p class="doc-lead">
          两篇文章，从一行 script 引用开始，走到组件、页面与模板渲染。
          不需要 npm、Node.js 或打包器，写 HTML 就能运行。
        </p>

        <div class="tutorial-cards">
          <a class="tutorial-card" olink href="./usage.html">
            <span class="num">01</span>
            <h2>如何使用 ofa.js（引用 script）</h2>
            <p>通过 CDN 引入框架，写第一个页面模块，并在浏览器里跑起来。</p>
            <span class="more">开始阅读 →</span>
          </a>

          <a class="tutorial-card" olink href="./template.html">
            <span class="num">02</span>
            <h2>使用模板渲染</h2>
            <p>文本插值、事件、双向绑定、条件、列表，以及一个完整待办示例。</p>
            <span class="more">开始阅读 →</span>
          </a>
        </div>

        <div class="doc-note">
          <strong>先读哪篇？</strong>
          如果还没有跑起来过 ofa.js，从第一篇开始；已经能加载页面，可以直接看模板语法。
        </div>

        <p class="doc-end">
          官方完整文档：<a href="https://ofajs.com/cn/index.html" target="_blank" rel="noreferrer">ofajs.com</a>
        </p>
      </article>
    </tutorial-layout>
  </site-shell>

  <script>
    import { createTutorialPage } from "../../content/page-runtime.mjs";

    export default (args) =>
      createTutorialPage({ ...args, sitePath: "../site.json" });
  </script>

      </template>
    </o-app>

    <noscript>此页面需要启用 JavaScript 才能运行 ofa.js。</noscript>

    <script type="module" src="../../boot.js"></script>
  </body>
</html>
