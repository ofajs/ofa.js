      <h1>Data and interpolation</h1>
      <p class="doc-lead">data can hold strings, numbers, booleans, objects, and arrays, and {{ }} can evaluate simple expressions.</p>

      <p>
  <code>data</code> is a plain object, but ofa.js turns it into reactive data.
  Inside the template, <code>{{ }}</code> can do more than read fields: it can evaluate
  expressions and reach nested properties.
</p>
<l-m src="../../components/playground.html"></l-m>
      <docs-playground lesson="lesson-2" fold-styles="true"></docs-playground>
<h2>Rules</h2>
<ul>
  <li><code>{{user.name}}</code>: access a nested field of an object;</li>
  <li><code>{{user.age + 1}}</code>: the contents of {{ }} are JavaScript expressions;</li>
  <li><code>:html="note"</code>: renders a string as HTML; use it only for trusted content.</li>
</ul>
<div class="doc-note">
  <strong>Remember:</strong> <code>{{ }}</code> works only in an element's text content.
  For attribute values use <code>attr:</code> / <code>:prop</code> from the next lesson; writing
  <code>&lt;a href="{{url}}"&gt;</code> has no effect.
</div>
<h2>Try it yourself</h2>
<p>
  Add a <code>city</code> field to <code>user</code> and display it as
  "City: xxx"; then try changing <code>note</code> to plain text and observe the
  difference between <code>:html</code> and <code>{{ }}</code>.
</p>
