<template page>
  <link rel="stylesheet" href="{{SITE}}/styles/site.css" />
  <link rel="stylesheet" href="{{SITE}}/styles/docs.css" />
  <l-m src="{{SITE}}/components/docs-layout.html"></l-m>

  <docs-layout attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc">
      <p class="doc-kicker">リファレンス</p>
      <h1>$.fn とラッパーオブジェクト</h1>
      <p class="doc-lead">
        <code>$</code> はセレクタであり、要素のファクトリーでもあります。返り値は
        ofa.js のラッパーオブジェクトで、フレームワークの機能の大半を備えています。
        ブラウザネイティブの機能には <code>.ele</code> からアクセスします。
      </p>

      <h2>要素の取得</h2>
      <pre><code>$("#target");                       // 最初に一致した要素
$("#target").$("h3");               // 子要素
$("my-component").shadow.$("#x");   // Shadow DOM 内を検索
$.all("li");                        // 一致するすべてのラッパーインスタンスの配列

$(document.createElement("div"));   // ネイティブ要素 → ラッパーオブジェクト
$(`&lt;div&gt;new&lt;/div&gt;`);               // HTML 文字列 → ラッパーオブジェクト
$({ tag: "div", text: "hi" });      // オブジェクト記述 → ラッパーオブジェクト</code></pre>

      <h2>ラッパーオブジェクトとネイティブ要素</h2>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead>
          <tr><th>ケース</th><th>構文</th></tr>
        </thead>
        <tbody>
          <tr><td>ofa.js のプロパティ / メソッド</td><td><code>el.src</code>、<code>el.text</code>、<code>el.on()</code>、<code>el.app</code></td></tr>
          <tr><td>ブラウザネイティブのプロパティ</td><td><code>el.ele.scrollTop</code>、<code>el.ele.shadowRoot</code></td></tr>
          <tr><td>コンポーネントの data フィールド</td><td><code>el.count</code>（フィールドに直接アクセス）</td></tr>
          <tr><td>dataset</td><td><code>el.data.role</code></td></tr>
          <tr><td>Shadow 内のクエリ</td><td><code>this.shadow.$("#id")</code></td></tr>
        </tbody>
      </table>
        </div>
      <p>
        目安：ofa.js のプロパティはそのまま使い、ブラウザネイティブのものは
        <code>.ele</code> 経由でアクセスします。
      </p>

      <h2>ツリーのナビゲーション</h2>
      <pre><code>el.prev;      el.prevs;
el.next;      el.nexts;
el.siblings;
el.parent;    el.parents;
el.host;      // ホストコンポーネントのインスタンス
el.app;       // 所属する o-app
el.root;      // document のインスタンス
el.shadow;    // shadow root のインスタンス
el.tag;       // 小文字化したタグ名
el.index;     // 親の中での位置
el.PATH;      // コンポーネント登録ファイルのパス
el.is("li");  // セレクタに一致するか</code></pre>

      <h2>子要素の追加と削除</h2>
      <pre><code>$("ul").push("&lt;li&gt;new&lt;/li&gt;");
$("ul").unshift("&lt;li&gt;first&lt;/li&gt;");
$("ul").pop();
$("ul").shift();
$("ul").splice(1, 2, "&lt;li&gt;replacement&lt;/li&gt;");

el.before("&lt;p&gt;before&lt;/p&gt;");
el.after("&lt;p&gt;after&lt;/p&gt;");
el.remove();
el.wrap("&lt;div class='wrapper'&gt;&lt;/div&gt;");
el.unwrap();</code></pre>

      <h2>コンテンツと属性</h2>
      <pre><code>el.text = "new text";
el.html = "&lt;b&gt;hi&lt;/b&gt;";

el.attr("data-id");          // 属性を読み取る
el.attr("data-id", "42");    // 属性を書き込む

el.css.color = "red";
el.css = { color: "blue", lineHeight: "1.5" };
el.css = { ...el.css, color: "red" };

el.classList.add("active");
el.classList.remove("done");
el.data.role = "admin";
el.refresh();                // 非リアクティブな描画を手動で更新</code></pre>
      <p>
        テンプレートで対応する記法は <code>:text</code>、<code>:html</code>、
        <code>attr:data-id</code>、<code>:style.color</code>、
        <code>class:active</code> です。
      </p>

      <h2>イベント</h2>
      <pre><code>el.on("click", handler);
el.one("load", init);
el.off("click", handler);

el.emit("save", {
  data: { id: 1 },
  bubbles: true,
  composed: true,
});</code></pre>

      <h2>o-app と o-page</h2>
      <pre><code>const app = $("o-app");
app.src;
app.current;
app.routers;
app.goto("./page.html");
app.replace("./page.html");
app.back();
app.forward();

const page = app.current;
page.src;
page.goto("./next.html");
page.pageIsReady;</code></pre>

      <h2>stanz の機能</h2>
      <pre><code>const tid = target.watch(() =&gt; {
  // 深い監視
});
target.watchTick(() =&gt; {}); // 間引きされた監視
target.unwatch(tid);

const data = $.stanz({ count: 0 });
data._internal = "not watched"; // アンダースコア接頭辞はリアクティブ化をスキップする</code></pre>
      <p>
        データの条件が満たされるまで待つには <code>watchUntil</code> を使います。
        条件が満たされると解決する Promise を返し、監視は自動的に解除されます：
      </p>
      <pre><code>const app = $("o-app");
await app.watchUntil(() =&gt; app.appIsReady);

// 既定のタイムアウトは 30 秒。第 2 引数で変更できる
await app.watchUntil(() =&gt; app.current, 5000);</code></pre>
      <div class="doc-note">
        <strong>watchUntil はデータの変更時にのみ評価され、登録時には即座にチェックしません。</strong>
        条件がすでに満たされている可能性がある場合は、待つかどうかを決める前に
        自分で 1 回確認してください。
      </div>

      <h2>インスタンスの拡張</h2>
      <pre><code>// 単一のインスタンス
el.extend({
  say() {
    return "hello";
  },
});

// すべてのインスタンス
$.fn.extend({
  get good() {
    return "ofa.js is good";
  },
});

// 新しいディレクティブ: :red="count % 3 === 0"
$.fn.extend({
  set red(value) {
    this.css.color = value ? "red" : "";
  },
});</code></pre>

      <h2>formData プラグイン</h2>
      <p>
        <code>formData()</code> はフレームワークの標準ビルドには含まれません。先に
        <code>packages/plugins/formdata/formdata.mjs</code>（または dist の
        スクリプト）をインポートしてから呼び出します：
      </p>
      <pre><code>const data = this.shadow.formData();
data.username = "Yao";
console.log(data.username);
data.revoke(); // バインディングを解除</code></pre>

      </p>
    </article>
