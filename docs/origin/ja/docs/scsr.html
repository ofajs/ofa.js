<template page>
  <link rel="stylesheet" href="{{SITE}}/styles/site.css" />
  <link rel="stylesheet" href="{{SITE}}/styles/docs.css" />
  <l-m src="{{SITE}}/components/docs-layout.html"></l-m>

  <docs-layout attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc">
      <p class="doc-kicker">アプリケーション</p>
      <h1>scsr による実パスルーティング</h1>
      <p class="doc-lead">
        scsr はすべての URL を、直接開ける実際の HTML ドキュメントにします。
        サイト内のナビゲーションは引き続きアプリのルーティングを経由しますが、
        リロード、共有、クローラーには完全なコンテンツが届きます。
      </p>

      <h2>o-router との違い</h2>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead>
          <tr><th>機能</th><th>o-router</th><th>scsr</th></tr>
        </thead>
        <tbody>
          <tr><td>URL の形式</td><td><code>#/pages/a.html</code></td><td><code>/pages/a.html</code></td></tr>
          <tr><td>サーバー側のリライト</td><td>不要</td><td>パスごとに 1 つの HTML</td></tr>
          <tr><td>SEO / JS なしでの表示</td><td>弱い</td><td>完全なファーストスクリーン HTML</td></tr>
          <tr><td>ページ API</td><td colspan="2">共通: goto / replace / back / ネストしたレイアウト / アニメーション</td></tr>
        </tbody>
      </table>
        </div>

      <h2>ページ構造</h2>
      <p>
        各 URL は完全な HTML ドキュメントに対応し、ページの内容は <code>o-app</code>
        の <code>&lt;template page&gt;</code> 内にインラインで記述されます:
      </p>
      <pre><code>&lt;!doctype html&gt;
&lt;html lang="en"&gt;
  &lt;head&gt;
    &lt;meta charset="UTF-8" /&gt;
    &lt;title&gt;ホーム&lt;/title&gt;
    &lt;script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@5/dist/ofa.min.mjs"
    &gt;&lt;/script&gt;
    &lt;script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@5/packages/scsr/dist/scsr.min.mjs"
    &gt;&lt;/script&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;o-app src="./app-config.js"&gt;
      &lt;template page&gt;
        &lt;h1&gt;ホームの内容&lt;/h1&gt;
        &lt;a olink href="./detail.html"&gt;詳細へ移動&lt;/a&gt;
      &lt;/template&gt;
    &lt;/o-app&gt;
  &lt;/body&gt;
&lt;/html&gt;</code></pre>

      <h2>アプリ設定では home を宣言しない</h2>
      <pre><code>// app-config.js
export const pageAnime = {
  current: { opacity: 1 },
  next: { opacity: 0 },
  previous: { opacity: 0 },
};</code></pre>
      <p>
        scsr は現在の URL をページとして採用し、ホームページはその URL にある HTML
        になるため、設定で <code>home</code> を指定しないでください。サイト内は
        <code>olink</code> または <code>goto()</code> で移動し、アドレスには実パスを
        使います。
      </p>

      <h2>サーバーの要件</h2>
      <ul>
        <li>すべてのパスが対応する HTML を <code>Content-Type: text/html; charset=UTF-8</code> で返すこと。</li>
        <li>ページ内の <code>&lt;template page&gt;</code> には、サーバーでレンダリングされた静的コンテンツを含められます。</li>
        <li>CSS、JS、画像は通常の静的アセットとして配信されます。</li>
        <li>scsr はページ既存のグローバル <code>$</code> にアタッチするため、ofa.js の後に読み込む必要があります。</li>
      </ul>

      <h2>フォールバックとファーストスクリーン</h2>
      <p>
        JS がない場合でも、ページはサーバーが生成した完全な HTML のままです。
        動作しないのはインタラクティブなロジックだけです。JS がある場合、scsr が
        引き継いで現在の URL をアプリ内ページに変換し、以降のナビゲーションでは
        ページ全体のリロードが不要になります。
      </p>

      <h2>選ぶべき場面</h2>
      <ul>
        <li>SEO と共有可能なリンクが必要なサイト（マーケティングサイト、ドキュメント、ブログなど）。</li>
        <li>すべてのページが独自の URL と独自のメタ情報を持つ。</li>
        <li>パスごとに HTML を出力できるサーバーテンプレートや SSG がすでにある。</li>
      </ul>
      <p>
        検索エンジンのインデックスが不要な純粋な内部アプリには、o-router の方が
        シンプルです。
      </p>

      <p class="doc-end">
        前: <a olink href="./nested-routing.html">ネストしたルーティング →</a>
         · 次: <a olink href="./api.html">$.fn とラップされたオブジェクト →</a>
      </p>
    </article>
  </docs-layout>

  <script>
    import { createDocsPage } from "{{SITE}}/content/page-runtime.mjs";

    export const parent = "{{LOCALE}}/layout.html";

    export default (args) =>
      createDocsPage({ ...args, sitePath: "{{LOCALE}}/site.json" });
  </script>
</template>
