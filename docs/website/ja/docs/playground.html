<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ライブプレイグラウンド — ofa.js ドキュメント</title>
    <meta name="description" content="NoneOS Core の仮想コンテナ上で ofa.js のページモジュールをオンラインで編集・実行します。" />
    <meta name="theme-color" content="#1a1c1e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ライブプレイグラウンド — ofa.js ドキュメント" />
    <meta property="og:description" content="NoneOS Core の仮想コンテナ上で ofa.js のページモジュールをオンラインで編集・実行します。" />
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="../../styles/loading.css"
      media="print"
      onload="this.media='all'"
    />
    <script>
      // 首次访问默认深色；可在顶部切换白天 / 黑夜 / 跟随系统（尊重已有偏好）
      try {
        if (!localStorage.getItem("st-theme-mode"))
          localStorage.setItem("st-theme-mode", "dark");
      } catch {}
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@main/packages/boot/st-boot.js"></script>
    <noscript><style>#site-loading { display: none; }</style></noscript>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Roboto", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #c3c7cf;
      }

      /* 首屏 critical：只保定位/尺寸/遮罩，装饰样式在 styles/loading.css */
      #site-loading {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        transition: opacity 0.22s ease;
      }

      #site-loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .site-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(260px, 70vw);
      }

      .site-loading-logo {
        display: block;
        width: auto;
        height: 30px;
      }

    </style>
  </head>
  <body>
    <div id="site-loading" role="status" aria-live="polite">
      <div class="site-loading-inner">
        <div class="site-loading-brand" aria-hidden="true">
          <img class="site-loading-logo" src="../../assets/logo.svg" width="28" height="30" alt="" />
          <span class="site-loading-wordmark">ofa<span>.js</span></span>
        </div>
        <div class="site-loading-bar" aria-hidden="true"></div>
        <div class="site-loading-label">
          <span class="site-loading-label-zh">正在加载页面…</span>
          <span class="site-loading-label-tcn">正在載入頁面…</span>
          <span class="site-loading-label-ja">ページを読み込み中…</span>
          <span class="site-loading-label-es">Cargando página…</span>
          <span class="site-loading-label-en">Loading page…</span>
        </div>
      </div>
    </div>

    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../../app.mjs">
      <template page>

  <link rel="stylesheet" href="../../styles/site.css" />
  <link rel="stylesheet" href="../../styles/docs.css" />
  <l-m src="../../components/docs-layout.html"></l-m>

  <docs-layout layout="wide" attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc doc-wide">
      <p class="doc-kicker">リファレンス</p>
      <h1>ライブサンプル</h1>
      <p class="doc-lead">
        このページは NoneOS Core を使ってブラウザ内に仮想ファイルシステムを
        マウントします。左側で ofa.js のページモジュールを編集し、右側の仮想
        コンテナで実行できます — バックエンドは不要です。
      </p>

      <l-m src="../../components/playground.html"></l-m>
      <docs-playground></docs-playground>

      <h2>仕組み</h2>
      <ol>
        <li>初回オープン時に NoneOS Core の <code>sw.js</code> を登録します。</li>
        <li>ページはブラウザの OPFS を直接開き、Service Worker が
          <code>/$ofa-docs-playground/...</code> を仮想ファイルシステムに
          マッピングします。</li>
        <li>エディタはページモジュールを仮想ファイル
          <code>page.html</code> に書き込み、固定の <code>index.html</code>
          エントリを生成します。</li>
        <li>右側の iframe が仮想コンテナ内の
          <code>/$ofa-docs-playground/index.html</code> を開き、ofa.js が
          ページをレンダリングします。</li>
      </ol>

      <div class="doc-note">
        <strong>デプロイ要件:</strong>
        Service Worker はサイトルートのパス <code>/sw.js</code> に登録されるため、
        この機能はドキュメントをドメインルートにデプロイする（または
        <code>npm run server:website</code> で <code>docs/website</code> をルートに
        ローカルプレビューする）必要があります。サブディレクトリでは、Service
        Worker は <code>/$</code> パスを引き継げません。
      </div>

      <h2>変更できるもの</h2>
      <ul>
        <li>テンプレート、スタイル、<code>data</code>、<code>proto</code> メソッドを編集し、「コードを実行」をクリックするとすぐに反映されます。</li>
        <li><code>&lt;l-m&gt;</code> で CDN 上の他の ofa.js コンポーネントを参照できます。</li>
        <li>コードはブラウザの <code>localStorage</code> に保存され、リフレッシュしても残ります。</li>
        <li>エディタをクリアして新しいページモジュールを書けば、ゼロから試せます。</li>
      </ul>

      <p class="doc-end">
        前: <a olink href="./examples.html">完全なサンプル →</a>
         · 次: <a olink href="./deployment.html">デプロイ →</a>
      </p>
    </article>
  </docs-layout>

  <script>
    import { createDocsPage } from "../../content/page-runtime.mjs";

    export const parent = "../layout.html";

    export default (args) =>
      createDocsPage({ ...args, sitePath: "../site.json" });
  </script>

      </template>
    </o-app>

    <noscript>このページで ofa.js を実行するには JavaScript が必要です。</noscript>

    <script type="module" src="../../boot.js"></script>
  </body>
</html>
