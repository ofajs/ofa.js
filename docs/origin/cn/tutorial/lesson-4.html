      <p class="doc-kicker">Tutorial · 04</p>
      <h1>样式与 class</h1>
      <p class="doc-lead">页面里的 &lt;style&gt; 只作用于当前页面，class: 和 :style 让样式跟随数据变化。</p>

      <p>
  页面模板里的 <code>&lt;style&gt;</code> 会被收进页面的 Shadow DOM，
  不会污染其他组件。<code>:host</code> 选中页面/组件本身。
</p>
<l-m src="{{SITE}}/components/playground.html"></l-m>
      <docs-playground lesson="lesson-4"></docs-playground>
<h2>三种常用写法</h2>
<ul>
  <li><code>:host</code>：设置页面容器的样式，例如 <code>display:block</code>；</li>
  <li><code>class:active="active"</code>：条件为真时加类名，为假时移除；</li>
  <li><code>:style.background="..."</code>：内联样式，属性名用驼峰写法。</li>
</ul>
<div class="doc-note">
  <strong>选择建议：</strong>结构性状态（选中、完成）用 <code>class:</code>，
  颜色、尺寸等单个值用 <code>:style</code>。不要在模板里拼大段
  <code>style</code> 字符串。
</div>
<h2>动手改</h2>
<p>
  再加一个 <code>class:highlight="active"</code> 的类名，并在
  <code>&lt;style&gt;</code> 里给它一个背景色，观察切换状态时的变化。
</p>
