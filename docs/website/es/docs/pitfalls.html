      <h1>Errores comunes y solución de problemas</h1>
      <p class="doc-lead">
        Páginas que no se renderizan, que se renderizan solo a medias o que ignoran los
        cambios de código: la mayoría de los problemas se remontan a un puñado de causas
        fijas. Identifica primero el mensaje de error y después revisa las expresiones de
        la plantilla.
      </p>

      <h2>ReferenceError: la plantilla hace referencia a una clave no declarada</h2>
      <p>
        Cada expresión de una plantilla se evalúa durante la inicialización, así que
        cualquier clave a la que haga referencia debe declararse antes en <code>data</code>
        o en <code>attrs</code>. Una clave no declarada lanza un error de inmediato y
        aborta el renderizado de toda la página:
      </p>
      <pre><code>Error evaluating element expression: ':value="flag"'
Caused by: ReferenceError: flag is not defined</code></pre>
      <p>
        Solución: añade el campo a data con un valor predeterminado seguro, por ejemplo
        <code>data: { flag: false }</code>.
      </p>

      <h2>TypeError: un getter depende de datos que aún no han llegado</h2>
      <p>
        Los getters de propiedades computadas se ejecutan en cuanto se inicializa la
        plantilla, antes de <code>ready</code>. Si un getter accede a un campo profundo de
        datos asíncronos, puede lanzar un <code>TypeError</code> y romper toda la página.
      </p>
      <pre><code>// Incorrecto: user todavía es un objeto vacío
get roleText() {
  return ROLE_TEXT[this.user.role];
}</code></pre>
      <p>
        Cambia a un campo de datos y asígnalo en la función de retorno asíncrona:
      </p>
      <pre><code>data: { user: null, roleText: "" },
proto: {
  async loadUser() {
    const user = await fetchUser();
    this.user = user;
    this.roleText = ROLE_TEXT[user.role] || "";
  },
},
ready() {
  this.loadUser();
},</code></pre>

      <h2>SyntaxError: un literal suelto en el valor de una directiva</h2>
      <p>
        Los valores de <code>attr:</code>, <code>:prop</code>, <code>sync:</code> y
        <code>class:</code> se interpretan todos como expresiones de JavaScript:
      </p>
      <pre><code>&lt;!-- Incorrecto --&gt;
&lt;button attr:data-type="in"&gt;
&lt;button attr:title="Click to choose"&gt;
&lt;button attr:title="Choose one"&gt;

&lt;!-- Correcto --&gt;
&lt;button title="Click to choose"&gt;
&lt;button attr:title="'Click to choose'"&gt;
&lt;button attr:title="locked ? 'Locked' : ''"&gt;</code></pre>
      <p>
        Síntomas derivados: el HTML de la plantilla ya está en el Shadow DOM, pero
        <code>ready</code> nunca se ejecuta, <code>o-fill</code> nunca se expande y los
        datos permanecen vacíos. Cuando veas esta combinación, busca primero texto suelto
        en los valores de las directivas.
      </p>

      <h2>Colisiones con nombres reservados</h2>
      <p>
        <code>data</code> y <code>proto</code> no deben usar miembros integrados de
        página/aplicación: <code>back</code>, <code>goto</code>, <code>replace</code>,
        <code>src</code>, <code>pageAnime</code>, <code>pageIsReady</code>, ni métodos
        comunes como <code>on</code>, <code>off</code>, <code>emit</code>,
        <code>$</code>, <code>text</code>, <code>html</code>, <code>css</code>,
        <code>data</code>, etc. Una colisión provoca que el registro falle o que toda la
        página dé error.
      </p>

      <h2>$host / $data solo existen dentro de o-fill</h2>
      <pre><code>&lt;!-- Incorrecto: no hay $host en el nivel raíz --&gt;
&lt;button on:click="$host.openHelp()"&gt;?&lt;/button&gt;

&lt;!-- Correcto: llama directamente al nombre del método en el nivel raíz --&gt;
&lt;button on:click="openHelp()"&gt;?&lt;/button&gt;</code></pre>
      <p>
        Hacer referencia a <code>$host</code> desde un <code>o-if</code> de nivel superior
        puede fallar en silencio; hacer referencia a <code>$host</code> desde un
        <code>attr:</code> de nivel superior puede no dar error pero nunca establece nada.
        En el nivel raíz, usa siempre campos de datos y métodos de proto.
      </p>

      <h2>Usa attr: para los atributos booleanos</h2>
      <pre><code>&lt;!-- Incorrecto: aún renderiza disabled="false" cuando es false --&gt;
&lt;button :disabled="loading"&gt;Submit&lt;/button&gt;

&lt;!-- Correcto --&gt;
&lt;button attr:disabled="loading"&gt;Submit&lt;/button&gt;</code></pre>

      <h2>No uses {{ }} dentro de los valores de atributos</h2>
      <pre><code>&lt;!-- Incorrecto --&gt;
&lt;a href="{{url}}"&gt;Link&lt;/a&gt;

&lt;!-- Correcto --&gt;
&lt;a attr:href="url"&gt;Link&lt;/a&gt;</code></pre>

      <h2>El src de o-page es inmutable</h2>
      <pre><code>&lt;!-- lanza un error en tiempo de ejecución --&gt;
&lt;o-page :src="'./form.html?id=' + editingId"&gt;&lt;/o-page&gt;</code></pre>
      <p>
        Mantén el o-page montado y pasa parámetros mediante métodos de la página hija;
        cuando necesites reconstruirlo, envuélvelo en <code>o-if</code> para que se
        destruya y se vuelva a crear.
      </p>

      <h2>Formato del enrutamiento hash</h2>
      <pre><code>// Incorrecto
location.origin + location.pathname + "#./pages/set.html"

// Correcto
location.origin + "/#/pages/set.html"</code></pre>

      <h2>Los cambios no surten efecto: revisa primero la caché</h2>
      <p>
        ofa.js almacena en caché los módulos de página cargados, y el servidor estático
        también puede almacenar en caché el HTML. Si después de editar un archivo la
        navegación por hash sigue mostrando el contenido antiguo y la consola no informa de
        errores:
      </p>
      <ul>
        <li>Haz que el servidor de desarrollo desactive la caché HTTP (p. ej. <code>http-server -c-1</code>);</li>
        <li>Recarga la página completa con una URL completa que lleve una nueva consulta;</li>
        <li>En las pruebas automatizadas, carga la página entera con <code>page.goto(url)</code> en lugar de depender de la navegación por hash.</li>
      </ul>

      <h2>Objetos wrapper y .ele</h2>
      <pre><code>// Incorrecto
$("o-app").current.shadowRoot

// Correcto
$("o-app").current.ele.shadowRoot.querySelector(".item")
$("o-app").current.src</code></pre>
