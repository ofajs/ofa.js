      <h1>完全なサンプル</h1>
      <p class="doc-lead">
        最小のページからルーティングアプリまで、4 つの完全なサンプルです。ファイルとして
        保存し、静的サーバーから配信すると実行できます。
      </p>

      <h2>サンプル 1：最小のページ</h2>
      <p><strong>index.html</strong></p>
      <pre><code>&lt;!doctype html&gt;
&lt;html lang="en"&gt;
  &lt;head&gt;
    &lt;meta charset="UTF-8" /&gt;
    &lt;title&gt;ofa.js の最小アプリ&lt;/title&gt;
    &lt;script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@5/dist/ofa.min.mjs"
    &gt;&lt;/script&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;o-page src="./page.html"&gt;&lt;/o-page&gt;
  &lt;/body&gt;
&lt;/html&gt;</code></pre>

      <p><strong>page.html</strong></p>
      <pre><code>&lt;template page&gt;
  &lt;style&gt;
    :host { display: block; padding: 20px; font-family: sans-serif; }
    button { padding: 6px 16px; cursor: pointer; }
  &lt;/style&gt;

  &lt;h1&gt;{{title}}&lt;/h1&gt;
  &lt;p&gt;カウント: {{count}}、2 倍: {{doubleCount}}&lt;/p&gt;
  &lt;button on:click="count++"&gt;+1&lt;/button&gt;
  &lt;button on:click="reset"&gt;リセット&lt;/button&gt;

  &lt;script&gt;
    export default async () =&gt; ({
      data: { title: "こんにちは ofa.js", count: 0 },
      proto: {
        get doubleCount() {
          return this.count * 2;
        },
        reset() {
          this.count = 0;
        },
      },
    });
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <h2>サンプル 2：カスタムコンポーネント</h2>
      <p><strong>my-counter.html</strong></p>
      <pre><code>&lt;template component&gt;
  &lt;style&gt;
    :host {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid #4caf50;
      border-radius: 8px;
    }
  &lt;/style&gt;

  &lt;span&gt;&lt;slot&gt;&lt;/slot&gt;&lt;/span&gt;
  &lt;strong&gt;{{currentValue}}&lt;/strong&gt;
  &lt;button on:click="increment"&gt;+&lt;/button&gt;
  &lt;button on:click="decrement"&gt;-&lt;/button&gt;

  &lt;script&gt;
    export default {
      tag: "my-counter",
      attrs: { initialValue: 0 },
      data: { currentValue: 0 },
      watch: {
        initialValue(value) {
          this.currentValue = value;
        },
      },
      ready() {
        this.currentValue = this.initialValue;
      },
      proto: {
        increment() {
          this.currentValue += 1;
          this.emit("change", { data: { value: this.currentValue } });
        },
        decrement() {
          this.currentValue -= 1;
          this.emit("change", { data: { value: this.currentValue } });
        },
      },
    };
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <p><strong>コンポーネントの使用</strong></p>
      <pre><code>&lt;template page&gt;
  &lt;l-m src="./my-counter.html"&gt;&lt;/l-m&gt;

  &lt;my-counter :initial-value="5" on:change="onChange"&gt;
    現在のカウント
  &lt;/my-counter&gt;
  &lt;p&gt;{{log}}&lt;/p&gt;

  &lt;script&gt;
    export default async () =&gt; ({
      data: { log: "" },
      proto: {
        onChange(event) {
          this.log = "change -> " + event.data.value;
        },
      },
    });
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <h2>サンプル 3：TODO リスト</h2>
      <pre><code>&lt;template page&gt;
  &lt;style&gt;
    :host { display: block; padding: 20px; }
    .done { text-decoration: line-through; opacity: 0.6; }
    li { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
  &lt;/style&gt;

  &lt;h2&gt;TODO（{{todos.length}}）&lt;/h2&gt;

  &lt;input
    sync:value="draft"
    on:keydown="addOnEnter($event)"
    placeholder="TODO を入力して Enter キーを押してください"
  /&gt;

  &lt;ul&gt;
    &lt;o-fill :value="todos" fill-key="id"&gt;
      &lt;li class:done="$data.done"&gt;
        &lt;input type="checkbox" sync:checked="$data.done" /&gt;
        &lt;span&gt;{{$data.text}}&lt;/span&gt;
        &lt;button on:click="$host.remove($data.id)"&gt;×&lt;/button&gt;
      &lt;/li&gt;
    &lt;/o-fill&gt;
  &lt;/ul&gt;

  &lt;script&gt;
    let uid = 1;

    export default async () =&gt; ({
      data: {
        draft: "",
        todos: [{ id: 1, text: "ofa.js を学ぶ", done: false }],
      },
      proto: {
        addOnEnter(event) {
          if (event.key !== "Enter") return;
          const text = this.draft.trim();
          if (!text) return;
          this.todos.push({ id: ++uid, text, done: false });
          this.draft = "";
        },
        remove(id) {
          const index = this.todos.findIndex((item) =&gt; item.id === id);
          if (index &gt; -1) this.todos.splice(index, 1);
        },
      },
    });
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <h2>サンプル 4：ルーティングアプリ</h2>
