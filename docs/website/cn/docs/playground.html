    <noscript><style>#site-loading { display: none; }</style></noscript>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;

        color: var(--md-sys-color-on-surface, #e2e2e9);

      }
      body {
        font-family:
          "Roboto", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      o-app,
      o-page {

        inset: 0;

        display: grid;

      #site-loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .site-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(260px, 70vw);
      }

      .site-loading-logo {
        display: block;
        width: auto;

    <div id="site-loading" role="status" aria-live="polite">
      <div class="site-loading-inner">
        <div class="site-loading-brand" aria-hidden="true">
          <img class="site-loading-logo" src="../../assets/logo.svg" width="28" height="30" alt="" />
          <span class="site-loading-wordmark">ofa<span>.js</span></span>
        </div>
        <div class="site-loading-bar" aria-hidden="true"></div>
        <div class="site-loading-label">
          <span class="site-loading-label-zh">正在加载页面…</span>
          <span class="site-loading-label-tcn">正在載入頁面…</span>
          <span class="site-loading-label-ja">ページを読み込み中…</span>
          <span class="site-loading-label-en">Loading page…</span>
        </div>

    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../../app.mjs">
      <template page>

  <link rel="stylesheet" href="../../styles/site.css" />
  <link rel="stylesheet" href="../../styles/docs.css" />
  <l-m src="../../components/docs-layout.html"></l-m>

  <docs-layout layout="wide" attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc doc-wide">
      <p class="doc-kicker">Reference</p>
      <h1>案例预览</h1>
      <p class="doc-lead">
        这里用 NoneOS Core 在浏览器里挂载一个虚拟文件系统。
        左侧编辑 ofa.js 页面模块，右侧在虚拟容器中运行，不需要后端。
      </p>

      <l-m src="../../components/playground.html"></l-m>
      <docs-playground></docs-playground>

      <h2>它是怎么运行的</h2>
      <ol>
        <li>首次打开时注册 NoneOS Core 的 <code>sw.js</code>；</li>
        <li>页面直接打开浏览器 OPFS，Service Worker 把
          <code>/$ofa-docs-playground/...</code> 映射到虚拟文件系统；</li>
        <li>编辑器把页面模块写入虚拟文件 <code>page.html</code>，并生成一个
          固定的 <code>index.html</code> 入口；</li>
        <li>右侧 iframe 直接访问虚拟容器里的
          <code>/$ofa-docs-playground/index.html</code>，由 ofa.js 渲染页面。</li>
      </ol>

      <div class="doc-note">
        <strong>部署要求：</strong>
        Service Worker 注册在站点根路径 <code>/sw.js</code>，因此该功能要求
        docs 部署在域名根路径（或本地用
        <code>npm run server:website</code> 以 <code>docs/website</code>
        为根目录预览）。放在子目录下时 Service Worker 无法接管
        <code>/$</code> 路径。
      </div>

      <h2>可以改什么</h2>
      <ul>
        <li>修改模板、样式、<code>data</code> 和 <code>proto</code> 方法，点「运行代码」立即生效；</li>
        <li>用 <code>&lt;l-m&gt;</code> 引用 CDN 上的其他 ofa.js 组件；</li>
        <li>代码会保存在浏览器 <code>localStorage</code>，刷新后仍保留；</li>
        <li>清空编辑器后重新写入页面模块，即可从空白开始实验。</li>
      </ul>

      <p class="doc-end">
        上一篇：<a olink href="./examples.html">完整示例 →</a>
        　·　下一篇：<a olink href="./deployment.html">部署 →</a>
      </p>
    </article>
  </docs-layout>

  <script>
    import { createDocsPage } from "../../content/page-runtime.mjs";

    export const parent = "../layout.html";

    export default (args) =>
      createDocsPage({ ...args, sitePath: "../site.json" });
  </script>

      </template>
    </o-app>

    <noscript>此页面需要启用 JavaScript 才能运行 ofa.js。</noscript>

    <script type="module" src="../../boot.js"></script>
  </body>
