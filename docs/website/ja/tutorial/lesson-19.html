      <h1>非同期と読み込み状態</h1>
      <p class="doc-lead">loading / error / success の3つの非同期状態で UI を駆動します。非同期の結果を getter に入れないでください。</p>

      <p>
  ページの初期化では API の応答を待つことがよくあります。非同期ロジックを getter に包まず、
  <code>loading</code>、<code>error</code>、<code>user</code> といった明示的な状態フィールドを使い、それらで UI を駆動します。
</p>
<l-m src="../../components/playground.html"></l-m>
      <docs-playground lesson="lesson-19" fold-styles="true"></docs-playground>
<h2>推奨フロー</h2>
<ol>
  <li>リクエストを開始: <code>status = "loading"</code> とし、前回のエラーをクリアします。</li>
  <li>成功時: 結果をデータに書き込み、<code>status = "done"</code> とします。</li>
  <li>失敗時: エラーメッセージを <code>error</code> に書き込み、<code>status = "error"</code> とします。</li>
</ol>
<p>
  UI は <code>o-if</code> / <code>o-else-if</code> / <code>o-else</code>
  を使って、それぞれ読み込み中、エラー、コンテンツを表示します。
</p>
<div class="doc-note">
  <strong>明示的な状態が重要な理由:</strong> 単一の <code>user</code> では
  「まだ開始していない」「読み込み中」「読み込み失敗」を区別できません。状態フィールドがあれば各ケースに
  明確な UI を割り当てられ、ボタンの無効化や再試行といったインタラクションも簡単に追加できます。
</div>
<h2>自分で試してみよう</h2>
<p>
  リクエストに 600ms の遅延を付け（例にはすでにあります）、読み込み中は「再読み込み」ボタンを無効にしてください。
  次に、失敗メッセージをクリックして再試行できるようにしてみましょう。
</p>
