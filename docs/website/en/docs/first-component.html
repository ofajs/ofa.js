      <p class="doc-kicker">Getting started</p>
      <h1>Your First Component</h1>
      <p class="doc-lead">
        An <code>.html</code> file is a component. The browser loads it directly—
        no compilation, and no registration in a bundling entry point.
      </p>

      <h2>1. The Component File</h2>
      <p>
        Create <code>my-counter.html</code>. A component module uses
        <code>&lt;template component&gt;</code> and declares its tag name with
        <code>tag</code>:
      </p>
      <pre><code>&lt;template component&gt;
  &lt;style&gt;
    :host {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
    }
  &lt;/style&gt;

  &lt;span&gt;&lt;slot&gt;&lt;/slot&gt;&lt;/span&gt;
  &lt;strong&gt;{{count}}&lt;/strong&gt;
  &lt;button on:click="decrease"&gt;-&lt;/button&gt;
  &lt;button on:click="increase"&gt;+&lt;/button&gt;

  &lt;script&gt;
    export default {
      tag: "my-counter",
      attrs: {
        initial: 0,
      },
      data: {
        count: 0,
      },
      watch: {
        initial(value) {
          this.count = value;
        },
      },
      ready() {
        this.count = this.initial;
      },
      proto: {
        increase() {
          this.count += 1;
          this.emit("change", { data: { value: this.count } });
        },
        decrease() {
          this.count -= 1;
          this.emit("change", { data: { value: this.count } });
        },
      },
    };
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <div class="doc-note">
        <strong>script must be inside template.</strong>
        ofa.js only extracts scripts inside <code>template[component]</code> or
        <code>template[page]</code>; scripts outside the template are ignored.
      </div>

      <h2>2. Use It in a Page</h2>
      <p>
        Import the component file with <code>&lt;l-m&gt;</code>, then use it like a regular HTML tag.
        The tag name must match <code>tag</code>:
      </p>
      <pre><code>&lt;template page&gt;
  &lt;l-m src="./my-counter.html"&gt;&lt;/l-m&gt;

  &lt;my-counter initial="5" on:change="onCountChange"&gt;
    Current count
  &lt;/my-counter&gt;

  &lt;p&gt;Last change: {{lastChange}}&lt;/p&gt;

  &lt;script&gt;
    export default async () =&gt; ({
      data: { lastChange: "No change yet" },
      proto: {
        onCountChange(event) {
          this.lastChange = event.data.value;
        },
      },
    });
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <h2>3. Three Things to Keep Apart</h2>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead>
          <tr><th>Where</th><th>Purpose</th><th>Example</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><code>tag</code></td>
            <td>The component's HTML tag name; required</td>
            <td><code>tag: "my-counter"</code></td>
          </tr>
          <tr>
            <td><code>attrs</code></td>
            <td>Scalar attributes passed in from outside</td>
            <td><code>initial="5"</code></td>
          </tr>
          <tr>
            <td><code>data</code></td>
            <td>Reactive state internal to the component</td>
            <td><code>count: 0</code></td>
          </tr>
        </tbody>
      </table>
        </div>
      <p>
        The keys of <code>attrs</code> and <code>data</code> must not overlap. Put complex data
        such as arrays and objects in <code>data</code> and pass it in with <code>:prop</code>;
        <code>attrs</code> holds only scalars such as strings and numbers.
      </p>

      <h2>4. Slots and Events</h2>
      <p>
        A <code>&lt;slot&gt;</code> inside the component receives the content that consumers
        write between the component's tags. The <code>&lt;slot&gt;&lt;/slot&gt;</code> above
        renders "Current count".
      </p>
      <p>
        Components emit events outward with <code>this.emit("change", { data })</code>;
        consumers listen with <code>on:change</code> and read the payload from
        <code>event.data</code>. Events bubble by default but do not cross the Shadow DOM
        boundary; add <code>composed: true</code> when they need to.
      </p>
