      <h1>Component Parameters</h1>
      <p class="doc-lead">External data reaches the component through attrs; the component keeps its own state in data.</p>

      <p>
  Attributes a component receives from outside are declared in <code>attrs</code> with default values;
  state that changes inside the component lives in <code>data</code>. The two must not share names.
</p>
<l-m src="{{SITE}}/components/playground.html"></l-m>
      <docs-playground lesson="lesson-13" fold-styles="true"></docs-playground>
<h2>attrs vs data</h2>
<ul>
  <li><code>attrs</code>: scalar values passed in from outside (name, role, starting level);
    they are reflected to HTML attributes;</li>
  <li><code>data</code>: the component's own reactive state; outside code does not modify it directly;</li>
  <li>in the example, <code>startLevel</code> is a string, and the component converts it to a number with
    <code>Number()</code>.</li>
</ul>
<div class="doc-note">
  <strong>Don't modify attrs directly:</strong> a child component treats <code>attrs</code> as read-only input.
  If you need derived state, copy it into <code>data</code>. That keeps the source of the data clear and
  prevents parent and child from overwriting each other.
</div>
<h2>Try it yourself</h2>
<p>
  Add a <code>level</code> data field and an input to the page, then pass it to the second component
  dynamically with <code>attr:start-level="level"</code>.
</p>
