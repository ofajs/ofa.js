<!doctype html>
<html lang="zh-CN" class="st-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ofa.js 文档</title>
    <meta name="description" content="从引用 script 开始，学习 ofa.js 的组件、页面与模板渲染。" />
    <meta name="theme-color" content="#1a1c1e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ofa.js 文档" />
    <meta property="og:description" content="从引用 script 开始，学习 ofa.js 的组件、页面与模板渲染。" />
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <script>
      // 官网为纯深色设计：首次访问锁定 senti-ui 深色主题（尊重用户已有偏好）
      try {
        if (!localStorage.getItem("st-theme-mode"))
          localStorage.setItem("st-theme-mode", "dark");
      } catch {}
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui/packages/boot/st-boot.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Roboto", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #c3c7cf;
      }
    </style>
  </head>
  <body>
    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../../app.mjs">
      <template page>

  <link rel="stylesheet" href="../../styles/site.css" />
  <link rel="stylesheet" href="../../styles/docs.css" />
  <l-m src="../../components/docs-layout.html"></l-m>

    <docs-layout attr:label-on-this-page="site.docs.onThisPage">
      <article class="doc docs-intro">
        <p class="doc-kicker">Documentation</p>
        <h1>ofa.js 文档</h1>
        <p class="doc-lead">
          两篇文章，从一行 script 引用开始，走到组件、页面与模板渲染。
          不需要 npm、Node.js 或打包器，写 HTML 就能运行。
        </p>

        <div class="docs-list">
          <a class="docs-row" olink href="./usage.html">
            <span class="num">01</span>
            <h2>如何使用 ofa.js（引用 script）</h2>
            <p>通过 CDN 引入框架，写第一个页面模块，并在浏览器里跑起来。</p>
            <span class="more">开始阅读 →</span>
          </a>

          <a class="docs-row" olink href="./template.html">
            <span class="num">02</span>
            <h2>使用模板渲染</h2>
            <p>文本插值、事件、双向绑定、条件、列表，以及一个完整待办示例。</p>
            <span class="more">开始阅读 →</span>
          </a>
        </div>

        <div class="doc-note">
          <strong>先读哪篇？</strong>
          如果还没有跑起来过 ofa.js，从第一篇开始；已经能加载页面，可以直接看模板语法。
        </div>
      </article>
    </docs-layout>

  <script>
    import { createDocsPage } from "../../content/page-runtime.mjs";

    export const parent = "../layout.html";

    export default (args) =>
      createDocsPage({ ...args, sitePath: "../site.json" });
  </script>

      </template>
    </o-app>

    <noscript>此页面需要启用 JavaScript 才能运行 ofa.js。</noscript>

    <script type="module" src="../../boot.js"></script>
  </body>
</html>
