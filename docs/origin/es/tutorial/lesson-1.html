      <p class="doc-kicker">Tutorial · 01</p>
      <h1>Tu primera página</h1>
      <p class="doc-lead">En ofa.js, una página es solo un archivo HTML: la estructura, los estilos y la lógica viven en un mismo archivo.</p>

      <p>
  Un módulo de página se declara con <code>&lt;template page&gt;</code>. Escribe el contenido que quieres mostrar
  en la plantilla, coloca los datos en <code>data</code> y usa <code>{{ }}</code> para insertar datos en el texto.
</p>
<h2>Cambia una línea, ejecútala una vez</h2>
<p>
  Cambia <code>name</code> en el editor por tu propio nombre y pulsa <kbd>Ctrl</kbd>+<kbd>S</kbd>
  (<kbd>⌘</kbd>+<kbd>S</kbd> en Mac) o haz clic en «Ejecutar código» y observa cómo se actualiza la vista previa de la derecha.
</p>
<l-m src="{{SITE}}/components/playground.html"></l-m>
      <docs-playground lesson="lesson-1" fold-styles="true"></docs-playground>
<h2>Las tres cosas que acabas de escribir</h2>
<ul>
  <li><code>&lt;template page&gt;</code>: declara que esto es un módulo de página;</li>
  <li><code>data</code>: los datos reactivos de la página; si los cambias, la página se actualiza;</li>
  <li><code>{{name}}</code>: inserta un valor de data en el texto.</li>
</ul>
<div class="doc-note">
  <strong>Error común:</strong> el <code>&lt;script&gt;</code> debe escribirse dentro de
  <code>&lt;template page&gt;</code>; cada campo que se use en la plantilla debe declararse primero en
  <code>data</code>; de lo contrario, toda la página lanza un <code>ReferenceError</code>.
</div>
<h2>Pruébalo</h2>
<p>
  Añade un campo <code>city</code> a <code>data</code> y muéstralo en la página con
  <code>{{city}}</code>.
</p>
