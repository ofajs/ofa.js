<!doctype html>
<html lang="{{LANG}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="theme-color" content="#06070d" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <link rel="icon" type="image/svg+xml" href="{{SITE}}/assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #06070d;
        color: #eef2fb;
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont,
          "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #9aa6bd;
      }
    </style>
  </head>
  <body>
    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="{{SITE}}/app.mjs">
      <template page>
{{PAGE_CONTENT}}
      </template>
    </o-app>

    <noscript>{{NOSCRIPT}}</noscript>

    <script type="module" src="{{SITE}}/boot.js"></script>
  </body>
</html>
