      #site-loading {

        opacity: 0;
        pointer-events: none;
      }

      .site-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(260px, 70vw);
      }

      .site-loading-logo {
        display: block;
        width: auto;
        height: 30px;

          <h2>为下一代的 Web，<br />减掉所有多余。</h2>
          <p>
            不需要 npm、Node.js、webpack，也不需要理解一整套新的编译规则。

          <article class="card card-split span-4" data-reveal>
            <div class="card-copy">

          <h2>三步，从零到第一个页面。</h2>
          <p>不用安装，不用配置文件。打开编辑器，写一个 HTML 文件就够了。</p>
        </div>
  
        <div class="steps">
          <article class="step" data-reveal>
            <span class="step-no">STEP 01</span>
            <h3>引入 ofa.js</h3>
            <p>复制 v5 的 mjs 地址即可使用，没有依赖，没有构建。</p>
            <st-code
              frame
              lang="html"
              title="index.html"
              style="--st-code-radius: var(--md-sys-shape-corner-lg);"
            >
              <textarea hidden>
<script
  type="module"
  src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@5/dist/ofa.min.mjs"
></script>
              </textarea>
            </st-code>
          </article>
  
          <article class="step" data-reveal style="--d: 70ms">
            <span class="step-no">STEP 02</span>
            <h3>写一个页面</h3>
            <p>模板、样式、逻辑写在同一个文件里，保存即可运行。</p>
            <st-code
              frame
              lang="html"
              title="index.html"
              style="--st-code-radius: var(--md-sys-shape-corner-lg);"
              :code="codePage"
            ></st-code>
          </article>
