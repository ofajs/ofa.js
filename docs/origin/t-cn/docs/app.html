      <p class="doc-kicker">Application</p>
      <h1>o-app 應用</h1>
      <p class="doc-lead">
        <code>o-app</code> 是微應用容器。它加載一份應用配置模塊，管理頁面棧、
        頁面切換動畫和導航事件，但本身不直接加載頁面 HTML。
      </p>

      <h2>最小應用</h2>
      <pre><code>&lt;!doctype html&gt;
&lt;html lang="zh-CN"&gt;
  &lt;head&gt;
    &lt;meta charset="UTF-8" /&gt;
    &lt;script
      type="module"
      src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@5/dist/ofa.min.mjs"
    &gt;&lt;/script&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;o-app src="./app-config.js"&gt;&lt;/o-app&gt;
  &lt;/body&gt;
&lt;/html&gt;</code></pre>

      <pre><code>// app-config.js
export const home = "./pages/home.html";</code></pre>
      <p>
        <code>o-app</code> 的 <code>src</code> 必須是應用配置模塊，
        不能直接指向頁面。單個頁面需要獨立運行時，用
        <code>&lt;o-page src="./page.html"&gt;</code>。
      </p>

      <h2>應用配置</h2>
      <pre><code>export const home = "./pages/home.html";

export const pageAnime = {
  current: { opacity: 1, transform: "translate(0, 0)" },
  next: { opacity: 0, transform: "translate(30px, 0)" },
  previous: { opacity: 0, transform: "translate(-30px, 0)" },
};

export const loading = () =&gt; "&lt;div class='loading'&gt;加載中...&lt;/div&gt;";

export const fail = ({ src, error }) =&gt;
  `&lt;div class='error'&gt;加載失敗：${src}&lt;/div&gt;`;

export const allowForward = true;

// 跨域頁面訪問控制：返回 true 放行，false 或 Error 則拒絕
export const access = (src) =&gt; src.startsWith("https://cdn.example.com/");

export const proto = {
  goHome() {
    this.goto("home.html");
  },
  get isHome() {
    return this.current?.src.includes("home.html");
  },
};

export const ready = function () {
  console.log("應用已就緒", this.current);
};</code></pre>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead>
          <tr><th>導出</th><th>說明</th></tr>
        </thead>
        <tbody>
          <tr><td><code>home</code></td><td>啟動後加載的首頁地址</td></tr>
          <tr><td><code>pageAnime</code></td><td>頁面切換三態動畫：current / next / previous</td></tr>
          <tr><td><code>loading</code></td><td>頁面加載中顯示的 HTML</td></tr>
          <tr><td><code>fail</code></td><td>加載失敗時顯示的 HTML，接收 <code>{ src, error }</code></td></tr>
          <tr><td><code>allowForward</code></td><td>是否允許 <code>forward()</code>，默認關閉</td></tr>
          <tr><td><code>access</code></td><td>跨域頁面訪問控制，返回 true 放行；同源頁面不需要</td></tr>
          <tr><td><code>proto</code></td><td>擴展 o-app 實例的方法和 getter</td></tr>
          <tr><td><code>ready</code></td><td>配置加載完成後的回調，<code>this</code> 為應用實例</td></tr>
        </tbody>
      </table>
        </div>

      <p>
        <code>access</code> 接收頁面 <code>src</code>，返回
        <code>true</code> 才允許加載跨域頁面；返回 <code>false</code> 或
        <code>Error</code> 會被拒絕。目標站點仍需正確配置 CORS，
        否則瀏覽器會先攔截請求。
      </p>

      <h2>應用實例</h2>
      <pre><code>const app = $("o-app");

app.current;   // 當前頁面實例
app.appIsReady; // 首個頁面渲染完成（可用 watchUntil 等待）
app.routers;   // 路由棧，父級佈局頁不會進入棧
app.goto("./pages/detail.html?id=1");
app.replace("./pages/detail.html");
app.back();
app.forward(); // 需要 allowForward: true</code></pre>
      <p>
        頁面模塊內也可以直接用 <code>this.goto</code>、
        <code>this.replace</code>、<code>this.back</code>，
        <code>this.app</code> 指向所在應用。
      </p>

      <h2>監聽路由變化</h2>
      <pre><code>const app = $("o-app");

app.on("router-change", (event) =&gt; {
  console.log(event.data.name); // goto / replace / back / forward
  console.log(event.data.src);  // 目標頁面地址
});</code></pre>

      <h2>頁面動畫</h2>
      <p>
        <code>pageAnime.current</code> 是頁面穩定後的狀態，
        <code>next</code> 是新頁面入場起點，<code>previous</code>
        是舊頁面離場終點。三個狀態都可以省略，省略時使用默認值。
      </p>
      <pre><code>export const pageAnime = {
  current: { opacity: 1, transform: "translateX(0)" },
  next: { opacity: 0, transform: "translateX(40px)" },
  previous: { opacity: 0, transform: "translateX(-40px)" },
};</code></pre>
