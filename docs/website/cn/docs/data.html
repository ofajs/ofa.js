      <h1>数据与侦听</h1>
      <p class="doc-lead">
        <code>data</code> 是组件和页面的响应式状态。它由 stanz 驱动，
        对象和数组的深层变化都会自动触发视图更新。
      </p>

      <h2>data 是对象，不是函数</h2>
      <pre><code>export default async () =&gt; ({
  data: {
    count: 0,
    user: { name: "张三", tags: [] },
    todos: [],
  },
});</code></pre>
      <p>
        每个组件实例拥有独立的 data。嵌套对象赋值、数组
        <code>push</code>/<code>splice</code>/<code>sort</code> 都会触发更新：
      </p>
      <pre><code>this.user.name = "李四";
this.user.tags.push("admin");
this.todos.splice(index, 1);
this.todos = this.todos.filter((item) =&gt; !item.done);</code></pre>

      <h2>计算属性</h2>
      <p>用 <code>proto</code> 的 getter，不要使用 Vue 风格的 computed：</p>
      <pre><code>data: { count: 0, firstName: "", lastName: "" },
proto: {
  get double() {
    return this.count * 2;
  },
  get fullName() {
    return `${this.firstName} ${this.lastName}`;
  },
  set fullName(value) {
    [this.firstName, this.lastName] = value.split(" ");
  },
},</code></pre>
      <p>模板里当普通字段使用：<code>{{double}}</code>、<code>{{fullName}}</code>。</p>
      <div class="doc-note">
        <strong>getter 会在模板初始化时立即求值，早于 ready。</strong>
        只适合依赖同步初始值的简单计算。依赖异步数据的计算不要放 getter，
        改用 data 字段并在异步回调中赋值，否则可能出现
        <code>TypeError</code> 并中断整页渲染。
      </div>

      <h2>侦听器</h2>
      <pre><code>data: {
  count: 0,
  width: 0,
  height: 0,
  area: 0,
},
watch: {
  count(value, { watchers }) {
    if (!watchers) return; // 初始化时的首次调用
    console.log("count 变为", value);
  },
  "width,height"() {
    this.area = this.width * this.height;
  },
  user() {
    // 对象/数组会深度侦听
    console.log("user 发生变化");
  },
},</code></pre>
      <p>
        回调的第二个参数是 <code>{ watchers }</code>，表示本次防抖周期内
        合并的变更集合。<code>watchers[0]</code> 上有
        <code>name</code>、<code>oldValue</code>、<code>value</code>、
        <code>type</code>、<code>target</code>、<code>args</code>。
      </p>
      <p>
        watch 函数在组件初始化完成时会先执行一次，此时
        <code>watchers</code> 为空，用于建立监听。如果初始化阶段不需要执行
        业务逻辑，先判断 <code>if (!watchers) return;</code>。
      </p>

      <h2>避免回写死循环</h2>
      <pre><code>// 错误：监听 count，又在回调里改 count
watch: {
  count(value) {
    this.count = value + 1;
  },
},</code></pre>
      <p>
        需要派生值时用计算属性，或增加一个明确的触发条件，
        不要在 watch 里无条件回写被监听的数据。
      </p>

      <h2>watch 与异步数据</h2>
      <pre><code>data: { userId: 0, profile: null },
watch: {
  async userId(id) {
    if (!id) return;
    this.profile = await fetchProfile(id);
  },
},</code></pre>
      <p>
        watch 回调可以是 async 函数。并发请求时注意记录请求序号或使用
        <code>AbortController</code>，避免旧请求覆盖新结果。
      </p>
