      <p class="doc-kicker">Tutorial · 03</p>
      <h1>動態屬性</h1>
      <p class="doc-lead">HTML attribute 用 attr:，DOM 屬性用 :prop；布爾屬性必須用 attr:。</p>

      <p>
  模板裡的屬性分兩類：<code>attr:</code> 綁定 HTML attribute，
  <code>:prop</code> 綁定元素上的 DOM 屬性。動態值不要寫成
  <code>href="{{url}}"</code>。
</p>
<l-m src="{{SITE}}/components/playground.html"></l-m>
      <docs-playground lesson="lesson-3" fold-styles="true"></docs-playground>
<h2>為什麼區分兩種寫法</h2>
<ul>
  <li><code>attr:href</code>、<code>attr:title</code>：最終寫進 HTML attribute；</li>
  <li><code>:value</code>：寫 DOM 的 <code>value</code> 屬性，適合表單元素；</li>
  <li><code>attr:disabled="!ready"</code>：布爾屬性用 <code>attr:</code>，
    條件為 false 時屬性會被真正移除。</li>
</ul>
<div class="doc-note">
  <strong>為什麼布爾屬性不能用 :prop：</strong><code>:disabled="false"</code>
  會留下 <code>disabled="false"</code>，屬性仍然存在，按鈕依舊禁用。
  正確寫法是 <code>attr:disabled="false"</code>。
</div>
<h2>動手改</h2>
<p>
  把 <code>ready</code> 的初始值改成 <code>true</code>，觀察按鈕一開始就是可用的；
  再改回來，點一下按鈕讓它變成可用。
</p>
