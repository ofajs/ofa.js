    /* ---------------- 导航 ---------------- */

      background: transparent;

    }

    /* ---------------- 按钮 ---------------- */

      border-radius: 12px;

        box-shadow 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .btn .icon {
      width: 16px;
      height: 16px;
      transition: transform 0.2s ease;
    }

    .btn:hover .icon {
      transform: translateX(2px);
    }

    .btn-primary {
      background: linear-gradient(120deg, #7c5cff, #5b52ff 58%, #0891b2);

      box-shadow:
        0 14px 34px rgba(91, 82, 255, 0.32),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow:
        0 20px 44px rgba(91, 82, 255, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .btn-ghost {
      border-color: var(--line-2);
      background: rgba(255, 255, 255, 0.035);
      color: #dfe6f5;
    }

    .btn-ghost:hover {
      border-color: rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.075);
      transform: translateY(-2px);
    }

    .btn-small {
      height: 34px;
      padding: 0 14px;
      border-radius: 9px;
      font-size: 12px;
    }

    .btn-small .icon {
      width: 13px;
      height: 13px;
    }

    .btn:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    /* ---------------- Hero ---------------- */

    .hero {
      position: relative;
      overflow: hidden;
      padding: 88px 24px 104px;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: -240px;
      left: 50%;
      width: 900px;
      height: 620px;
      transform: translateX(-50%);
      background: radial-gradient(
        ellipse,
        rgba(124, 92, 255, 0.18),
        transparent 65%
      );
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      display: grid;
      grid-template-columns: 1.02fr 0.98fr;
      align-items: center;
      gap: 64px;
      max-width: var(--max);
      margin: 0 auto;
    }

    .hero-copy {

    .eyebrow {

    }

    @keyframes ping {

      }

      100% {
        transform: scale(1.9);

      }

    .tk-str {

    }

    .tk-num {
      color: #fdba74;
    }

    .tk-brace {
      color: #fde68a;
    }

    .tk-selector {
      color: #5eead4;
    }

    .window-status {

      box-shadow: 0 0 10px var(--teal);

      border-radius: 99px;

      backdrop-filter: blur(8px);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      color: #aab6cc;
      text-transform: uppercase;
    }

    .float-label i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 8px var(--teal);
    }

    /* ---------------- 跑马灯 ---------------- */

    .ticker {
      position: relative;
      z-index: 1;
      overflow: hidden;
      padding: 15px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.012);
      -webkit-mask-image: linear-gradient(
        90deg,
        transparent,
        #000 10%,
        #000 90%,
        transparent
      );
      mask-image: linear-gradient(
        90deg,
        transparent,
        #000 10%,
        #000 90%,
        transparent
      );
    }

    .ticker-track {
      display: flex;
      align-items: center;
      gap: 36px;
      width: max-content;
      animation: marquee 40s linear infinite;
    }

    .ticker span {
      font-size: 11.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #78849d;
      white-space: nowrap;
    }

    .ticker i {
      width: 4px;
      height: 4px;
      flex: none;
      border-radius: 50%;
      background: #3d4861;
    }

    @keyframes marquee {
      to {
        transform: translateX(-50%);
      }
    }

    /* ---------------- 通用 section ---------------- */

    .section {
      position: relative;
      z-index: 1;
      max-width: var(--max);
      margin: 0 auto;
      padding: 104px 24px;
    }

    .section[id] {
      scroll-margin-top: 84px;
    }

    .section-head {
      max-width: 760px;
      margin-bottom: 48px;
    }

    .section-head.center {
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 16px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8b97b0;
    }

      content: "";
      width: 18px;
      height: 1px;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
    }

    .section-head.center .kicker::after {
      content: "";
      width: 18px;
      height: 1px;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
    }

    .section h2 {

      line-height: 1.12;
      letter-spacing: -0.035em;
    }

      font-size: 15.5px;
      line-height: 1.8;
      color: var(--muted);
    }

    .section-head.center p {
      margin: 0 auto;
    }

    .muted {
      color: var(--muted);
    }

    /* ---------------- Bento ---------------- */

    .bento {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.045),
        rgba(255, 255, 255, 0.012)
      );
      transition:
        transform 0.3s ease,
        border-color 0.3s ease,
        background 0.3s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(167, 139, 250, 0.55),
        rgba(34, 211, 238, 0.4),
        transparent
      );
      opacity: 0.4;
      transition: opacity 0.3s ease;
    }

    .card:hover {
      border-color: var(--line-2);
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.06),
        rgba(255, 255, 255, 0.018)
      );
      transform: translateY(-3px);
    }

    .card:hover::before {
      opacity: 1;
    }

    .span-4 {
      grid-column: span 4;
    }

    .span-2 {
      grid-column: span 2;
    }

    .span-6 {
      grid-column: span 6;
    }

    .card h3 {

      font-weight: 650;

    .icon-chip {

      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);

        rgba(124, 92, 255, 0.24),
        rgba(34, 211, 238, 0.08)

      color: #c4b5fd;
    }

    .icon-chip.cyan {
      background: linear-gradient(

        rgba(34, 211, 238, 0.2),

    }

    .icon-chip.amber {
      background: linear-gradient(
        145deg,
        rgba(251, 191, 36, 0.18),
        rgba(249, 115, 22, 0.06)

      color: #fde68a;
    }

    .icon-chip .icon {
      width: 19px;
      height: 19px;
    }

    .card-split {
      display: grid;
      grid-template-columns: 1.02fr 0.98fr;
      align-items: center;
      gap: 24px;
    }

    .card-copy {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
    }

    .file-flow {

      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .file-pill,
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      font-family: var(--mono);
      font-size: 10.5px;
      color: #b9c4da;
    }

    .file-pill .icon {
      width: 12px;
      height: 12px;
      color: #7dd3fc;
    }

    .tag-pill {
      border-color: rgba(45, 212, 191, 0.26);
      background: rgba(45, 212, 191, 0.07);
      color: #5eead4;
    }

    .flow-arrow {
      color: #4a556e;
    }

    .mini-window {
      display: flex;
      flex-direction: column;
      align-self: stretch;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(4, 7, 14, 0.72);
    }

    .mini-top {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 30px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      font-size: 9px;
      color: #6d7a93;
    }

    .mini-top span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2a3144;
    }

    .mini-top em {
      margin-left: 6px;
      font-family: var(--mono);
      font-style: normal;
    }

    .mini-code {
      flex: 1;
      margin: 0;
      padding: 12px 14px;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.8;
      color: #b9c4da;
    }

    .mini-code code {
      font-family: inherit;
    }

    .card-counter demo-counter {
      margin-top: auto;
      padding-top: 18px;
    }

    .zero-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: auto;
      padding-top: 22px;
    }

    .zero-pills span {
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 10px;
      color: #7c88a1;
      text-decoration: line-through;
      text-decoration-color: rgba(248, 113, 113, 0.65);
    }

    .routes {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: auto;
      padding-top: 22px;
    }

    .route {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.028);
      font-family: var(--mono);
      font-size: 9.5px;
      color: #93a1ba;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .route .dot {
      width: 5px;
      height: 5px;
      flex: none;
      border-radius: 50%;
      background: #4f46e5;
    }

    .route.active {
      border-color: rgba(34, 211, 238, 0.3);
      background: rgba(34, 211, 238, 0.06);
      color: #c9f7ff;
    }

    .route.active .dot {
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }

    .bundle {
      margin-top: auto;
      padding-top: 20px;
    }

    .bundle-num {
      font-size: 44px;
      font-weight: 760;
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(120deg, #ffffff, #a5f3fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .bundle-num small {
      margin-left: 4px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #7c8aa5;
      -webkit-text-fill-color: #7c8aa5;
    }

    .bar {
      height: 5px;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.07);
    }

    .bar i {
      display: block;
      width: 34%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 10px;
      color: #6d7a93;
    }

    .card-wide {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      align-items: center;
      gap: 44px;
    }

    .standard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .standard {
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.03);
    }

    .standard b {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 3px;
      font-size: 12px;
      font-weight: 600;
      color: #dbe3f3;
    }

    .standard b i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 7px rgba(45, 212, 191, 0.8);
    }

    .standard span {
      font-size: 10.5px;
      color: #74809a;
    }

    /* ---------------- 在线演示 ---------------- */

    .demo-grid {
      display: grid;
      grid-template-columns: 0.88fr 1.12fr;
      align-items: center;
      gap: 56px;
    }

    .demo-copy h2 {
      margin-bottom: 18px;
    }

    .demo-copy > p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.85;
    }

    .check-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 26px 0 0;
      padding: 0;
      list-style: none;
    }

    .check-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 13.5px;
      line-height: 1.65;
      color: #aab6cc;
    }

    .check-list b {
      color: #dbe3f3;
      font-weight: 600;
      white-space: nowrap;
    }

    .tick {
      display: grid;
      place-items: center;
      width: 20px;
      height: 20px;
      flex: none;
      margin-top: 1px;
      border: 1px solid rgba(45, 212, 191, 0.26);
      border-radius: 50%;
      background: rgba(45, 212, 191, 0.08);
      color: #5eead4;
    }

    .tick .icon {
      width: 11px;
      height: 11px;
    }

    .demo-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6d7a93;
    }

    .demo-meta i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 9px var(--teal);
      animation: pulse 2.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.35;
      }
    }

    .app-window {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      background: linear-gradient(180deg, #0b0f1a, #080b13);
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.5);
    }

    .app-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.022);
    }

    .app-url {
      padding: 3px 9px;
      border: 1px solid var(--line);
      border-radius: 5px;
      font-family: var(--mono);
      font-size: 9.5px;
      color: #7c8aa5;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5eead4;
    }

    .live-pill i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 8px var(--teal);
    }

    .todo {
      padding: 24px;
    }

    .todo-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .todo-kicker {
      font-size: 9.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6d7a93;
    }

    .todo-head h3 {
      margin: 3px 0 0;
      font-size: 21px;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .todo-count {
      flex: none;
      padding: 5px 9px;
      border: 1px solid rgba(45, 212, 191, 0.18);
      border-radius: 99px;
      background: rgba(45, 212, 191, 0.08);
      font-size: 10px;
      color: #5eead4;
    }

    .todo-input {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .todo-input input {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      color: #e7ecf7;
      font: inherit;
      font-size: 12.5px;
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .todo-input input::placeholder {
      color: #5c6880;
    }

    .todo-input input:focus {
      border-color: rgba(124, 92, 255, 0.6);
      box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.14);
    }

    .todo-input button {
      min-width: 64px;
      height: 42px;
      padding: 0 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(120deg, #7c5cff, #4f46e5);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .todo-input button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .todo-input button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .todo-input button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    .todo-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 164px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .todo-list li {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 11px;
      border: 1px solid transparent;
      border-radius: 9px;
      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .todo-list li:hover {
      border-color: var(--line);
      background: rgba(255, 255, 255, 0.033);
    }

    .todo-check {
      width: 16px;
      height: 16px;
      flex: none;
      margin: 0;
      accent-color: var(--teal);
      cursor: pointer;
    }

    .todo-text {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      color: #c3cddf;
      transition: color 0.2s ease;
    }

    .todo-list li.done .todo-text {
      color: #66738c;
      text-decoration: line-through;
      text-decoration-color: rgba(45, 212, 191, 0.55);
    }

    .todo-del {
      width: 24px;
      height: 24px;
      flex: none;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #4d5970;
      font-size: 17px;
      line-height: 1;
      cursor: pointer;
      opacity: 0;
      transition:
        opacity 0.18s ease,
        background 0.18s ease,
        color 0.18s ease;
    }

    .todo-list li:hover .todo-del,
    .todo-del:focus-visible {
      opacity: 1;
    }

    .todo-del:hover {
      background: rgba(248, 113, 113, 0.12);
      color: #f87171;
    }

    .todo-del:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 1px;
    }

    .todo-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 10.5px;
      color: #6d7a93;
    }

    .todo-foot button {
      padding: 2px 0;
      border: 0;
      background: none;
      color: #8b97b0;
      font-size: 10.5px;
      cursor: pointer;
    }

    .todo-foot button:hover:not(:disabled) {
      color: #e7ecf7;
    }

    .todo-foot button:disabled {
      color: #3f4a60;
      cursor: default;
    }

    .todo-foot button:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
    }

    @media (hover: none) {
      .todo-list li .todo-del {
        opacity: 0.7;
      }
    }

    /* ---------------- 快速开始 ---------------- */

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .step {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.04),
        rgba(255, 255, 255, 0.012)
      );
    }

    .step-no {
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.14em;
      color: #8b6dff;
    }

    .step h3 {
      margin: 10px 0 6px;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .step > p {
      min-height: 3.4em;
      margin-bottom: 14px;
      font-size: 12.5px;
      line-height: 1.7;
      color: var(--muted);
    }

    .snippet {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-width: 0;
      margin-top: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(4, 7, 14, 0.68);
    }

    .snippet-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      height: 30px;
      padding: 0 10px;
      border-bottom: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.06em;
      color: #6d7a93;
    }

    .snippet-top .copy-btn {
      width: 22px;
      height: 22px;
      border-radius: 5px;
    }

    .snippet-top .copy-btn .icon {
      width: 11px;
      height: 11px;
    }

    .snippet pre {
      flex: 1;
      margin: 0;
      padding: 10px 12px;
      overflow: auto;
      font-family: var(--mono);
      font-size: 9.5px;
      line-height: 1.7;
      color: #b9c4da;
    }

    .snippet code {
      font-family: inherit;
      white-space: pre;
    }

    .start-note {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
      padding: 20px 24px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.022);
      font-size: 12.5px;
      color: var(--muted);
    }

    .start-note a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #c4b5fd;
      font-weight: 550;
    }

    .start-note a:hover {
      color: #e9d5ff;
    }

    .start-note .icon {
      width: 13px;
      height: 13px;
    }

    /* ---------------- 生态 ---------------- */

    .eco-grid {
      display: grid;
      grid-template-columns: 0.95fr 1.05fr;
      align-items: stretch;
      gap: 20px;
    }

    .stack {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        radial-gradient(
          120% 90% at 0% 0%,
          rgba(124, 92, 255, 0.12),
          transparent 60%
        ),
        rgba(255, 255, 255, 0.018);
    }

    .stack-head {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
      font-size: 9.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6d7a93;
    }

    .stack-head i {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--violet);
      box-shadow: 0 0 8px rgba(124, 92, 255, 0.9);
    }

    .layer {
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-areas:
        "dot head arrow"
        ". desc .";
      gap: 2px 12px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.024);
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .layer + .layer {
      margin-top: 9px;
    }

    .layer:hover {
      border-color: rgba(124, 92, 255, 0.4);
      background: rgba(255, 255, 255, 0.045);
      transform: translateX(2px);
    }

    .layer-dot {
      grid-area: dot;
      width: 7px;
      height: 7px;
      align-self: center;
      border-radius: 50%;
      background: #7c5cff;
      box-shadow: 0 0 9px rgba(124, 92, 255, 0.7);
    }

    .layer:nth-child(3) .layer-dot {
      background: var(--cyan);
      box-shadow: 0 0 9px rgba(34, 211, 238, 0.7);
    }

    .layer:nth-child(4) .layer-dot {
      background: var(--teal);
      box-shadow: 0 0 9px rgba(45, 212, 191, 0.7);
    }

    .layer:nth-child(5) .layer-dot {
      background: #fbbf24;
      box-shadow: 0 0 9px rgba(251, 191, 36, 0.6);
    }

    .layer-head {
      grid-area: head;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .layer-head b {
      font-size: 14.5px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .layer-head em {
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 99px;
      font-style: normal;
      font-size: 9px;
      letter-spacing: 0.04em;
      color: #74809a;
    }

    .layer-desc {
      grid-area: desc;
      font-size: 11px;
      color: #6f7c95;
    }

    .layer-arrow {
      grid-area: arrow;
      color: #4d5970;
      font-size: 13px;
    }

    .eco-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .eco-card {
      display: flex;
      flex-direction: column;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.035),
        rgba(255, 255, 255, 0.01)
      );
      transition:
        border-color 0.2s ease,
        transform 0.2s ease,
        background 0.2s ease;
    }

    .eco-card:hover {
      border-color: rgba(124, 92, 255, 0.42);
      background: rgba(255, 255, 255, 0.045);
      transform: translateY(-2px);
    }

    .eco-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .eco-top code {
      font-family: var(--mono);
      font-size: 12.5px;
      color: #dbe4f7;
    }

    .eco-arrow {
      color: #4d5970;
      font-size: 13px;
    }

    .eco-card p {
      font-size: 11.5px;
      line-height: 1.65;
      color: #8b97b0;
    }

    .eco-tag {
      margin-top: auto;
      padding-top: 14px;
      font-size: 9px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #6d7a93;
    }

    .eco-more {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;

          transparent 55%
        ),

          85% 120% at 96% 18%,
          rgba(34, 211, 238, 0.22),
          transparent 55%
        ),
        linear-gradient(180deg, #0d1020, #080b13);
      text-align: center;
    }

    .cta-inner::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 54px 54px;
      -webkit-mask-image: radial-gradient(
        ellipse 70% 90% at 50% 0%,
        #000,
        transparent 75%
      );
      mask-image: radial-gradient(
        ellipse 70% 90% at 50% 0%,
        #000,
        transparent 75%
      );
      pointer-events: none;
    }

    .cta-inner > * {

      margin-top: 30px;
    }

    .cta .install {
      margin-top: 24px;

    /* ---------------- 页脚 ---------------- */

    footer {

    /* ---------------- Toast ---------------- */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 100;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 99px;
      background: rgba(15, 20, 34, 0.94);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      font-size: 12.5px;
      color: #e7ecf7;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 14px);
      transition:
        opacity 0.24s ease,
        transform 0.24s ease;
      backdrop-filter: blur(12px);

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);

        <a href="https://github.com/ofajs/ofa.js/blob/v5/LICENSE" target="_blank" rel="noreferrer">MIT License</a>
      </div>
    </div>

    <div class="footer-bottom">
      <span>© 2018–2026 ofa.js · MIT License</span>
      <span class="made"><i></i>这个页面本身，也是用 ofa.js 写的。</span>
    </div>
  </footer>

  <div class="toast" class:show="toastVisible" role="status" aria-live="polite">
    {{toastText}}
  </div>

  <script>
    let uid = 100;

    export default async () => ({
      data: {
        menuOpen: false,
        toastVisible: false,
        toastText: "",
        draft: "",
        todos: [
          { id: 1, text: "用一份 HTML 写出第一个组件", done: true },
          { id: 2, text: "用 o-fill 渲染待办列表", done: false },
          { id: 3, text: "把页面丢到任意静态服务器", done: false },
        ],
        remaining: 2,
        doneCount: 1,
        installCmd: "npm i ofa.js",
        cdnSnippet:
          '<script type="module" src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@refs/heads/v5/dist/ofa.min.mjs"><\/script>',
      },

      watch: {
        todos() {
          this.refreshStats();
        },
      },

      proto: {
        jump(id) {
          this.menuOpen = false;
          const root = this.ele.shadowRoot;
          const target = root && root.getElementById(id);
          if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        },

        toggleMenu() {
          this.menuOpen = !this.menuOpen;
        },

        addTodo() {
          const text = this.draft.trim();
          if (!text) return;
          this.todos.push({ id: ++uid, text, done: false });
          this.draft = "";
          this.refreshStats();
        },

        addOnEnter(event) {
          if (event.key !== "Enter") return;
          event.preventDefault();
          this.addTodo();
        },

        removeTodo(id) {
          const index = this.todos.findIndex((item) => item.id === id);
          if (index > -1) this.todos.splice(index, 1);
          this.refreshStats();
        },

        clearDone() {
          if (!this.doneCount) return;
          this.todos = this.todos.filter((item) => !item.done);
          this.refreshStats();
        },

        refreshStats() {
          const total = this.todos.length;
          let done = 0;
          for (const item of this.todos) {
            if (item.done) done += 1;
          }
          this.doneCount = done;
          this.remaining = total - done;
        },

        showToast(message) {
          this.toastText = message;
          this.toastVisible = true;
          clearTimeout(this._toastTimer);
          this._toastTimer = setTimeout(() => {
            this.toastVisible = false;
          }, 1800);
        },

        async copySnippet(text) {
          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(text);
            } else {
              const area = document.createElement("textarea");
              area.value = text;
              area.style.position = "fixed";
              area.style.opacity = "0";
              document.body.appendChild(area);
              area.select();
              document.execCommand("copy");
              area.remove();
            }
            this.showToast("已复制到剪贴板");
          } catch (error) {
            console.warn("[ofa] copy failed", error);
            this.showToast("复制失败，请手动选择");
          }
        },
      },

      ready() {
        const root = this.ele.shadowRoot;
        if (!root) return;

        if ("IntersectionObserver" in window) {
          this.ele.classList.add("js-reveal");
          const observer = new IntersectionObserver(
            (entries) => {
              for (const entry of entries) {
                if (!entry.isIntersecting) continue;
                entry.target.classList.add("is-in");
                observer.unobserve(entry.target);
              }
            },
            { rootMargin: "0px 0px -8% 0px", threshold: 0.06 },
          );
          root.querySelectorAll("[data-reveal]").forEach((el) => observer.observe(el));
          this._observer = observer;
        }

        this.refreshStats();
      },

      attached() {
        const root = this.ele.shadowRoot;
        this._navWrap = root && root.querySelector(".nav-wrap");
        this._onScroll = () => {
          if (this._navWrap) {
            this._navWrap.classList.toggle("scrolled", window.scrollY > 8);
          }
        };
        window.addEventListener("scroll", this._onScroll, { passive: true });
        this._onScroll();
      },

      detached() {
        window.removeEventListener("scroll", this._onScroll);
        if (this._observer) this._observer.disconnect();
        clearTimeout(this._toastTimer);
      },
    });
  </script>
</template>
