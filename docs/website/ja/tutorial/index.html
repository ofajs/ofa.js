<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ofa.js チュートリアル</title>
    <meta name="description" content="全20回の段階的な ofa.js チュートリアル。最初のページからコンポーネント、コンテキスト、状態、ルーティング、そして完全なプロジェクトまで。" />
    <meta name="theme-color" content="#1a1c1e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ofa.js チュートリアル" />
    <meta property="og:description" content="全20回の段階的な ofa.js チュートリアル。最初のページからコンポーネント、コンテキスト、状態、ルーティング、そして完全なプロジェクトまで。" />
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="../../styles/loading.css"
      media="print"
      onload="this.media='all'"
    />
    <script>
      // 首次访问默认深色；可在顶部切换白天 / 黑夜 / 跟随系统（尊重已有偏好）
      try {
        if (!localStorage.getItem("st-theme-mode"))
          localStorage.setItem("st-theme-mode", "dark");
      } catch {}
    </script>
    <script src="https://cdn.jsdelivr.net/gh/ofajs/senti-ui@main/packages/boot/st-boot.js"></script>
    <noscript><style>#site-loading { display: none; }</style></noscript>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        overflow-x: hidden;
        overflow-x: clip;
      }
      body {
        font-family:
          "Roboto", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      o-app,
      o-page {
        display: block;
        min-height: 100vh;
      }
      noscript {
        display: block;
        padding: 48px 24px;
        text-align: center;
        color: #c3c7cf;
      }

      /* 首屏 critical：只保定位/尺寸/遮罩，装饰样式在 styles/loading.css */
      #site-loading {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        background: var(--md-sys-color-surface, #111318);
        color: var(--md-sys-color-on-surface, #e2e2e9);
        transition: opacity 0.22s ease;
      }

      #site-loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .site-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(260px, 70vw);
      }

      .site-loading-logo {
        display: block;
        width: auto;
        height: 30px;
      }

    </style>
  </head>
  <body>
    <div id="site-loading" role="status" aria-live="polite">
      <div class="site-loading-inner">
        <div class="site-loading-brand" aria-hidden="true">
          <img class="site-loading-logo" src="../../assets/logo.svg" width="28" height="30" alt="" />
          <span class="site-loading-wordmark">ofa<span>.js</span></span>
        </div>
        <div class="site-loading-bar" aria-hidden="true"></div>
        <div class="site-loading-label">
          <span class="site-loading-label-zh">正在加载页面…</span>
          <span class="site-loading-label-tcn">正在載入頁面…</span>
          <span class="site-loading-label-ja">ページを読み込み中…</span>
          <span class="site-loading-label-es">Cargando página…</span>
          <span class="site-loading-label-en">Loading page…</span>
        </div>
      </div>
    </div>

    <!--
      SCSR 契约：本文件既是完整文档，也是页面模块的源文件。
      页面内容内联在 o-app 的 template[page] 中，scsr 接管后把当前 URL
      收编为 o-page，站内跳转使用真实路径。
    -->
    <o-app src="../../app.mjs">
      <template page>

  <link rel="stylesheet" href="../../styles/site.css" />
  <link rel="stylesheet" href="../../styles/docs.css" />
  <l-m src="../../components/docs-layout.html"></l-m>

  <docs-layout attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc docs-intro">
      <p class="doc-kicker">チュートリアル</p>
      <h1>ofa.js をゼロからはじめる</h1>
      <p class="doc-lead">
        全20回の短いレッスンを「はじめに → インタラクションと状態 →
        コンポーネント → 実践的なアプリ」の順に構成しています。どのレッスンも小さな課題から始まります。
        コードを書き換えて Ctrl/⌘+S を押せば、結果をすぐに確認できます。
      </p>

      <h2>はじめに</h2>
      <div class="docs-list">

        <a class="docs-row" olink href="./lesson-1.html">
          <span class="num">01</span>
          <h2>最初のページ</h2>
          <p>ofa.js のページはただの HTML ファイルです。構造、スタイル、ロジックがすべて1つのファイルに収まります。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-2.html">
          <span class="num">02</span>
          <h2>データと補間</h2>
          <p>data には文字列、数値、真偽値、オブジェクト、配列を保持でき、{{ }} では簡単な式も評価できます。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-3.html">
          <span class="num">03</span>
          <h2>動的な属性</h2>
          <p>HTML 属性には attr: を、DOM プロパティには :prop を使います。真偽値属性には必ず attr: を使います。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-4.html">
          <span class="num">04</span>
          <h2>スタイルとクラス</h2>
          <p>ページの &lt;style&gt; はそのページにのみ適用されます。class: と :style を使えば、スタイルをデータの変化に追従させられます。</p>
          <span class="more">学習をはじめる →</span>
        </a>

      </div>

      <h2>インタラクションと状態</h2>
      <div class="docs-list">

        <a class="docs-row" olink href="./lesson-5.html">
          <span class="num">05</span>
          <h2>イベント</h2>
          <p>イベントは on: で監視します。簡単なロジックは式で、複雑なロジックは proto メソッドで書きます。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-6.html">
          <span class="num">06</span>
          <h2>双方向バインディング</h2>
          <p>sync: はフォーム項目とデータを双方向に同期させます。スカラー値に最適です。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-7.html">
          <span class="num">07</span>
          <h2>条件付きレンダリング</h2>
          <p>o-if / o-else-if / o-else はコンテンツの存在自体を制御します。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-8.html">
          <span class="num">08</span>
          <h2>リストレンダリング</h2>
          <p>o-fill は配列を描画します。各リスト項目内では $data、$index、$host を使用できます。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-9.html">
          <span class="num">09</span>
          <h2>リストの編集</h2>
          <p>配列の push/splice はビューを自動的に更新します。インライン編集は $data のフィールドへ直接同期されます。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-10.html">
          <span class="num">10</span>
          <h2>算出プロパティと監視</h2>
          <p>proto のゲッターは同期的に計算します。watch は変更を監視し、副作用を処理します。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-11.html">
          <span class="num">11</span>
          <h2>ライフサイクル</h2>
          <p>ready → attached → loaded と進み、削除時には detached が呼ばれます。タイマーとリスナーは detached でクリーンアップします。</p>
          <span class="more">学習をはじめる →</span>
        </a>

      </div>

      <h2>コンポーネント</h2>
      <div class="docs-list">

        <a class="docs-row" olink href="./lesson-12.html">
          <span class="num">12</span>
          <h2>最初のコンポーネント</h2>
          <p>再利用可能な UI を &lt;template component&gt; に分割し、l-m で読み込みます。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-13.html">
          <span class="num">13</span>
          <h2>コンポーネントのパラメータ</h2>
          <p>外部データは attrs を通じてコンポーネントに届きます。内部では、コンポーネントが自身の状態を data に保持します。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-14.html">
          <span class="num">14</span>
          <h2>スロットとイベント</h2>
          <p>slot はコンポーネントが外部のコンテンツを受け取れるようにします。emit は内部で起きたことを外部に伝えます。</p>
          <span class="more">学習をはじめる →</span>
        </a>

      </div>

      <h2>実践的なアプリ</h2>
      <div class="docs-list">

        <a class="docs-row" olink href="./lesson-15.html">
          <span class="num">15</span>
          <h2>階層をまたぐコンテキスト</h2>
          <p>o-provider / o-consumer を使って、コンポーネントのサブツリー全体でデータを共有します。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-16.html">
          <span class="num">16</span>
          <h2>グローバル状態</h2>
          <p>複数のコンポーネントが1つの状態を共有する場合は、$.stanz でモジュールレベルのストアを作り、attached/detached でマウント・クリーンアップします。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-17.html">
          <span class="num">17</span>
          <h2>ページとルーティング</h2>
          <p>o-app はページスタックを管理します。olink / goto でページを切り替え、query でパラメータを渡し、back で戻ります。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-18.html">
          <span class="num">18</span>
          <h2>ネストされたレイアウト</h2>
          <p>子ページは parent を宣言し、親ページはスロットを通じてそれを受け取ります。子ページを切り替えても親は破棄されません。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-19.html">
          <span class="num">19</span>
          <h2>非同期と読み込み状態</h2>
          <p>非同期リクエストでは loading / error / success の状態で UI を制御します。非同期の結果をゲッターに入れてはいけません。</p>
          <span class="more">学習をはじめる →</span>
        </a>

        <a class="docs-row" olink href="./lesson-20.html">
          <span class="num">20</span>
          <h2>まとめ：Todo リスト</h2>
          <p>リスト、フォーム、条件分岐、算出プロパティ、監視、localStorage を組み合わせて、1つの完全なアプリに仕上げます。</p>
          <span class="more">学習をはじめる →</span>
        </a>

      </div>

      <div class="doc-note">
        <strong>学習の進め方</strong>
        まず解説を読み、次に右側のコードを編集して <kbd>Ctrl</kbd>+<kbd>S</kbd>
        （Mac では <kbd>⌘</kbd>+<kbd>S</kbd>）を押して実行してください。壊してしまった場合は、
        エディタの「リセット」をクリックするとこのレッスンのサンプルに戻せます。
      </div>
    </article>
  </docs-layout>

  <script>
    import { createTutorialPage } from "../../content/page-runtime.mjs";

    export const parent = "../layout.html";

    export default (args) =>
      createTutorialPage({ ...args, sitePath: "../site.json" });
  </script>

      </template>
    </o-app>

    <noscript>このページで ofa.js を実行するには JavaScript が必要です。</noscript>

    <script type="module" src="../../boot.js"></script>
  </body>
</html>
