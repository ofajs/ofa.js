      <h1>Propiedades calculadas y observación</h1>
      <p class="doc-lead">Los getters de proto calculan de forma síncrona; watch observa los cambios y gestiona los efectos secundarios.</p>

      <p>
  Para valores derivados de datos existentes, usa un getter en <code>proto</code>.
  Cuando necesites hacer trabajo adicional después de que cambien los datos (registrar, escribir en un almacenamiento externo), usa <code>watch</code>.
</p>
<l-m src="../../components/playground.html"></l-m>
      <docs-playground lesson="lesson-10" fold-styles="true"></docs-playground>
<h2>Cómo dividen el trabajo los getters y watch</h2>
<ul>
  <li><code>get total()</code>: úsalo en las plantillas como un campo normal; se actualiza automáticamente con sus dependencias;</li>
  <li><code>watch.qty(value, { watchers })</code>: se ejecuta después de que cambian los datos;</li>
  <li>watch se llama una vez durante la inicialización, cuando <code>watchers</code> todavía no existe,
    así que puedes usar <code>if (!watchers) return</code> para omitir esa primera llamada.</li>
</ul>
<div class="doc-note">
  <strong>Límites de los getters:</strong> un getter se evalúa cuando se inicializa la plantilla,
  por lo que solo puede depender de datos síncronos que ya existan. Si dependes de datos asíncronos
  devueltos por una API, primero guarda el resultado en un campo de datos y luego asígnalo en la devolución de llamada asíncrona.
</div>
<h2>Pruébalo tú mismo</h2>
<p>
  Añade una entrada «descuento» (0–1) para que el precio total se calcule con el descuento;
  luego usa watch para registrar los cambios del descuento.
</p>
