      <h1>Estado global</h1>
      <p class="doc-lead">
        Cuando varias páginas o componentes necesitan compartir los mismos datos, crea un estado reactivo
        con <code>$.stanz()</code>. No depende de variables globales y no se persiste
        automáticamente.
      </p>

      <h2>Crear un estado compartido</h2>
      <pre><code>// store.js
export const cart = $.stanz({
  items: [],
  total: 0,
});

export const session = $.stanz({
  user: null,
  theme: "dark",
});</code></pre>
      <p>
        <code>$.stanz()</code> devuelve un proxy profundamente reactivo. Asignar a objetos anidados
        y hacer <code>push</code>/<code>splice</code> en arreglos notifica a todos los consumidores.
      </p>

      <h2>Usarlo en una página</h2>
      <pre><code>&lt;template page&gt;
  &lt;ul&gt;
    &lt;o-fill :value="items" fill-key="id"&gt;
      &lt;li&gt;{{$data.name}} × {{$data.count}}&lt;/li&gt;
    &lt;/o-fill&gt;
  &lt;/ul&gt;

  &lt;script&gt;
    export default async ({ load }) =&gt; {
      const { cart } = await load("./store.js");

      return {
        data: { items: [] },
        attached() {
          this.items = cart.items;
        },
        detached() {
          this.items = [];
        },
      };
    };
  &lt;/script&gt;
&lt;/template&gt;</code></pre>
      <div class="doc-note">
        <strong>Convención de montaje y desmontaje:</strong>
        vincula el estado compartido a tus propios datos en <code>attached</code> y borra la
        referencia en <code>detached</code>, para que el estado no siga haciendo referencia a un
        componente destruido.
      </div>

      <h2>Leer y escribir el estado compartido</h2>
      <pre><code>cart.items.push({
  id: Date.now(),
  name: "productos de ofa.js",
  count: 1,
});

cart.total = cart.items.reduce(
  (sum, item) =&gt; sum + item.count,
  0,
);</code></pre>
      <p>
        Cuando varias páginas leen el mismo <code>cart</code>, un cambio realizado en cualquiera de ellas
        se propaga a las demás páginas y componentes.
      </p>

      <h2>Observar el estado directamente</h2>
      <pre><code>const tid = cart.watch(() =&gt; {
  console.log("el carrito cambió", cart.total);
});

// cuando ya no se necesite
cart.unwatch(tid);</code></pre>
      <p>
        <code>watch</code> observa en profundidad, por lo que los cambios en objetos e arreglos hijos también se disparan.
        Dentro de los componentes es mejor vincular el estado a los datos y dejar que la plantilla se actualice
        automáticamente, en lugar de manipular el DOM a mano.
      </p>
