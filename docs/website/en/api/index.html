        <code>&lt;div id="target"&gt;</code>, and the <code>&lt;script type="module"&gt;</code>

        event, manipulating the DOM directly just like jQuery.
        After editing the code, press <kbd>Ctrl</kbd>+<kbd>S</kbd> or click “Run code” to see the result.
      </p>
