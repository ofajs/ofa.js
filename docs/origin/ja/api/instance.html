      <h1>インスタンスの基本</h1>
      <p class="doc-lead">インスタンスオブジェクトは、DOM ラッパーであり、リアクティブなデータであり、子要素のコレクションでもあります。まずは基本プロパティから見ていきましょう。</p>

<table class="doc-table">

        <tbody>
          <tr><td><code>el.ele</code></td><td>ネイティブな DOM 要素。あらゆるブラウザ API はここを経由して利用します</td></tr>
          <tr><td><code>el.tag</code></td><td>小文字のタグ名（読み取り専用）</td></tr>
          <tr><td><code>el.owner</code></td><td>データの所有チェーン（Set）。リアクティブな更新はこれをさかのぼって伝播します（読み取り専用）</td></tr>
          <tr><td><code>el.length</code></td><td>子要素の数。ele.children.length と一致します（読み取り専用）</td></tr>
          <tr><td><code>el[0], el[1]</code></td><td>インデックスで子要素インスタンスを取得（読み取り専用）</td></tr>
          <tr><td><code>el.index</code></td><td>親の中での位置。親がない場合は null（読み取り専用）</td></tr>
          <tr><td><code>el.PATH</code></td><td>コンポーネント / ページファイルの位置。相対リソースはこれを基準に解決されます（読み取り専用）</td></tr>
          <tr><td><code>el.app</code></td><td>最も近い o-app インスタンス。アプリ外では undefined（読み取り専用）</td></tr>

          <tr><td><code>el.xid</code></td><td>インスタンスの一意な識別子。同じタグのインスタンスを区別するために使います（読み取り専用）</td></tr>
