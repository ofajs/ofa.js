      <h1>行内编辑列表</h1>
      <p class="doc-lead">列表不仅能展示，也能直接编辑。把输入框绑到列表项的字段上即可。</p>

      <docs-playground lesson="lesson-10"></docs-playground>

      <h2>关键点</h2>
      <ul>
        <li><code>sync:value="$data.name"</code> 直接双向绑定当前列表项。</li>
        <li><code>fill-key="id"</code> 保证增删时正确复用列表项。</li>
        <li>删除通过 <code>$host.removeItem($data.id)</code> 调回页面方法。</li>
      </ul>
