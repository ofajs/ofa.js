      <p class="doc-kicker">Getting started</p>
      <h1>第一個組件</h1>
      <p class="doc-lead">
        一個 <code>.html</code> 文件就是一個組件。瀏覽器直接加載它，
        不需要編譯，也不需要註冊到某個打包入口。
      </p>

      <h2>1. 組件文件</h2>
      <p>
        新建 <code>my-counter.html</code>。組件模塊使用
        <code>&lt;template component&gt;</code>，並通過
        <code>tag</code> 聲明標籤名：
      </p>
      <pre><code>&lt;template component&gt;
  &lt;style&gt;
    :host {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
    }
  &lt;/style&gt;

  &lt;span&gt;&lt;slot&gt;&lt;/slot&gt;&lt;/span&gt;
  &lt;strong&gt;{{count}}&lt;/strong&gt;
  &lt;button on:click="decrease"&gt;-&lt;/button&gt;
  &lt;button on:click="increase"&gt;+&lt;/button&gt;

  &lt;script&gt;
    export default {
      tag: "my-counter",
      attrs: {
        initial: 0,
      },
      data: {
        count: 0,
      },
      watch: {
        initial(value) {
          this.count = value;
        },
      },
      ready() {
        this.count = this.initial;
      },
      proto: {
        increase() {
          this.count += 1;
          this.emit("change", { data: { value: this.count } });
        },
        decrease() {
          this.count -= 1;
          this.emit("change", { data: { value: this.count } });
        },
      },
    };
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <div class="doc-note">
        <strong>script 必須在 template 內。</strong>
        ofa.js 只提取 <code>template[component]</code> 或
        <code>template[page]</code> 內部的腳本，寫在模板外會被忽略。
      </div>

      <h2>2. 在頁面裡使用</h2>
      <p>
        用 <code>&lt;l-m&gt;</code> 引入組件文件，然後像普通 HTML 標籤一樣使用。
        標籤名必須與 <code>tag</code> 一致：
      </p>
      <pre><code>&lt;template page&gt;
  &lt;l-m src="./my-counter.html"&gt;&lt;/l-m&gt;

  &lt;my-counter initial="5" on:change="onCountChange"&gt;
    當前計數
  &lt;/my-counter&gt;

  &lt;p&gt;最近一次變化：{{lastChange}}&lt;/p&gt;

  &lt;script&gt;
    export default async () =&gt; ({
      data: { lastChange: "還沒有變化" },
      proto: {
        onCountChange(event) {
          this.lastChange = event.data.value;
        },
      },
    });
  &lt;/script&gt;
&lt;/template&gt;</code></pre>

      <h2>3. 三件事要分清</h2>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead>
          <tr><th>位置</th><th>用途</th><th>例子</th></tr>
        </thead>
        <tbody>
          <tr>
            <td><code>tag</code></td>
            <td>組件的 HTML 標籤名，必須聲明</td>
            <td><code>tag: "my-counter"</code></td>
          </tr>
          <tr>
            <td><code>attrs</code></td>
            <td>從外部傳入的標量屬性</td>
            <td><code>initial="5"</code></td>
          </tr>
          <tr>
            <td><code>data</code></td>
            <td>組件內部響應式狀態</td>
            <td><code>count: 0</code></td>
          </tr>
        </tbody>
      </table>
        </div>
      <p>
        <code>attrs</code> 與 <code>data</code> 的 key 不能重複。數組、對象等
        複雜數據放 <code>data</code>，通過 <code>:prop</code> 傳入；
        <code>attrs</code> 只放字符串、數字等標量。
      </p>

      <h2>4. 插槽與事件</h2>
      <p>
        組件內的 <code>&lt;slot&gt;</code> 會接收使用方寫在標籤裡的內容。
        上面的 <code>&lt;slot&gt;&lt;/slot&gt;</code> 就渲染了「當前計數」。
      </p>
      <p>
        組件用 <code>this.emit("change", { data })</code> 向外拋事件，
        使用方用 <code>on:change</code> 監聽，通過 <code>event.data</code>
        讀取數據。事件默認冒泡，但不會穿出 Shadow DOM；需要跨 shadow
        邊界時加 <code>composed: true</code>。
      </p>
