    <style>
      html,

        overflow-x: clip;
      }

        font-family:

      #site-loading {

        color: var(--md-sys-color-on-surface, #e2e2e9);

      #site-loading.is-hidden {
        opacity: 0;
        pointer-events: none;
      }

      .site-loading-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        width: min(260px, 70vw);
      }

      .site-loading-logo {
        display: block;
        width: auto;
        height: 30px;
      }
