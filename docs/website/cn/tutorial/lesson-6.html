      <h1>搜索与过滤</h1>
      <p class="doc-lead">列表变长之后，用户需要快速找到某一项。用输入框绑定关键字，再用计算属性过滤列表。</p>

      <h2>关键点</h2>
      <ul>
        <li><code>filtered</code> 是一个 getter：关键字变化时自动重新计算。</li>
        <li><code>o-if</code> 根据 <code>filtered.length</code> 显示空状态。</li>
        <li><code>o-fill</code> 直接遍历过滤后的数组，不需要手动隐藏列表项。</li>
      </ul>
