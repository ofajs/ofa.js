      <h1>全局状态</h1>
      <p class="doc-lead">当多个区域需要共享同一份数据时，用 $.stanz 创建响应式状态。</p>

      <h2>试一试</h2>

      <h2>关键点</h2>
      <ul>
        <li>模块级 <code>$.stanz({ count: 0 })</code> 可以被多个区域引用。</li>
        <li><code>store.watch()</code> 返回监听 id，用 <code>store.unwatch(id)</code> 清理。</li>
        <li>面板 A 和 B 显示同一个 <code>count</code>，点按钮会同时更新。</li>
      </ul>

      <div class="doc-note">
        <strong>挑战：</strong>再加一个「-1」按钮，并让两个面板显示不同的标题。
