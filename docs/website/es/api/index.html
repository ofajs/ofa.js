      <h1>Referencia de API</h1>
      <p class="doc-lead">Todos los miembros de instancia, los miembros estáticos globales y ejemplos ejecutables.</p>

      <h2>Pruébalo primero: operar sobre el elemento body con el $ global</h2>
      <p>
        Este ejemplo no es un módulo de página: <code>body</code> contiene un
        <code>&lt;div id="target"&gt;</code> simple, y el <code>&lt;script type="module"&gt;</code>
        de abajo usa el <code>$("#target")</code> global para obtener ese elemento y enlazar un evento
        de clic, manipulando el DOM directamente igual que jQuery.
        Después de editar el código, pulsa <kbd>Ctrl</kbd>+<kbd>S</kbd> o haz clic en «Ejecutar código» para ver el resultado.
      </p>

      <l-m src="../../components/playground.html"></l-m>
      <docs-playground example="globalBody"></docs-playground>

      <div class="doc-note">
        <strong>La API es para la sintaxis fuera de las plantillas:</strong>
        Los métodos de instancia y el <code>$</code> global que aparecen aquí sirven para buscar o
        crear nodos dinámicamente, leer y escribir datos, enlazar eventos y controlar la pila de páginas
        desde JavaScript. La lógica que <code>on:</code>, <code>o-if</code>, <code>o-fill</code> o
        <code>attr:</code> pueden expresar en una plantilla es mejor dejarla en la plantilla.
      </div>

      <p>
        La API está agrupada por finalidad, y cada miembro incluye su firma y descripción.
        El editor de la parte superior de la página te permite cambiar el código y ver el resultado en la
        vista previa de la derecha.
      </p>
