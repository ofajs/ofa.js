      <h1>全局状态</h1>
      <p class="doc-lead">
        多个页面或组件需要共享同一份数据时，用 <code>$.stanz()</code>
        创建响应式状态。它不依赖全局变量，也不会自动持久化。
      </p>

      <h2>创建共享状态</h2>
      <pre><code>// store.js
export const cart = $.stanz({
  items: [],
  total: 0,
});

export const session = $.stanz({
  user: null,
  theme: "dark",
});</code></pre>
      <p>
        <code>$.stanz()</code> 返回深度响应式代理。嵌套对象赋值、数组
        <code>push</code>/<code>splice</code> 都会通知所有引用方。
      </p>

      <h2>在页面中使用</h2>
      <pre><code>&lt;template page&gt;
  &lt;ul&gt;
    &lt;o-fill :value="items" fill-key="id"&gt;
      &lt;li&gt;{{$data.name}} × {{$data.count}}&lt;/li&gt;
    &lt;/o-fill&gt;
  &lt;/ul&gt;

  &lt;script&gt;
    export default async ({ load }) =&gt; {
      const { cart } = await load("./store.js");

      return {
        data: { items: [] },
        attached() {
          this.items = cart.items;
        },
        detached() {
          this.items = [];
        },
      };
    };
  &lt;/script&gt;
&lt;/template&gt;</code></pre>
      <div class="doc-note">
        <strong>挂载/清理约定：</strong>
        在 <code>attached</code> 阶段把共享状态挂到自身 data，
        在 <code>detached</code> 阶段清空引用，避免组件销毁后仍被状态引用。
      </div>

      <h2>读写共享状态</h2>
      <pre><code>cart.items.push({
  id: Date.now(),
  name: "ofa.js 周边",
  count: 1,
});

cart.total = cart.items.reduce(
  (sum, item) =&gt; sum + item.count,
  0,
);</code></pre>
      <p>
        多个页面读取同一个 <code>cart</code> 时，任何一处的修改都会同步到
        其他页面和组件。
      </p>

      <h2>直接监听状态</h2>
      <pre><code>const tid = cart.watch(() =&gt; {
  console.log("购物车变化", cart.total);
});

// 不再需要时
cart.unwatch(tid);</code></pre>
      <p>
        <code>watch</code> 是深度监听，子对象和数组变化也会触发。
        组件里更推荐把状态挂到 data，让模板自动更新，而不是手动操作 DOM。
      </p>

      <h2>局部状态 vs 共享状态</h2>

        </tbody>
