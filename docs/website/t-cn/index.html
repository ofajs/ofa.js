          <p>
            不需要 npm、Node.js、webpack，也不需要理解一整套新的編譯規則。
            瀏覽器本來就支持組件，ofa.js 只是把這件事變得足夠簡單。

          <p>不用安裝，不用配置文件。打開編輯器，寫一個 HTML 文件就夠了。</p>

            <span class="step-no">STEP 01</span>
            <h3>引入 ofa.js</h3>
            <p>複製 v5 的 mjs 地址即可使用，沒有依賴，沒有構建。</p>
            <st-code
              frame
              lang="html"
              title="index.html"
              style="--st-code-radius: var(--md-sys-shape-corner-lg);"
            >
              <textarea hidden>
<script
  type="module"
  src="https://cdn.jsdelivr.net/gh/ofajs/ofa.js@5/dist/ofa.min.mjs"
></script>
              </textarea>
