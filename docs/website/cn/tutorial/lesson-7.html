      <h1>条件渲染</h1>
      <p class="doc-lead">o-if / o-else-if / o-else 控制内容是否存在。</p>

      <p>
  需要根据状态显示不同内容时，用 <code>&lt;o-if :value="条件"&gt;</code>。
  条件为假时内容会被移除，为真时重新创建。
</p>
<l-m src="../../components/playground.html"></l-m>
      <docs-playground lesson="lesson-7"></docs-playground>
<h2>三个标签必须连续</h2>
<ul>
  <li><code>o-if</code> 必须有 <code>:value</code>；</li>
  <li><code>o-else-if</code> 继续判断下一个条件；</li>
  <li><code>o-else</code> 不带 <code>:value</code>，收尾兜底。</li>
</ul>
<div class="doc-note">
  <strong>频繁显隐用 class：</strong>如果只是切换颜色、显示/隐藏，
  优先用 <code>class:</code> 保留 DOM；<code>o-if</code> 会销毁并重建内容，
  适合条件不常变化或需要真正移除资源的场景。
</div>
