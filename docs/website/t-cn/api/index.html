      <h2>先試一個：用全局 $ 操作 body 元素</h2>
      <p>
        這個示例不是 page 模塊：<code>body</code> 裡直接寫
        <code>&lt;div id="target"&gt;</code>，下面的 <code>&lt;script type="module"&gt;</code>
        用全局 <code>$("#target")</code> 取到元素並綁定點擊事件，像 jQuery 一樣直接操作 DOM。
        改代碼後按 <kbd>Ctrl</kbd>+<kbd>S</kbd> 或「運行代碼」看效果。
      </p>

      <l-m src="../../components/playground.html"></l-m>
      <docs-playground example="globalBody"></docs-playground>

      <div class="doc-note">
        <strong>API 適合非模板方式的語法：</strong>
        這裡的實例方法與全局 <code>$</code> 用於在 JS 裡動態查找/創建節點、讀寫數據、
        綁定事件、控制頁面棧等。模板裡能用 <code>on:</code>、<code>o-if</code>、
        <code>o-fill</code>、<code>attr:</code> 表達的邏輯，優先留在模板裡。
      </div>

      <p>

      </p>
