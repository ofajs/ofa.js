<template page>

  <docs-layout attr:label-on-this-page="site.docs.onThisPage">
    <article class="doc">
      <p class="doc-kicker">Plantilla</p>
      <h1>Enlaces y estilos</h1>
      <p class="doc-lead">
        El enlace de propiedades es la parte de las plantillas de ofa.js más fácil de
        confundir: saber cuándo usar <code>:</code>, cuándo usar <code>attr:</code> y
        cuándo usar <code>sync:</code> determina si la página se actualiza correctamente.
      </p>

      <h2>Empecemos por una tabla</h2>
      <div class="doc-table-wrap">
<table class="doc-table">
        <thead>
          <tr><th>Sintaxis</th><th>Dirección</th><th>Más adecuado para</th><th>Atributos booleanos</th></tr>
        </thead>
        <tbody>
          <tr><td><code>:prop</code></td><td>Datos → propiedad</td><td>Valores simples, objetos, arrays</td><td>No adecuado</td></tr>
          <tr><td><code>sync:prop</code></td><td>Bidireccional</td><td>Escalares como cadenas, números y booleanos</td><td>Posible, pero se prefiere attr:</td></tr>
          <tr><td><code>attr:name</code></td><td>Datos → atributo HTML</td><td>href/title/data-*, atributos booleanos</td><td>Obligatorio</td></tr>
          <tr><td><code>class:name</code></td><td>Datos → nombre de clase</td><td>Estados como active/done/disabled</td><td>—</td></tr>
          <tr><td><code>:style.prop</code></td><td>Datos → estilo en línea</td><td>Estilos dinámicos como colores y tamaños</td><td>—</td></tr>
        </tbody>
      </table>
        </div>

      <h2>Enlace unidireccional</h2>
      <pre><code>&lt;input :value="keyword" /&gt;
&lt;my-card :user="user"&gt;&lt;/my-card&gt;
&lt;div :html="articleHtml"&gt;&lt;/div&gt;</code></pre>
      <p>
        <code>:</code> solo escribe datos en la propiedad; la interacción del usuario
        nunca escribe de vuelta en los datos. Los objetos y arrays pasados a componentes
        mediante <code>:prop</code> no se serializan en cadenas.
      </p>

      <h2>Enlace bidireccional</h2>
      <pre><code>&lt;input sync:value="keyword" /&gt;
&lt;input type="checkbox" sync:checked="done" /&gt;
&lt;textarea sync:value="content"&gt;&lt;/textarea&gt;</code></pre>
      <p>
        Los controles de formulario suelen usar <code>sync:</code>. <strong>No lo uses
        para enlazar objetos ni arrays</strong>: v5 prohíbe explícitamente la
        sincronización bidireccional de objetos para evitar confusiones de referencia.
        Evita también enlazar <code>sync:</code> a propiedades declaradas en
        <code>attrs</code>, ya que la serialización en cadenas puede provocar
        actualizaciones circulares.
      </p>

      <h2>attr: atributos HTML y booleanos</h2>
      <pre><code>&lt;a attr:href="detailUrl" attr:title="tip"&gt;Detalle&lt;/a&gt;
&lt;img attr:src="cover" attr:alt="title" /&gt;
&lt;button attr:disabled="loading"&gt;Enviar&lt;/button&gt;
&lt;input attr:readonly="locked" /&gt;
&lt;section attr:hidden="collapsed"&gt;&lt;/section&gt;</code></pre>
      <p>
        <code>attr:</code> serializa el valor en una cadena; pero un valor
        <code>false</code> elimina el atributo por completo, mientras que
        <code>true</code> establece un valor vacío. Eso es exactamente lo que necesitan
        los atributos booleanos.
      </p>
      <div class="doc-note">
        <strong>No uses <code>:disabled="false"</code>.</strong>
        Renderiza <code>disabled="false"</code>, así que el atributo sigue existiendo y el
        botón permanece deshabilitado. Escribe siempre los atributos booleanos como
        <code>attr:disabled="loading"</code>.
      </div>

      <h2>Nombres de clase</h2>
      <pre><code>&lt;li class="todo" class:done="item.done" class:active="item.id === currentId"&gt;
  {{item.text}}
&lt;/li&gt;</code></pre>
      <p>
        <code>class:name</code> añade la clase cuando su condición es verdadera y la
        elimina cuando es falsa. Un elemento puede tener varias. Los atributos de datos
        intrínsecos (type, status, level) se expresan mejor con <code>attr:</code> más
        selectores de atributo:
      </p>
      <pre><code>&lt;div class="message" attr:type="$data.type"&gt;&lt;/div&gt;

.message[type="sent"] { color: #2563eb; }
.message[type="failed"] { color: #dc2626; }</code></pre>

      <h2>Estilos en línea</h2>
      <pre><code>&lt;p :style.color="active ? '#0f766e' : '#64748b'"&gt;&lt;/p&gt;
&lt;div :style.width="width + 'px'" :style.height="height + 'px'"&gt;&lt;/div&gt;
&lt;div :style.backgroundImage="'url(' + cover + ')'"&gt;&lt;/div&gt;</code></pre>
      <p>
        Los nombres de propiedades de estilo usan camelCase (<code>fontSize</code>,
        <code>borderRadius</code>). Los valores deben ser cadenas CSS válidas; añade las
        unidades tú mismo cuando sea necesario.
      </p>

      <h2>data() en hojas de estilo</h2>
      <p>
        Además de los estilos en línea, puedes leer datos dentro de <code>&lt;style&gt;</code>
        con <code>data(field)</code>, lo que resulta práctico para cambiar estilos de
        forma masiva según el estado:
      </p>
      <pre><code>&lt;style&gt;
  :host {
    --accent: data(accentColor);
    border-color: var(--accent);
  }
  .title {
    color: data(titleColor);
  }
&lt;/style&gt;</code></pre>
      <p>
        <code>data()</code> también puede aparecer en condiciones <code>@media</code> y en
        <code>&lt;style&gt;</code> inyectados dinámicamente dentro de <code>o-if</code>;
        cuando los datos cambian, el texto del estilo se reescribe y surte efecto de
        inmediato.
      </p>
      <pre><code>@media screen and (min-width: data(breakpoint + "px")) {
  .layout { grid-template-columns: 1fr 1fr; }
}

&lt;o-if :value="dense"&gt;
  &lt;style&gt;.row { padding: data(padding + "px"); }&lt;/style&gt;
&lt;/o-if&gt;</code></pre>
      <p>Este enfoque solo se aplica a los estilos propios de un componente; para temas entre componentes usa variables CSS o match-var.</p>

      <h2>La interpolación no funciona en valores de atributos</h2>
      <p>
        <code>{{ }}</code> solo analiza el contenido de texto de un elemento. Los dos
        casos siguientes son incorrectos:
      </p>
      <pre><code>&lt;!-- Incorrecto: {{ }} dentro de un atributo no se analiza --&gt;
&lt;a href="{{url}}"&gt;Enlace&lt;/a&gt;
&lt;img title="{{name}}" /&gt;

&lt;!-- Correcto --&gt;
&lt;a attr:href="url"&gt;Enlace&lt;/a&gt;
&lt;img attr:title="name" /&gt;</code></pre>

        Anterior: <a olink href="./template.html">Resumen de directivas →</a>
         · Siguiente: <a olink href="./events.html">Eventos y formularios →</a>
      </p>
    </article>
