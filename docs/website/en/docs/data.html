      <p class="doc-kicker">Data</p>
      <h1>Data and Watchers</h1>
      <p class="doc-lead">
        <code>data</code> is the reactive state of a component or page. It is powered by stanz,
        so deep changes to objects and arrays automatically trigger view updates.
      </p>

      <h2>data is an object, not a function</h2>
      <pre><code>export default async () =&gt; ({
  data: {
    count: 0,
    user: { name: "Alice", tags: [] },
    todos: [],
  },
});</code></pre>
      <p>
        Each component instance has its own data. Assigning to nested objects and array
        <code>push</code>/<code>splice</code>/<code>sort</code> all trigger updates:
      </p>
      <pre><code>this.user.name = "Bob";
this.user.tags.push("admin");
this.todos.splice(index, 1);
this.todos = this.todos.filter((item) =&gt; !item.done);</code></pre>

      <h2>Computed properties</h2>
      <p>Use getters in <code>proto</code>; do not use Vue-style computed:</p>
      <pre><code>data: { count: 0, firstName: "", lastName: "" },
proto: {
  get double() {
    return this.count * 2;
  },
  get fullName() {
    return `${this.firstName} ${this.lastName}`;
  },
  set fullName(value) {
    [this.firstName, this.lastName] = value.split(" ");
  },
},</code></pre>
      <p>Use them in templates like ordinary fields: <code>{{double}}</code>, <code>{{fullName}}</code>.</p>
      <div class="doc-note">
        <strong>Getters are evaluated as soon as the template initializes, before ready.</strong>
        They only suit simple computations that depend on synchronous initial values. Do not put
        computations that depend on async data in a getter; use a data field and assign it in the
        async callback instead, otherwise a <code>TypeError</code> may occur and break rendering
        for the whole page.
      </div>

      <h2>Watchers</h2>
      <pre><code>data: {
  count: 0,
  width: 0,
  height: 0,
  area: 0,
},
watch: {
  count(value, { watchers }) {
    if (!watchers) return; // first call during initialization
    console.log("count changed to", value);
  },
  "width,height"() {
    this.area = this.width * this.height;
  },
  user() {
    // objects and arrays are watched deeply
    console.log("user changed");
  },
},</code></pre>
      <p>
        The second callback argument is <code>{ watchers }</code>, the set of changes merged
        during the current debounce cycle. <code>watchers[0]</code> carries
        <code>name</code>, <code>oldValue</code>, <code>value</code>,
        <code>type</code>, <code>target</code>, and <code>args</code>.
      </p>
      <p>
        A watch function runs once when component initialization completes; at that point
        <code>watchers</code> is empty, and the call is used to establish the watch. If you do
        not need business logic to run during initialization, check
        <code>if (!watchers) return;</code> first.
      </p>

      <h2>Avoiding write-back loops</h2>
      <pre><code>// Wrong: watch count and also change count in the callback
watch: {
  count(value) {
    this.count = value + 1;
  },
},</code></pre>
      <p>
        When you need a derived value, use a computed property, or add an explicit trigger
        condition. Do not unconditionally write back to the watched data inside a watch.
      </p>

      <h2>watch and async data</h2>
      <pre><code>data: { userId: 0, profile: null },
watch: {
  async userId(id) {
    if (!id) return;
    this.profile = await fetchProfile(id);
  },
},</code></pre>
      <p>
        Watch callbacks can be async functions. With concurrent requests, track a request
        sequence number or use <code>AbortController</code> so an older request cannot
        overwrite a newer result.
      </p>
